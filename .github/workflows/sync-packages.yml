name: Sync official package notices

on:
  schedule:
    # 08:30 Asia/Seoul. GitHub may delay scheduled runs.
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: Recheck the entire notice archive
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: package-notice-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify parser
        run: python -m unittest discover -s tools -p 'test_packages.py'
      - name: Collect notices
        env:
          FULL_SCAN: ${{ inputs.full }}
        run: |
          if [ "$FULL_SCAN" = "true" ] || [ "$(TZ=Asia/Seoul date +%u)" = "7" ]; then
            python tools/sync-packages.py --full
          else
            python tools/sync-packages.py
          fi
      - name: Validate history
        run: node tools/test-packages.cjs
      - name: Save verified data
        id: commit
        run: |
          if git diff --quiet -- data/pkg-notices.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/pkg-notices.json
          git commit -m 'Update official package notice history'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
