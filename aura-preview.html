<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오라 미리보기</title>
<style>
  :root {
    --bg: #14121c;
    --panel: #1e1b2a;
    --panel-2: #262238;
    --line: #3a3454;
    --text: #eae6f7;
    --sub: #9a92b8;
    --accent: #56d4b1;
    --accent-2: #7aa7ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    padding: 20px;
    max-width: 860px;
    margin: 0 auto;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  #backBtn {
    display: inline-flex; align-items: center; gap: 4px;
    border: 1px solid var(--line); background: var(--panel);
    color: var(--sub); font-size: 12px; padding: 5px 12px;
    border-radius: 999px; text-decoration: none; margin-bottom: 12px;
  }
  #backBtn:hover { border-color: var(--accent); color: var(--text); }
  .desc { font-size: 13px; color: var(--sub); margin-bottom: 16px; }

  #stage {
    position: relative;
    height: 500px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  #stage.checker {
    background-image:
      linear-gradient(45deg, #24202f 25%, transparent 25%, transparent 75%, #24202f 75%),
      linear-gradient(45deg, #24202f 25%, transparent 25%, transparent 75%, #24202f 75%);
    background-size: 22px 22px;
    background-position: 0 0, 11px 11px;
    background-color: #1a1725;
  }
  .layer {
    position: absolute;
    left: 50%;
    top: 48.4%;  /* 500px 기준 242px — 기존 440px×55%와 동일한 절대 위치 (아래 여유만 늘림) */
    transform-origin: center center;
    pointer-events: none;
    display: none;
  }
  .layer.on { display: block; }
  #layerBack   { z-index: 1; }
  #layerDragon, #layerDragonImg { z-index: 2; }
  #layerFront  { z-index: 3; }
  #stageMsg {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--sub); font-size: 14px; text-align: center; line-height: 1.6;
    padding: 0 30px;
  }
  #bgToggle {
    position: absolute; top: 10px; right: 10px; z-index: 5;
    background: rgba(0,0,0,.35); border: 1px solid var(--line); color: var(--sub);
    font-size: 11px; padding: 4px 10px; border-radius: 6px; cursor: pointer;
  }
  #layerSkin {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; z-index: 0; display: none;
  }
  #layerSkin.on { display: block; }
  .skin-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .skin-btns button {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
    padding: 4px;
    width: 58px; height: 55px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text); font-size: 13px;
    transition: border-color .15s;
  }
  .skin-btns button img { width: 100%; height: 100%; object-fit: contain; }
  .skin-btns button:hover { border-color: var(--sub); }
  .skin-btns button.on { border-color: var(--accent); }

  .preload-desc { font-size: 12px; color: var(--sub); line-height: 1.6; margin-bottom: 8px; }
  #preloadBtn {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    font-size: 13px; padding: 9px 16px; border-radius: 8px; cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  #preloadBtn:hover { border-color: var(--sub); }
  #preloadBtn.armed { border-color: #e6a23a; color: #e6a23a; font-weight: 700; }
  #preloadBtn.running { border-color: var(--accent-2); color: var(--accent-2); }
  #preloadBtn.done { border-color: var(--accent); color: var(--accent); cursor: default; }
  #preloadStat { font-size: 12px; color: var(--sub); margin-top: 8px; line-height: 1.6; white-space: pre-line; }

  .section { margin-bottom: 14px; }
  .section h2 { font-size: 13px; color: var(--sub); margin-bottom: 8px; font-weight: 600; }
  .effect-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .effect-btns button {
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: border-color .15s;
  }
  .effect-btns button:hover { border-color: var(--sub); }
  .effect-btns button.on { border-color: var(--accent); color: var(--accent); font-weight: 700; }

  #dragonGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
    gap: 8px;
  }
  .dragon-icon {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    aspect-ratio: 1;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    overflow: hidden;
    transition: border-color .15s;
    padding: 4px;
  }
  .dragon-icon:hover { border-color: var(--sub); }
  .dragon-icon.on { border-color: var(--accent); }
  .dragon-icon img { width: 100%; height: 100%; object-fit: contain; }
  .dragon-icon .nm {
    font-size: 10px; color: var(--sub);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }

</style>
</head>
<body>

<a href="index.html?tab=convenience" id="backBtn">← 메인으로</a>
<h1>오라 미리보기</h1>
<p class="desc">이펙트와 드래곤을 선택하면 장착 모습을 미리 볼 수 있어요. 게임 내에서는 장착 후 해제할 수 없으니 여기서 먼저 확인하세요!</p>

<div id="stage" class="checker">
  <button id="bgToggle">배경 전환</button>
  <img id="layerSkin" alt="">
  <img class="layer" id="layerBack" alt="">
  <canvas class="layer" id="layerDragon"></canvas>
  <img class="layer" id="layerDragonImg" alt="">
  <img class="layer" id="layerFront" alt="">
  <div id="stageMsg">아래에서 이펙트와 드래곤을 선택해 주세요</div>
</div>

<div class="section">
  <h2>이펙트</h2>
  <div class="effect-btns" id="effectBtns"></div>
</div>

<div class="section">
  <h2>동굴 스킨</h2>
  <div class="skin-btns" id="skinBtns"></div>
</div>

<div class="section">
  <h2>드래곤</h2>
  <div class="effect-btns" id="elemBtns" style="margin-bottom:8px;"></div>
  <div id="dragonGrid"></div>
</div>

<div class="section">
  <h2>전체 미리 받기</h2>
  <p class="preload-desc">모든 드래곤 애니메이션(약 3.4GB)을 미리 다운로드 받는 기능입니다. 한 번 받아두면 다음부터는 로딩 없이 바로 재생. 중간에 멈춰도 이어받기 됩니다.</p>
  <button id="preloadBtn">전체 드래곤 한 번에 받아두기 (약 3.4GB)</button>
  <div id="preloadStat"></div>
</div>

/* ── 프레임 PNG 시퀀스 플레이어 ── */
const player = {
  ctx: layerDragon.getContext('2d'),
  frames: null, t0: 0, raf: 0, token: 0,

  async _img(url) {
    // 캐시 우선 → 없으면 네트워크에서 받아 캐시에 저장 (미리 받기와 공유)
    try {
      const cache = await caches.open(CACHE_NAME);
      let res = await cache.match(url);
      if (!res) {
        res = await fetch(url);
        if (!res.ok) return null;
        try { await cache.put(url, res.clone()); } catch (e) { /* 저장공간 부족 시 그냥 재생만 */ }
      }
      const blob = await res.blob();
      return await new Promise(resolve => {
        const im = new Image();
        im.onload = () => { URL.revokeObjectURL(im.src); resolve(im); };
        im.onerror = () => { URL.revokeObjectURL(im.src); resolve(null); };
        im.src = URL.createObjectURL(blob);
      });
    } catch (e) {
      // Cache API 미지원 환경 폴백
      return new Promise(res => {
        const im = new Image();
        im.onload = () => res(im);
        im.onerror = () => res(null);
        im.src = url;
      });
    }
  },

  async load(urlFor) {
    const my = ++this.token;
    this.stop();
    const frames = [];
    let i = 0, done = false;
    while (!done && i < 1000) {
      // 12장씩 병렬 로드 (없는 번호가 나오면 거기서 끝)
      const batch = [];
      for (let b = 0; b < 12; b++) batch.push(this._img(urlFor(i + b)));
      const results = await Promise.all(batch);
      if (my !== this.token) return false;
      for (const r of results) {
        if (r) frames.push(r);
        else { done = true; break; }
      }
      i += 12;
      if (!done) {
        stageMsg.textContent = '드래곤 로딩 중… ' + frames.length + '장';
        stageMsg.style.display = 'flex';
      }
    }
    if (my !== this.token) return false;
    if (!frames.length) throw new Error('no frames');
    this.frames = frames;
    layerDragon.width = frames[0].naturalWidth;
    layerDragon.height = frames[0].naturalHeight;
    this.t0 = performance.now();
    this.play();
    return true;
  },


  play() {
    cancelAnimationFrame(this.raf);
    const step = () => {
      this.raf = requestAnimationFrame(step);
      const fr = this.frames;
      if (!fr) return;
      const fi = Math.floor((performance.now() - this.t0) / 1000 * DRAGON_FPS) % fr.length;
      const ctx = this.ctx;
      ctx.clearRect(0, 0, layerDragon.width, layerDragon.height);
      ctx.drawImage(fr[fi], 0, 0);
    };
    step();
  },

  stop() {
    cancelAnimationFrame(this.raf);
    this.frames = null;
  }
};

function applyTransform(el, dy, scale) {
  el.style.transform = 'translate(-50%, calc(-50% - ' + dy + 'px)) scale(' + scale + ')';
}

function applyImgLayer(img, src, dy, scale) {
  if (!src) { img.classList.remove('on'); img.removeAttribute('src'); return; }
  img.src = src;
  applyTransform(img, dy, scale);
  img.classList.add('on');
}

async function showDragon(dr) {
  layerDragonImg.classList.remove('on');
  layerDragon.classList.remove('on');
  const dy = dr.dy || 0;
  const sc = dr.scale || 1;
  try {
    const base = ANIM_BASE(dr.id);
    const ok = await player.load(i => base + FRAME_FILE(i));
    if (!ok) return;
    applyTransform(layerDragon, dy, sc);
    layerDragon.classList.add('on');
    stageMsg.style.display = 'none';
    stageMsg.textContent = DEFAULT_MSG;
  } catch (e) {
    player.stop();
    stageMsg.textContent = '"' + dr.name + '" 애니메이션은 아직 준비되지 않았어요 (gif/' + dr.id + '/' + FRAME_FILE(0) + ')';
    stageMsg.style.display = 'flex';
  }
}

function render() {
  if (curEffect) {
    applyImgLayer(layerBack, curEffect.back, curEffect.dy || 0, (curEffect.scale || 1) * FX_BASE_SCALE);
    applyImgLayer(layerFront, curEffect.front, curEffect.dy || 0, (curEffect.scale || 1) * FX_BASE_SCALE);
  } else {
    applyImgLayer(layerBack, null); applyImgLayer(layerFront, null);
  }
  if (curDragon) {
    showDragon(curDragon);
  } else {
    player.stop();
    layerDragon.classList.remove('on');
    layerDragonImg.classList.remove('on');
  }
  if (!curEffect && !curDragon) {
    stageMsg.textContent = DEFAULT_MSG;
    stageMsg.style.display = 'flex';
  } else if (curEffect && !curDragon) {
    stageMsg.style.display = 'none';
  }
}

const ELEMS = ['전체', '땅', '물', '불', '바람', '빛', '어둠', '황혼', '여명', '악몽'];

ELEMS.forEach(el => {
  const b = document.createElement('button');
  b.textContent = el;
  if (el === curElem) b.classList.add('on');
  b.addEventListener('click', () => {
    curElem = el;
    [...elemBtns.children].forEach(c => c.classList.toggle('on', c === b));
    renderDragonGrid();
  });
  elemBtns.appendChild(b);
});

function renderDragonGrid() {
  dragonGrid.innerHTML = '';
  const list = curElem === '전체' ? DRAGONS : DRAGONS.filter(dr => dr.elem === curElem);
  list.forEach(dr => {
    const d = document.createElement('div');
    d.className = 'dragon-icon';
    if (curDragon && curDragon.id === dr.id) d.classList.add('on');
    d.innerHTML = '<img src="' + dr.icon + '" alt="' + dr.name + '" loading="lazy"><span class="nm">' + dr.name + '</span>';
    d.querySelector('img').addEventListener('error', function () { this.style.display = 'none'; });
    d.addEventListener('click', () => {
      curDragon = dr;
      [...dragonGrid.children].forEach(c => c.classList.toggle('on', c === d));
      render();
    });
    dragonGrid.appendChild(d);
  });
}

preloadBtn.addEventListener('click', async () => {
  if (preState === 'idle') {
    // 1차 클릭 → 와이파이 경고 + 재확인
    preState = 'armed';
    preloadBtn.classList.add('armed');
    preloadBtn.textContent = '⚠️ 한 번 더 누르면 시작합니다';
    preloadStat.textContent = '⚠️ 약 3.4GB를 내려받아요. 반드시 와이파이(Wi-Fi)에 연결된 상태에서 진행해 주세요!\n모바일 데이터로 받으면 요금이 크게 나올 수 있어요.';
    clearTimeout(armTimer);
    armTimer = setTimeout(() => {   // 8초 안에 재클릭 없으면 원상복구
      if (preState === 'armed') {
        preState = 'idle';
        preloadBtn.classList.remove('armed');
        preloadBtn.textContent = PRELOAD_IDLE_LABEL;
        preloadStat.textContent = '';
      }
    }, 8000);
    return;
  }
  if (preState === 'armed') {
    // 2차 클릭 → 시작
    clearTimeout(armTimer);
    preState = 'running';
    preStop = false;
    preloadBtn.classList.remove('armed');
    preloadBtn.classList.add('running');
    preloadBtn.textContent = '⏸ 중지';
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    await runPreload();
    return;
  }
  if (preState === 'running') { preStop = true; preloadBtn.textContent = '멈추는 중…'; }
});

async function runPreload() {
  let cache;
  try { cache = await caches.open(CACHE_NAME); }
  catch (e) {
    preloadStat.textContent = '이 브라우저에서는 미리 받기를 지원하지 않아요.';
    resetPreloadBtn(); return;
  }
  let bytes = 0, doneCnt = 0;
  try {
    for (const dr of DRAGONS) {
      if (preStop) break;
      const base = ANIM_BASE(dr.id);
      let i = 0, miss = false;
      while (!miss && i < 1000) {
        const jobs = [];
        for (let b = 0; b < 8; b++) {
          const url = base + FRAME_FILE(i + b);
          jobs.push((async () => {
            if (await cache.match(url)) return 'hit';
            const r = await fetch(url).catch(() => null);
            if (!r || !r.ok) return 'miss';
            const size = +r.headers.get('content-length') || 0;
            await cache.put(url, r);
            return size;
          })());
        }
        const results = await Promise.all(jobs);
        for (const r of results) {
          if (r === 'miss') { miss = true; break; }
          if (typeof r === 'number') bytes += r;
        }
        i += 8;
        preloadStat.textContent = '받는 중… ' + doneCnt + '/' + DRAGONS.length + '마리 · ' + fmtMB(bytes) + '\n현재: ' + dr.name;
        if (preStop) break;
      }
      doneCnt++;
    }
  } catch (e) {
    preloadStat.textContent = '저장 공간이 부족해서 중단됐어요 (' + doneCnt + '/' + DRAGONS.length + '마리 · ' + fmtMB(bytes) + ').\n기기 저장 공간을 확보한 뒤 다시 눌러 주세요. 받은 부분까지는 저장돼 있어요.';
    resetPreloadBtn(); return;
  }
  if (preStop) {
    preloadStat.textContent = '중지됨 — ' + doneCnt + '/' + DRAGONS.length + '마리까지 받아뒀어요 (' + fmtMB(bytes) + ').\n다시 누르면 이어서 받아요.';
    resetPreloadBtn();
  } else {
    preState = 'done';
    preloadBtn.classList.remove('running');
    preloadBtn.classList.add('done');
    preloadBtn.textContent = '✓ 전체 받기 완료';
    preloadStat.textContent = '완료! 이제 모든 드래곤이 로딩 없이 바로 재생돼요.' + (bytes ? ' (이번에 받은 용량: ' + fmtMB(bytes) + ')' : '');
  }
}

function resetPreloadBtn() {
  preState = 'idle';
  preloadBtn.classList.remove('armed', 'running');
  preloadBtn.textContent = PRELOAD_IDLE_LABEL;
}



render();
</script>
</body>
</html>
