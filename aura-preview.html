<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강림 미리보기 (Spine)</title>
<style>
  :root {
    --bg: #14121c;
    --panel: #1e1b2a;
    --panel-2: #262238;
    --line: #3a3454;
    --text: #eae6f7;
    --sub: #9a92b8;
    --accent: #56d4b1;
    --accent-2: #7aa7ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    padding: 34px 20px 40px;
    max-width: 860px;
    margin: 0 auto;
  }

  /* 기존 오라 미리보기와 같은 형태 */
  #backBtn {
    display: inline-flex; align-items: center; gap: 4px;
    border: 1px solid var(--line); background: var(--panel);
    color: var(--sub); font-size: 12px; padding: 5px 12px;
    border-radius: 999px; text-decoration: none; margin-bottom: 12px;
  }
  #backBtn:hover { border-color: var(--accent); color: var(--text); }
  /* 무대와 오른쪽 목록의 윗선을 맞추기 위한 여백 */
  #backBtn { margin-bottom: 16px; }

  .layout { display: block; }
  .col-main, .col-side { min-width: 0; }

  /* 넓은 화면: 왼쪽 무대 · 오른쪽 드래곤 목록.
     목록이 화면에 고정돼 스크롤 없이 고르고 바로 확인할 수 있습니다. */
  @media (min-width: 1000px) {
    body { max-width: 1200px; }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 20px;
      align-items: start;
    }
    .col-side { position: sticky; top: 34px; }
    .col-side .section { margin-bottom: 0; }
    #dragonGrid { max-height: calc(100vh - 250px); }
  }

  /* 좁은 화면: 무대를 위에 붙여 목록을 훑는 동안에도 보이게 */
  @media (max-width: 999px) {
    body { padding-top: 24px; }
    #stage { position: sticky; top: 8px; z-index: 10; }
    #backBtn { margin-bottom: 12px; }
  }

  #stage {
    position: relative;
    height: 500px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 18px;
  }
  #stage.checker {
    background-image:
      linear-gradient(45deg, #24202f 25%, transparent 25%, transparent 75%, #24202f 75%),
      linear-gradient(45deg, #24202f 25%, transparent 25%, transparent 75%, #24202f 75%);
    background-size: 22px 22px;
    background-position: 0 0, 11px 11px;
    background-color: #1a1725;
  }
  @media (max-width: 700px) {
    #stage { height: 340px; }
  }
  #layerSkin {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; z-index: 0; display: none;
  }
  #layerSkin.on { display: block; }
  #layerBack, #layerFront {
    position: absolute; left: 50%; top: 48.4%;
    transform-origin: center center;
    pointer-events: none; display: none;
    image-rendering: auto;
  }
  #layerBack { z-index: 1; }
  #layerFront { z-index: 3; }
  #layerBack.on, #layerFront.on { display: block; }
  #layerDragon {
    position: absolute;
    left: 50%;
    top: 48.4%;
    transform-origin: center center;
    pointer-events: none;
    z-index: 2;
    display: none;
  }
  #layerDragon.on { display: block; }
  #stageMsg {
    position: absolute; inset: 0; z-index: 5;
    white-space: pre-line;
    display: flex; align-items: center; justify-content: center;
    color: var(--sub); font-size: 14px; text-align: center; line-height: 1.6;
    padding: 0 30px;
  }

  .section { margin-bottom: 14px; }
  .section h2 { font-size: 13px; color: var(--sub); margin-bottom: 8px; font-weight: 600; }

  .ctrl-row { display: flex; gap: 18px 20px; flex-wrap: wrap; align-items: flex-start; }
  .ctrl-row + .ctrl-row { margin-top: -4px; }
  .ctrl h2 { font-size: 13px; color: var(--sub); margin-bottom: 8px; font-weight: 600; }
  #secSet { min-width: 300px; }
  #secDeco { min-width: 186px; }
  #secMotion { min-width: 100px; }
  .ctrl .btn-row button { padding: 6px 11px; font-size: 12px; }
  .ctrl-skin { min-width: 200px; flex: 0 1 230px; }
  @media (max-width: 700px) {
    .ctrl-row { gap: 14px; }
    .ctrl-skin { flex: 1 1 100%; }
  }

  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-row button {
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: border-color .15s;
  }
  .btn-row button:hover { border-color: var(--sub); }
  .btn-row button.on { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .btn-row button:disabled { opacity: .35; cursor: not-allowed; }
  .btn-row button:disabled:hover { border-color: var(--line); }

  .icon-select { position: relative; }
  .icon-select > button {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    padding: 7px 10px;
    cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    transition: border-color .15s;
  }
  .icon-select > button:hover { border-color: var(--sub); }
  .icon-select > button:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
  .icon-select.open > button { border-color: var(--accent); }
  .icon-thumb {
    width: 40px; height: 38px; flex: 0 0 auto;
    border-radius: 5px; background: var(--panel);
    background-size: cover; background-position: center;
    border: 1px solid var(--line);
  }
  .icon-name { flex: 1; text-align: left; }
  .icon-caret { color: var(--sub); font-size: 11px; transition: transform .15s; }
  .icon-select.open .icon-caret { transform: rotate(180deg); }

  .icon-menu {
    display: none;
    position: absolute; z-index: 20; top: calc(100% + 6px); left: 0; right: 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 6px;
    max-height: 300px; overflow-y: auto;
    box-shadow: 0 12px 28px rgba(0,0,0,.5);
  }
  .icon-select.open .icon-menu { display: block; }
  .icon-opt {
    width: 100%;
    display: flex; align-items: center; gap: 10px;
    background: none; border: 1px solid transparent; border-radius: 7px;
    color: var(--text); font-family: inherit; font-size: 13px;
    padding: 5px 7px; cursor: pointer; text-align: left;
  }
  .icon-opt:hover, .icon-opt:focus-visible { background: var(--panel-2); outline: none; }
  .icon-opt.on { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .icon-opt .icon-thumb { width: 46px; height: 40px; }

  @media (prefers-reduced-motion: reduce) {
    .icon-caret, .icon-select > button { transition: none; }
  }

  .picker {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px;
  }
  .picker-bar {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 10px; flex-wrap: wrap;
  }
  .picker-bar:last-of-type { margin-bottom: 12px; }
  .picker .icon-select { flex: 0 0 168px; }

  #searchInput {
    flex: 1 1 180px; min-width: 0;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit; font-size: 13px;
    padding: 8px 12px;
  }
  #searchInput::placeholder { color: var(--sub); }
  #searchInput:focus { outline: none; border-color: var(--accent); }

  .seg { display: inline-flex; background: var(--panel-2);
         border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
  .seg button {
    background: none; border: none; border-radius: 6px;
    color: var(--sub); font-family: inherit; font-size: 12px;
    padding: 5px 12px; cursor: pointer;
  }
  .seg button:hover { color: var(--text); }
  .seg button.on { background: var(--line); color: var(--text); font-weight: 700; }

  .picker-count { margin-left: auto; font-size: 12px; color: var(--sub); }

  #dragonGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 1px 10px;
    max-height: 320px;
    overflow-y: auto;
    padding: 2px;
    scrollbar-width: thin;
  }
  #dragonGrid::-webkit-scrollbar { width: 8px; }
  #dragonGrid::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  #dragonGrid.empty { display: block; color: var(--sub); font-size: 13px;
                      text-align: center; padding: 40px 0; }

  .dragon-row {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 8px;
    border: 1px solid transparent;
    border-radius: 6px;
    cursor: pointer;
    min-width: 0;
    transition: background .12s, border-color .12s, opacity .15s;
  }
  .dragon-row:hover { background: var(--panel-2); }
  .dragon-row.on { background: var(--panel-2); border-color: var(--accent); }
  .dragon-row.missing { opacity: .32; }
  .dragon-row img {
    flex: 0 0 30px; width: 30px; height: 30px; object-fit: contain;
  }
  .dragon-row .nm {
    flex: 1 1 auto; min-width: 0;
    font-size: 12px; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dragon-row.on .nm { color: var(--accent); font-weight: 700; }
  @media (prefers-reduced-motion: reduce) { .dragon-row { transition: none; } }

</style>
</head>
<body>

<a href="index.html?tab=convenience" id="backBtn">← 메인으로</a>

<div class="layout">
<div class="col-main">

<div id="stage" class="checker">
  <img id="layerSkin" alt="">
  <canvas id="layerBack"></canvas>
  <canvas id="layerDragon"></canvas>
  <canvas id="layerFront"></canvas>
  <div id="stageMsg">아래에서 드래곤을 선택해 주세요</div>
</div>

<div class="section ctrl-row">

  <div class="ctrl" id="secSet">
    <h2>단계</h2>
    <div class="btn-row" id="setBtns"></div>
  </div>

  <div class="ctrl" id="secDeco">
    <h2>장식</h2>
    <div class="btn-row" id="decoBtns"></div>
  </div>

  <div class="ctrl" id="secMotion">
    <h2>모션</h2>
    <div class="btn-row" id="motionBtns"></div>
  </div>

  <div class="ctrl ctrl-skin">
    <h2>동굴 배경</h2>
    <div class="icon-select" id="skinSelect">
    <button type="button" id="skinTrigger" aria-haspopup="listbox" aria-expanded="false">
      <span class="icon-thumb" id="skinThumb"></span>
      <span class="icon-name" id="skinName">없음</span>
      <span class="icon-caret" aria-hidden="true">▾</span>
    </button>
      <div class="icon-menu" id="skinMenu" role="listbox" aria-label="동굴 배경"></div>
    </div>
  </div>

</div>

<div class="section">
  <h2>오라</h2>
  <div class="btn-row" id="auraBtns"></div>
</div>

</div><div class="col-side">

<div class="section">
  <h2>드래곤</h2>
  <div class="picker">

    <div class="picker-bar">
      <input type="search" id="searchInput" placeholder="이름 검색" autocomplete="off">
      <div class="icon-select" id="elemSelect">
        <button type="button" id="elemTrigger" aria-haspopup="listbox" aria-expanded="false">
          <span class="icon-thumb" id="elemThumb"></span>
          <span class="icon-name" id="elemName">전체 속성</span>
          <span class="icon-caret" aria-hidden="true">▾</span>
        </button>
        <div class="icon-menu" id="elemMenu" role="listbox" aria-label="속성"></div>
      </div>
    </div>

    <div class="picker-bar">
      <div class="seg" id="kindSeg" role="group" aria-label="분류"></div>
      <span class="picker-count" id="pickerCount"></span>
    </div>

    <div id="dragonGrid"></div>
  </div>
</div>

</div>
</div>


<script>
/* ============================================================
   최소 Spine 3.x 런타임 (region attachment 전용)
   지원: bone rotate/translate/scale, slot attachment/color(alpha),
        drawOrder, bezier/stepped 커브, 아틀라스 rotate 리전
   미지원: mesh, IK/transform constraint, RGB 틴트, additive blend
   ============================================================ */

/* ---------- 아틀라스 파서 ---------- */
function parseAtlas(text){
  const lines = text.split(/\r?\n/);
  const regions = {};
  let i = 0, page = null, cur = null;

  while(i < lines.length){
    const line = lines[i];
    if(line.trim() === ''){ cur = null; i++; continue; }

    if(!page){ page = line.trim(); i++;
      // 페이지 헤더(size/format/filter/repeat) 건너뛰기
      while(i < lines.length && lines[i].indexOf(':') !== -1){ i++; }
      continue;
    }
    if(line.indexOf(':') === -1){
      cur = line.trim();
      regions[cur] = { name: cur, rotate:false, x:0,y:0,w:0,h:0,
                       ow:0,oh:0, ox:0,oy:0 };
      i++; continue;
    }
    const idx = line.indexOf(':');
    const key = line.slice(0, idx).trim();
    const val = line.slice(idx+1).trim();
    const nums = val.split(',').map(s => parseFloat(s));
    const r = regions[cur];
    if(r){
      if(key === 'rotate')      r.rotate = (val === 'true');
      else if(key === 'xy')     { r.x = nums[0]; r.y = nums[1]; }
      else if(key === 'size')   { r.w = nums[0]; r.h = nums[1]; }
      else if(key === 'orig')   { r.ow = nums[0]; r.oh = nums[1]; }
      else if(key === 'offset') { r.ox = nums[0]; r.oy = nums[1]; }
    }
    i++;
  }
  // 짧은 이름(마지막 경로 조각)으로도 찾을 수 있게 별칭 추가
  const alias = {};
  for(const k in regions){
    alias[k] = regions[k];
    const short = k.split('/').pop();
    if(!(short in alias)) alias[short] = regions[k];
  }
  return { page, regions: alias };
}

/* ---------- 커브 보간 ---------- */
function bezierAt(p1, p2, t){
  const u = 1 - t;
  return 3*u*u*t*p1 + 3*u*t*t*p2 + t*t*t;
}
function curvePercent(curve, percent){
  if(curve === undefined || curve === null) return percent;       // 선형
  if(curve === 'stepped') return 0;                                // 계단
  const c1 = curve[0], c2 = curve[1], c3 = curve[2], c4 = curve[3];
  let lo = 0, hi = 1, t = percent;
  for(let i = 0; i < 14; i++){
    const x = bezierAt(c1, c3, t);
    if(x < percent) lo = t; else hi = t;
    t = (lo + hi) / 2;
  }
  return bezierAt(c2, c4, t);
}
/* 각도를 -180~180으로 감기 (최단 경로) */
function wrapDeg(a){
  a = a % 360;
  if(a > 180) a -= 360;
  else if(a < -180) a += 360;
  return a;
}
const DEG = Math.PI / 180;

/* ---------- 스켈레톤 ---------- */
class Skeleton{
  constructor(json, atlas, image){
    this.json = json;
    this.atlas = atlas;
    this.image = image;

    // 본
    this.bones = [];
    this.boneMap = {};
    for(const bd of json.bones){
      const b = {
        name: bd.name,
        parent: bd.parent ? this.boneMap[bd.parent] : null,
        len: bd.length || 0,
        // 셋업 포즈
        sx: bd.x || 0, sy: bd.y || 0,
        srot: bd.rotation || 0,
        sscx: bd.scaleX === undefined ? 1 : bd.scaleX,
        sscy: bd.scaleY === undefined ? 1 : bd.scaleY,
        // 현재 포즈
        x:0, y:0, rot:0, scx:1, scy:1,
        // 월드 행렬
        a:1, b:0, c:0, d:1, wx:0, wy:0
      };
      this.bones.push(b);
      this.boneMap[b.name] = b;
    }

    // 슬롯
    this.slots = [];
    this.slotMap = {};
    json.slots.forEach((sd, i) => {
      const s = {
        name: sd.name,
        bone: this.boneMap[sd.bone],
        setupAttachment: sd.attachment || null,
        setupAlpha: sd.color ? parseInt(sd.color.slice(6,8),16)/255 : 1,
        attachment: null,
        alpha: 1,
        order: i
      };
      this.slots.push(s);
      this.slotMap[s.name] = s;
    });
    this.drawOrder = this.slots.slice();

    // 스킨(어태치먼트) — region 전용
    this.skins = {};
    for(const skinName in json.skins){
      const skin = json.skins[skinName];
      const built = {};
      for(const slotName in skin){
        built[slotName] = {};
        for(const attName in skin[slotName]){
          const ad = skin[slotName][attName];
          const regionName = ad.name || attName;
          const reg = atlas.regions[regionName] ||
                      atlas.regions[regionName.split('/').pop()];
          if(!reg){ console.warn('아틀라스 리전 없음:', regionName); continue; }
          built[slotName][attName] = this.buildAttachment(ad, reg);
        }
      }
      this.skins[skinName] = built;
    }
    // 'default'를 맨 앞에 두고 순서 고정
    this.skinNames = Object.keys(this.skins)
      .sort((a,b) => (a==='default'?-1:0) - (b==='default'?-1:0));
    this.curSkin = this.skinNames[0];
    this.attachments = this.skins[this.curSkin];

    // 애니메이션 길이 계산
    this.animations = {};
    for(const name in json.animations){
      this.animations[name] = {
        data: json.animations[name],
        duration: animDuration(json.animations[name])
      };
    }
  }

  /* region attachment의 로컬 변환 행렬 미리 계산
     이미지 픽셀(u,v) → 본 로컬 좌표(y-up) 매핑을 2x3 행렬로 */
  buildAttachment(ad, reg){
    const w  = ad.width, h = ad.height;
    const scX = ad.scaleX === undefined ? 1 : ad.scaleX;
    const scY = ad.scaleY === undefined ? 1 : ad.scaleY;
    const rot = ad.rotation || 0;
    const ax  = ad.x || 0, ay = ad.y || 0;

    // 아틀라스에 90도 회전 저장된 리전은 그린 폭/높이가 뒤바뀜
    const rw = reg.rotate ? reg.h : reg.w;
    const rh = reg.rotate ? reg.w : reg.h;

    const rsx = (w / reg.ow) * scX;
    const rsy = (h / reg.oh) * scY;

    const localX  = -w/2 * scX + reg.ox * rsx;
    const localY  = -h/2 * scY + reg.oy * rsy;
    const localY2 = localY + rh * rsy;

    // P: 이미지픽셀 → 회전 전 로컬 (canvas 행렬 표기 [a,b,c,d,e,f])
    let P = [ rsx, 0, 0, -rsy, localX, localY2 ];

    // 아틀라스 회전 리전이면 이미지 좌표계를 한 번 더 돌려줌
    if(reg.rotate){
      // 소스에서는 (w,h)가 (rh,rw)로 저장돼 있으므로 -90도 회전 후 보정
      P = mul(P, [0, -1, 1, 0, 0, 0]);
      P = mul(P, [1, 0, 0, 1, 0, -reg.h]);
    }

    const cos = Math.cos(rot * DEG), sin = Math.sin(rot * DEG);
    const R = [ cos, sin, -sin, cos, 0, 0 ];
    const T = [ 1, 0, 0, 1, ax, ay ];

    return {
      region: reg,
      // srcW/srcH: drawImage로 잘라낼 원본 크기
      srcW: reg.w, srcH: reg.h,
      m: mul(mul(T, R), P)
    };
  }

  setSkin(name){
    if(!this.skins[name]) return;
    this.curSkin = name;
    this.attachments = this.skins[name];
  }

  /* 현재 스킨 → 없으면 default 스킨에서 찾기 */
  findAttachment(slotName, attName){
    const a = this.attachments[slotName];
    if(a && a[attName]) return a[attName];
    const d = this.skins.default;
    if(d && d[slotName] && d[slotName][attName]) return d[slotName][attName];
    return null;
  }

  /* 셋업 포즈로 리셋 */
  setToSetupPose(){
    for(const b of this.bones){
      b.x = b.sx; b.y = b.sy; b.rot = b.srot;
      b.scx = b.sscx; b.scy = b.sscy;
    }
    for(const s of this.slots){
      s.attachment = s.setupAttachment;
      s.alpha = s.setupAlpha;
    }
    this.drawOrder = this.slots.slice();
  }

  /* 애니메이션 적용 */
  apply(animName, time){
    this.setToSetupPose();
    const anim = this.animations[animName];
    if(!anim) return;
    const A = anim.data;

    // 본 타임라인
    if(A.bones) for(const bn in A.bones){
      const bone = this.boneMap[bn];
      if(!bone) continue;
      const tl = A.bones[bn];

      if(tl.rotate){
        const f = tl.rotate;
        let angle;
        if(time <= f[0].time) angle = f[0].angle;
        else if(time >= f[f.length-1].time) angle = f[f.length-1].angle;
        else{
          const i = findFrame(f, time);
          const f0 = f[i], f1 = f[i+1];
          const p = curvePercent(f0.curve,
                    (time - f0.time) / (f1.time - f0.time));
          // 최단 경로로 감아서 보간 (350도 회전 방지)
          angle = f0.angle + wrapDeg(f1.angle - f0.angle) * p;
        }
        bone.rot = bone.srot + angle;
      }
      if(tl.translate){
        const v = interp2(tl.translate, time, 'x', 'y');
        bone.x = bone.sx + v[0];
        bone.y = bone.sy + v[1];
      }
      if(tl.scale){
        const v = interp2(tl.scale, time, 'x', 'y', 1);
        bone.scx = bone.sscx * v[0];
        bone.scy = bone.sscy * v[1];
      }
    }

    // 슬롯 타임라인
    if(A.slots) for(const sn in A.slots){
      const slot = this.slotMap[sn];
      if(!slot) continue;
      const tl = A.slots[sn];

      if(tl.attachment){
        const f = tl.attachment;
        let name = f[0].name;
        for(let i = 0; i < f.length; i++){
          if(f[i].time <= time) name = f[i].name; else break;
        }
        slot.attachment = name;
      }
      if(tl.color){
        const f = tl.color;
        let alpha;
        const av = c => parseInt(c.slice(6,8),16)/255;
        if(time <= f[0].time) alpha = av(f[0].color);
        else if(time >= f[f.length-1].time) alpha = av(f[f.length-1].color);
        else{
          const i = findFrame(f, time);
          const f0 = f[i], f1 = f[i+1];
          const p = curvePercent(f0.curve,
                    (time - f0.time) / (f1.time - f0.time));
          alpha = av(f0.color) + (av(f1.color) - av(f0.color)) * p;
        }
        slot.alpha = alpha;
      }
    }

    // 드로우 오더
    if(A.drawOrder && A.drawOrder.length){
      let key = null;
      for(const k of A.drawOrder){ if(k.time <= time) key = k; else break; }
      const order = this.slots.slice();
      if(key && key.offsets){
        const unchanged = [];
        const result = new Array(this.slots.length).fill(null);
        const moved = {};
        for(const off of key.offsets){
          const s = this.slotMap[off.slot];
          if(s) moved[s.order] = off.offset;
        }
        // 원본 인덱스 + offset 위치로 이동
        for(let i = 0; i < this.slots.length; i++){
          if(!(i in moved)) unchanged.push(this.slots[i]);
        }
        for(const idxStr in moved){
          const i = parseInt(idxStr);
          result[i + moved[idxStr]] = this.slots[i];
        }
        let u = 0;
        for(let i = 0; i < result.length; i++){
          if(result[i] === null) result[i] = unchanged[u++];
        }
        this.drawOrder = result;
      } else {
        this.drawOrder = order;
      }
    }

    this.updateWorld();
  }

  /* 본 월드 변환 (부모 → 자식 순) */
  updateWorld(){
    for(const b of this.bones){
      const cos = Math.cos(b.rot * DEG), sin = Math.sin(b.rot * DEG);
      const la =  cos * b.scx, lb = -sin * b.scy;
      const lc =  sin * b.scx, ld =  cos * b.scy;
      const p = b.parent;
      if(!p){
        b.a = la; b.b = lb; b.c = lc; b.d = ld;
        b.wx = b.x; b.wy = b.y;
      } else {
        b.wx = p.a * b.x + p.b * b.y + p.wx;
        b.wy = p.c * b.x + p.d * b.y + p.wy;
        b.a = p.a * la + p.b * lc;
        b.b = p.a * lb + p.b * ld;
        b.c = p.c * la + p.d * lc;
        b.d = p.c * lb + p.d * ld;
      }
    }
  }

  /* 그리기. base는 월드(y-up) → 화면(y-down) 변환 행렬 */
  draw(ctx, base){
    for(const slot of this.drawOrder){
      if(!slot.attachment) continue;
      const att = this.findAttachment(slot.name, slot.attachment);
      if(!att) continue;
      if(slot.alpha <= 0.002) continue;

      const bone = slot.bone;
      const B = [ bone.a, bone.c, bone.b, bone.d, bone.wx, bone.wy ];
      const M = mul(mul(base, B), att.m);

      ctx.globalAlpha = slot.alpha;
      ctx.setTransform(M[0], M[1], M[2], M[3], M[4], M[5]);
      const r = att.region;
      ctx.drawImage(this.image, r.x, r.y, r.w, r.h, 0, 0, att.srcW, att.srcH);
    }
    ctx.setTransform(1,0,0,1,0,0);
    ctx.globalAlpha = 1;
  }

  /* 본 뼈대 오버레이 (디버그) */
  drawBones(ctx, base){
    ctx.setTransform(1,0,0,1,0,0);
    ctx.lineWidth = 1.5;
    for(const b of this.bones){
      const p0 = applyM(base, b.wx, b.wy);
      const len = b.len || 12;
      const ex = b.wx + b.a * len, ey = b.wy + b.c * len;
      const p1 = applyM(base, ex, ey);
      ctx.strokeStyle = 'rgba(122,162,247,.8)';
      ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]); ctx.stroke();
      ctx.fillStyle = '#d9b45a';
      ctx.beginPath(); ctx.arc(p0[0], p0[1], 2.2, 0, 6.284); ctx.fill();
    }
  }

  /* 현재 포즈의 화면 바운딩 박스 (월드 y-up 기준) */
  bounds(){
    let x0=1e9, y0=1e9, x1=-1e9, y1=-1e9;
    const I = [1,0,0,1,0,0];
    for(const slot of this.drawOrder){
      if(!slot.attachment) continue;
      const att = this.findAttachment(slot.name, slot.attachment);
      if(!att) continue;
      const bone = slot.bone;
      const B = [ bone.a, bone.c, bone.b, bone.d, bone.wx, bone.wy ];
      const M = mul(B, att.m);
      const pts = [[0,0],[att.srcW,0],[0,att.srcH],[att.srcW,att.srcH]];
      for(const p of pts){
        const q = applyM(M, p[0], p[1]);
        if(q[0]<x0)x0=q[0]; if(q[0]>x1)x1=q[0];
        if(q[1]<y0)y0=q[1]; if(q[1]>y1)y1=q[1];
      }
    }
    return {x0,y0,x1,y1};
  }
}

/* ---------- 행렬 유틸 (canvas 표기 [a,b,c,d,e,f]) ---------- */
function mul(m, n){
  return [
    m[0]*n[0] + m[2]*n[1],
    m[1]*n[0] + m[3]*n[1],
    m[0]*n[2] + m[2]*n[3],
    m[1]*n[2] + m[3]*n[3],
    m[0]*n[4] + m[2]*n[5] + m[4],
    m[1]*n[4] + m[3]*n[5] + m[5]
  ];
}
function applyM(m, x, y){
  return [ m[0]*x + m[2]*y + m[4], m[1]*x + m[3]*y + m[5] ];
}

/* ---------- 타임라인 헬퍼 ---------- */
function findFrame(frames, time){
  for(let i = frames.length - 2; i >= 0; i--){
    if(frames[i].time <= time) return i;
  }
  return 0;
}
function interp2(frames, time, kx, ky, def){
  const d = def === undefined ? 0 : def;
  const gx = f => f[kx] === undefined ? d : f[kx];
  const gy = f => f[ky] === undefined ? d : f[ky];
  if(time <= frames[0].time) return [gx(frames[0]), gy(frames[0])];
  const last = frames[frames.length-1];
  if(time >= last.time) return [gx(last), gy(last)];
  const i = findFrame(frames, time);
  const f0 = frames[i], f1 = frames[i+1];
  const p = curvePercent(f0.curve, (time - f0.time) / (f1.time - f0.time));
  return [ gx(f0) + (gx(f1) - gx(f0)) * p,
           gy(f0) + (gy(f1) - gy(f0)) * p ];
}
function animDuration(A){
  let max = 0;
  const scan = tl => { for(const f of tl) if(f.time > max) max = f.time; };
  if(A.bones) for(const b in A.bones) for(const k in A.bones[b]) scan(A.bones[b][k]);
  if(A.slots) for(const s in A.slots) for(const k in A.slots[s]) scan(A.slots[s][k]);
  if(A.drawOrder) scan(A.drawOrder);
  return max;
}

const layerBack  = document.getElementById('layerBack');
const layerFront = document.getElementById('layerFront');

const DRAGONS = DEX_DRAGONS.map(([id, name, elem, ad, stage]) => ({
  id: String(id), name, elem, advent: ad === 1, stage,
  asset: String(GRADE_ASSET[id] || ASSET_ID[id] || id),
  family: !!GRADE_ASSET[id],
  key: name.replace(/\s+/g, '').toLowerCase()
}));

let manifest = null;     // { 게임ID: [세트 이름들] }
let skel = null;         // 본체 스켈레톤
let fxBack = [], fxFront = [];  // 장식 이펙트 (드래곤 뒤 / 앞)
let curAnim = null, t = 0, lastMs = 0, baseDPR = 1, drawBase = [1,0,0,-1,0,0];

let animIndex = {}, decoKeys = [], motionKeys = [];

function hasAsset(d){ return !manifest || !!manifest[d.asset]; }

/* 지정된 게임ID가 저장소에 없으면 같은 패밀리의 다른 등급으로 대체합니다 */
function resolveAssets(){
  let fixed = 0;
  for(const d of DRAGONS){
    if(manifest[d.asset]) continue;
    const mem = FAMILY_MEMBERS[d.id];
    if(!mem) continue;
    const alt = mem.find(g => manifest[String(g)]);
    if(alt){ d.asset = String(alt); fixed++; }
  }
  return fixed;
}

/* ── 애니메이션 이름을 장식 × 모션으로 분해 ── */
function splitAnim(name){
  const m = name.match(/^(acc\d*)(?:_(.+))?$/i);
  if(m) return { deco: m[1].toLowerCase(), motion: m[2] ? m[2].toLowerCase() : 'wait' };
  return { deco: '', motion: name };
}
function decoLabel(d){
  if(d === '') return '없음';
  const m = d.match(/^acc(\d*)$/);
  return m ? '장식 ' + (m[1] || '1') : d;
}
const MOTION_LABEL = { wait: '대기', att: '공격' };
const motionLabel = m => MOTION_LABEL[m] || m;

function buildAxes(){
  animIndex = {};
  const ds = [], ms = [];
  for(const name in skel.animations){
    const { deco, motion } = splitAnim(name);
    if(!animIndex[deco]){ animIndex[deco] = {}; ds.push(deco); }
    animIndex[deco][motion] = name;
    if(ms.indexOf(motion) === -1) ms.push(motion);
  }
  decoKeys = ds.sort((a, b) => {
    if(a === '') return -1;
    if(b === '') return 1;
    return parseInt((a.match(/\d+/) || [1])[0]) - parseInt((b.match(/\d+/) || [1])[0]);
  });
  const pref = ['wait', 'att'];
  motionKeys = ms.sort((a, b) => {
    const ia = pref.indexOf(a), ib = pref.indexOf(b);
    if(ia !== -1 || ib !== -1) return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
    return a.localeCompare(b);
  });
  if(decoKeys.indexOf(curDeco) === -1) curDeco = decoKeys[0];
  if(!animIndex[curDeco][curMotion]) curMotion = animIndex[curDeco].wait ? 'wait' : Object.keys(animIndex[curDeco])[0];
  renderAxisButtons();
}

function renderAxisButtons(){
  // 장식 - 가능한 목록을 항상 같은 순서로 그립니다
  const decos = ALL_DECOS.concat(decoKeys.filter(d => ALL_DECOS.indexOf(d) === -1));
  document.getElementById('decoBtns').innerHTML = decos.map(d => {
    const has = !!animIndex[d];
    return '<button data-deco="' + d + '" class="' + (d === curDeco ? 'on' : '') + '"'
         + (has ? '' : ' disabled') + '>' + decoLabel(d) + '</button>';
  }).join('');
  document.querySelectorAll('[data-deco]').forEach(b => {
    b.onclick = () => {
      curDeco = b.dataset.deco;
      if(!animIndex[curDeco][curMotion]) curMotion = Object.keys(animIndex[curDeco])[0];
      renderAxisButtons();
      applyFxForDeco();
    };
  });

  // 모션
  const motions = ALL_MOTIONS.concat(motionKeys.filter(m => ALL_MOTIONS.indexOf(m) === -1));
  document.getElementById('motionBtns').innerHTML = motions.map(m => {
    const has = !!(animIndex[curDeco] && animIndex[curDeco][m]);
    return '<button data-motion="' + m + '" class="' + (m === curMotion ? 'on' : '') + '"'
         + (has ? '' : ' disabled') + '>' + motionLabel(m) + '</button>';
  }).join('');
  document.querySelectorAll('[data-motion]').forEach(b => {
    b.onclick = () => { curMotion = b.dataset.motion; t = 0; renderAxisButtons(); };
  });

  curAnim = animIndex[curDeco] && animIndex[curDeco][curMotion];
}

function renderSetButtons(){
  const have = curSets || [];
  const list = SET_ORDER.concat(have.filter(n => SET_ORDER.indexOf(n) === -1));
  document.getElementById('setBtns').innerHTML = list.map(n =>
    '<button data-set="' + n + '" title="' + n + '"'
    + ' class="' + (n === setName ? 'on' : '') + '"'
    + (have.indexOf(n) === -1 ? ' disabled' : '') + '>'
    + (SET_LABEL[n] || n) + '</button>').join('');
  document.querySelectorAll('[data-set]').forEach(b => {
    b.onclick = () => { userSet = b.dataset.set; if(curDragon) loadDragon(curDragon); };
  });
}

/* ── 원격 로딩 ── */
async function fetchSet(gameId, name){
  const base = ASSET_BASE + gameId + '/' + name;
  const [jsonRes, atlasRes] = await Promise.all([fetch(base + '.json'), fetch(base + '.atlas')]);
  if(!jsonRes.ok || !atlasRes.ok) throw new Error(name + ' 파일을 찾을 수 없습니다');
  const [json, atlasText] = await Promise.all([jsonRes.json(), atlasRes.text()]);
  const img = await new Promise((res, rej) => {
    const im = new Image();
    im.crossOrigin = 'anonymous';
    im.onload = () => res(im);
    im.onerror = () => rej(new Error(name + '.png 를 불러오지 못했습니다'));
    im.src = base + '.png';
  });
  return new Skeleton(json, parseAtlas(atlasText), img);
}

async function loadDragon(dr){
  const token = ++reqToken;
  curDragon = dr;
  cv.classList.remove('on');
  msg(dr.name + ' 불러오는 중…');

  if(!manifest){
    msg('에셋 목록을 아직 불러오지 못했습니다.\n페이지를 새로고침해 주세요.');
    return;
  }
  const sets = manifest[dr.asset];
  if(!sets){
    msg('"' + dr.name + '" 에셋이 저장소에 없습니다\n(dragon/' + dr.asset + '/)');
    curSets = []; skel = null; fxBack = []; fxFront = []; renderSetButtons();
    return;
  }
  const rank = n => { const i = SET_ORDER.indexOf(n); return i === -1 ? 99 : i; };
  curSets = sets.filter(n => !isFxSet(n) && HIDDEN_SETS.indexOf(n) === -1)
                .sort((a, b) => rank(a) - rank(b) || a.localeCompare(b));
  if(!curSets.length){ msg('"' + dr.name + '" 에 표시할 단계가 없습니다'); return; }
  setName = (userSet && curSets.indexOf(userSet) !== -1) ? userSet
          : (curSets.indexOf(defaultSet(dr)) !== -1 ? defaultSet(dr) : curSets[0]);
  renderSetButtons();

  try{
    const main = await fetchSet(dr.asset, setName);
    if(token !== reqToken) return;
    skel = main;
    buildAxes();

    // 이 드래곤이 가진 장식 이펙트 세트를 미리 받아 둡니다
    allFx = {};
    const fxNames = sets.filter(isFxSet);
    for(const n of fxNames){
      try{
        const sk = await fetchSet(dr.asset, n);
        if(token !== reqToken) return;
        allFx[n] = sk;
      }catch(e){ /* 이펙트는 없어도 본체는 보여줍니다 */ }
    }
    applyFxForDeco();
    setupCanvas();
    t = 0;
    cv.classList.add('on');
    msg(null);
  }catch(err){
    if(token === reqToken) msg('"' + dr.name + '" 불러오기 실패\n' + err.message);
  }
}

let allFx = {};
function applyFxForDeco(){
  // 장식이 '없음'이면 이펙트도 없습니다
  fxBack = []; fxFront = [];
  if(!curDeco) return;
  const re = fxSetsFor(curDeco);
  const gid = curDragon ? curDragon.asset : '';
  Object.keys(allFx).filter(n => re.test(n)).sort().forEach(n => {
    (isBehind(gid, n) ? fxBack : fxFront).push(allFx[n]);
  });
}
/* 이펙트 스켈레톤의 모션 이름은 성장 단계명 (초월만 evolution) */
function fxAnimName(sk){
  const want = FX_ANIM[setName] || setName;
  if(sk.animations[want]) return want;
  return Object.keys(sk.animations)[0];
}

/* ── 캔버스 ── */
function boundsOf(sk, names){
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for(const n of names){
    const dur = sk.animations[n].duration || 0.001;
    for(let i = 0; i <= 16; i++){
      sk.apply(n, dur * i / 16);
      const b = sk.bounds();
      if(b.x0 < x0) x0 = b.x0;  if(b.x1 > x1) x1 = b.x1;
      if(b.y0 < y0) y0 = b.y0;  if(b.y1 > y1) y1 = b.y1;
    }
  }
  return { x0, y0, x1, y1 };
}

function setupCanvas(){
  baseDPR = Math.min(window.devicePixelRatio || 1, 2);
  const all = Object.keys(skel.animations);
  const ref = all.indexOf(REF_MOTION) !== -1 ? [REF_MOTION] : [all[0]];
  const rb = boundsOf(skel, ref);          // 기준 모션 - 중심 결정
  const gb = boundsOf(skel, all);          // 전체 모션 - 크기 결정
  for(const n in allFx){                   // 이펙트도 잘리지 않게 포함
    const sk = allFx[n];
    const b = boundsOf(sk, Object.keys(sk.animations));
    if(b.x0 < gb.x0) gb.x0 = b.x0;  if(b.x1 > gb.x1) gb.x1 = b.x1;
    if(b.y0 < gb.y0) gb.y0 = b.y0;  if(b.y1 > gb.y1) gb.y1 = b.y1;
  }
  const cx = (rb.x0 + rb.x1) / 2, cy = (rb.y0 + rb.y1) / 2;
  const halfW = Math.max(cx - gb.x0, gb.x1 - cx) * WORLD_SCALE + CANVAS_PAD;
  const halfH = Math.max(cy - gb.y0, gb.y1 - cy) * WORLD_SCALE + CANVAS_PAD;
  const CW = Math.ceil(halfW * 2), CH = Math.ceil(halfH * 2);

  cv.style.width = CW + 'px';  cv.style.height = CH + 'px';
  cv.width = Math.round(CW * baseDPR);  cv.height = Math.round(CH * baseDPR);
  const S = WORLD_SCALE * baseDPR;
  drawBase = [ S, 0, 0, -S, cv.width / 2 - cx * S, cv.height / 2 + cy * S ];
  updateViewScale();
}

const STAGE_REF_WIDTH = 820;
let viewScale = 1;
function updateViewScale(){
  const w = stage.clientWidth || STAGE_REF_WIDTH;
  viewScale = Math.min(1, w / STAGE_REF_WIDTH);
  cv.style.transform = 'translate(-50%, -50%) scale(' + viewScale + ')';
  // 오라는 드래곤과 무관하게 무대의 같은 자리에 고정됩니다 (기존 오라 미리보기와 동일)
  const drop = AURA_Y_ADJUST * viewScale;
  for(const el of [layerBack, layerFront]){
    el.style.top = 'calc(48.4% + ' + drop.toFixed(1) + 'px)';
    el.style.transform = 'translate(-50%, -50%) scale(' + viewScale + ')';
  }
}
window.addEventListener('resize', updateViewScale);

function frame(ms){
  requestAnimationFrame(frame);
  const dt = lastMs ? Math.min((ms - lastMs) / 1000, 0.1) : 0;
  lastMs = ms;

  if(auraData){
    const idx = Math.floor(auraT * AURA_FPS);
    auraT += dt;
    drawAuraFrame(auraBackCtx, auraData.back, idx);
    drawAuraFrame(auraFrontCtx, auraData.front, idx);
  }

  if(!skel || !curAnim) return;
  t += dt;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);

  // 이펙트는 길이가 서로 달라 각자 루프를 돕니다.
  const drawFx = list => {
    for(const sk of list){
      const an = fxAnimName(sk);
      const d = sk.animations[an].duration;
      sk.apply(an, d > 0 ? (t % d) : 0);
      sk.draw(ctx, drawBase);
    }
  };

  drawFx(fxBack);                       // 뒤 이펙트
  const dur = skel.animations[curAnim].duration;
  skel.apply(curAnim, dur > 0 ? (t % dur) : 0);
  skel.draw(ctx, drawBase);             // 드래곤
  drawFx(fxFront);                      // 앞 이펙트
}

function msg(text){
  if(text){ stageMsg.textContent = text; stageMsg.style.display = 'flex'; }
  else stageMsg.style.display = 'none';
}

/* ── 오라 ──
   cocos2d plist 스프라이트시트를 back/front 두 캔버스로 재생합니다.
   plist 는 프리멀티플라이드 알파라 불러올 때 한 번 되돌립니다.
   (안 되돌리면 뿌옇게 뜹니다) */
const auraBackCtx  = layerBack.getContext('2d');
const auraFrontCtx = layerFront.getContext('2d');
const auraCache = {};
let curAura = null, auraData = null, auraToken = 0;

function plistFrames(xmlText){
  const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
  const root = doc.querySelector('plist > dict');
  if(!root) throw new Error('plist 형식이 아닙니다');
  const kids = el => Array.from(el.children);
  const valueFor = (dict, key) => {
    const ch = kids(dict);
    for(let i = 0; i < ch.length; i++){
      if(ch[i].tagName === 'key' && ch[i].textContent === key) return ch[i + 1];
    }
    return null;
  };
  const nums = s => (s.match(/-?\d+(?:\.\d+)?/g) || []).map(Number);
  const framesDict = valueFor(root, 'frames');
  const ch = kids(framesDict);
  const out = [];
  for(let i = 0; i < ch.length; i += 2){
    const name = ch[i].textContent, d = ch[i + 1];
    const rect = nums(valueFor(d, 'textureRect').textContent);      // x, y, w, h
    const src  = nums(valueFor(d, 'spriteSourceSize').textContent); // 원본 w, h
    const off  = nums(valueFor(d, 'spriteOffset').textContent);     // 중심 기준 이동량
    const rotEl = valueFor(d, 'textureRotated');
    out.push({
      name,
      x: rect[0], y: rect[1], w: rect[2], h: rect[3],
      ow: src[0], oh: src[1], ox: off[0], oy: off[1],
      rot: rotEl && rotEl.tagName === 'true'
    });
  }
  out.sort((a, b) => a.name.localeCompare(b.name));
  return out;
}

/* 프리멀티플라이드 알파면 되돌립니다.
   plist 에는 premultiplyAlpha=true 로 적혀 있지만 실제 PNG 는 스트레이트인 경우가 있어
   (오라 에셋 전부가 그렇습니다) 표기를 믿지 않고 픽셀로 직접 판별합니다.
   프리멀티플라이드면 RGB <= alpha 가 성립하므로, 그 규칙을 깨는 픽셀이 많으면 스트레이트입니다. */
function unpremultiply(img){
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const g = c.getContext('2d');
  g.drawImage(img, 0, 0);
  try{
    const d = g.getImageData(0, 0, c.width, c.height);
    const p = d.data;
    let semi = 0, over = 0;
    for(let i = 0; i < p.length; i += 4){
      const a = p[i + 3];
      if(a <= 4 || a >= 250) continue;
      semi++;
      if(Math.max(p[i], p[i + 1], p[i + 2]) > a + 6) over++;
    }
    if(semi === 0 || over / semi > 0.4) return c;   // 스트레이트 - 손대지 않음
    for(let i = 0; i < p.length; i += 4){
      const a = p[i + 3];
      if(a === 0 || a === 255) continue;
      const f = 255 / a;
      p[i]     = Math.min(255, p[i]     * f);
      p[i + 1] = Math.min(255, p[i + 1] * f);
      p[i + 2] = Math.min(255, p[i + 2] * f);
    }
    g.putImageData(d, 0, 0);
  }catch(e){ /* 픽셀을 못 읽으면 원본 그대로 씁니다 */ }
  return c;
}

async function loadAura(id){
  if(auraCache[id]) return auraCache[id];
  const out = {};
  for(const side of ['back', 'front']){
    // 한쪽 면만 있는 오라가 있을 수 있어 back/front 를 각각 따로 시도합니다
    try{ out[side] = await loadAuraSide(id, side); }catch(e){ out[side] = null; }
  }
  auraCache[id] = out;
  return out;
}

/* 캔버스 픽셀 수를 실제로 보이는 크기(2배 확대 × 화면 배율)에 맞춥니다.
   이전에는 원본 크기 그대로 그린 뒤 CSS 로 2배 늘려서 한 번 더 확대되며 뭉개졌습니다. */
function sizeAuraCanvas(cv, data){
  if(!data){ cv.classList.remove('on'); return; }
  const f = data.frames[0];
  const k = FX_BASE_SCALE * baseDPR;
  cv.style.width  = (f.ow * FX_BASE_SCALE) + 'px';
  cv.style.height = (f.oh * FX_BASE_SCALE) + 'px';
  cv.width  = Math.round(f.ow * k);
  cv.height = Math.round(f.oh * k);
  cv.classList.add('on');
}

function drawAuraFrame(ctx2, data, idx){
  if(!data) return;
  const f = data.frames[idx % data.frames.length];
  const k = FX_BASE_SCALE * baseDPR;
  ctx2.setTransform(1, 0, 0, 1, 0, 0);
  ctx2.clearRect(0, 0, ctx2.canvas.width, ctx2.canvas.height);
  ctx2.imageSmoothingEnabled = true;
  ctx2.imageSmoothingQuality = 'high';
  ctx2.setTransform(k, 0, 0, k, 0, 0);

  // textureRect 의 w,h 는 "눕히기 전" 크기입니다.
  // 회전 저장된 조각은 아틀라스에서 (h,w) 를 차지하므로 잘라낼 크기를 바꿔야 합니다.
  const sw = f.rot ? f.h : f.w;
  const sh = f.rot ? f.w : f.h;
  const dw = f.w, dh = f.h;
  // 트림된 조각을 원본 크기 안의 제자리로 되돌립니다 (spriteOffset 은 y 가 위쪽 기준)
  const dx = (f.ow - dw) / 2 + f.ox;
  const dy = (f.oh - dh) / 2 - f.oy;

  if(f.rot){
    // 반시계 90도로 되돌립니다
    ctx2.translate(dx, dy + dh);
    ctx2.rotate(-Math.PI / 2);
    ctx2.drawImage(data.tex, f.x, f.y, sw, sh, 0, 0, sw, sh);
  } else {
    ctx2.drawImage(data.tex, f.x, f.y, sw, sh, dx, dy, dw, dh);
  }
}

async function pickAura(id){
  const token = ++auraToken;
  curAura = id || null;
  if(!curAura){
    auraData = null;
    layerBack.classList.remove('on');
    layerFront.classList.remove('on');
    return;
  }
  const data = await loadAura(curAura);
  if(token !== auraToken) return;
  auraData = data;
  sizeAuraCanvas(layerBack, data.back);
  sizeAuraCanvas(layerFront, data.front);
  updateViewScale();
}

const auraBtns = document.getElementById('auraBtns');
function auraLabel(a){ return a.group === 'SSS' ? a.name : a.name; }
auraBtns.innerHTML = '<button data-aura="" class="on">없음</button>'
  + AURAS.map(a => '<button data-aura="' + a.id + '" title="' + a.id + '">'
                 + a.name + '</button>').join('');

function markAura(id){
  auraBtns.querySelectorAll('[data-aura]').forEach(c =>
    c.classList.toggle('on', c.dataset.aura === (id || '')));
}
auraBtns.querySelectorAll('[data-aura]').forEach(b => {
  b.onclick = () => { markAura(b.dataset.aura); pickAura(b.dataset.aura); };
});

/* ── 드래곤 고르기: 검색 · 속성 · 분류 · 에셋 유무 ── */
const dragonGrid  = document.getElementById('dragonGrid');
const searchInput = document.getElementById('searchInput');
const pickerCount = document.getElementById('pickerCount');

const ELEMS = ['땅', '물', '불', '바람', '빛', '어둠', '황혼', '여명', '악몽'];
const KINDS = [['all', '전체'], ['advent', '강림'], ['grade', '등급'], ['normal', '일반']];
let curElem = '', curKind = 'all', curQuery = '';

/* 속성 드롭다운 (동굴 배경과 같은 아이콘 선택 방식) */
const elemSelect  = document.getElementById('elemSelect');
const elemTrigger = document.getElementById('elemTrigger');
const elemMenu    = document.getElementById('elemMenu');
const elemThumb   = document.getElementById('elemThumb');
const elemName    = document.getElementById('elemName');

elemMenu.innerHTML = [['', '전체 속성']].concat(ELEMS.map(e => [e, e]))
  .map(([v, label]) =>
    '<button type="button" class="icon-opt' + (v === curElem ? ' on' : '') + '"'
    + ' role="option" aria-selected="' + (v === curElem) + '" data-elem="' + v + '">'
    + '<span class="icon-thumb"' + (v ? ' style="background-image:url(' + SITE_BASE + ELEM_ICON[v] + ')"' : '') + '></span>'
    + '<span>' + label + '</span></button>').join('');

function pickElem(v){
  curElem = v;
  elemName.textContent = v || '전체 속성';
  elemThumb.style.backgroundImage = v ? 'url(' + SITE_BASE + ELEM_ICON[v] + ')' : '';
  elemMenu.querySelectorAll('.icon-opt').forEach(b => {
    const on = b.dataset.elem === v;
    b.classList.toggle('on', on);
    b.setAttribute('aria-selected', on);
  });
  closeElemMenu();
  renderDragonGrid();
}
function closeElemMenu(){
  elemSelect.classList.remove('open');
  elemTrigger.setAttribute('aria-expanded', 'false');
}
elemTrigger.onclick = e => {
  e.stopPropagation();
  const open = elemSelect.classList.toggle('open');
  elemTrigger.setAttribute('aria-expanded', String(open));
};
elemMenu.querySelectorAll('.icon-opt').forEach(b => { b.onclick = () => pickElem(b.dataset.elem); });

/* 분류 세그먼트 */
const kindSeg = document.getElementById('kindSeg');
kindSeg.innerHTML = KINDS.map(([v, label]) =>
  '<button type="button" data-kind="' + v + '" class="' + (v === curKind ? 'on' : '') + '"'
  + ' aria-pressed="' + (v === curKind) + '">' + label + '</button>').join('');
kindSeg.querySelectorAll('[data-kind]').forEach(b => {
  b.onclick = () => {
    curKind = b.dataset.kind;
    kindSeg.querySelectorAll('button').forEach(c => {
      const on = c === b;
      c.classList.toggle('on', on);
      c.setAttribute('aria-pressed', String(on));
    });
    renderDragonGrid();
  };
});

let searchTimer = 0;
searchInput.oninput = () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    curQuery = searchInput.value.replace(/\s+/g, '').toLowerCase();
    renderDragonGrid();
  }, 120);
};

function filtered(){
  return DRAGONS.filter(d => {
    if(curElem && d.elem !== curElem) return false;
    if(curKind === 'advent' && !d.advent) return false;
    if(curKind === 'grade' && !d.family) return false;
    if(curKind === 'normal' && (d.advent || d.family)) return false;
    if(curQuery && d.key.indexOf(curQuery) === -1) return false;
    return true;
  });
}

function renderDragonGrid(){
  const list = filtered();
  dragonGrid.classList.toggle('empty', list.length === 0);
  if(!list.length){
    dragonGrid.textContent = '조건에 맞는 드래곤이 없어요';
  } else {
    const frag = document.createDocumentFragment();
    for(const dr of list){
      const el = document.createElement('div');
      el.className = 'dragon-row';
      if(curDragon && curDragon.id === dr.id) el.classList.add('on');
      if(manifest && !hasAsset(dr)) el.classList.add('missing');
      el.innerHTML = '<img src="' + ICON_SRC(dr.id, dr.stage) + '" alt="" loading="lazy">'
                   + '<span class="nm">' + dr.name + '</span>';
      el.title = dr.name;
      el.querySelector('img').addEventListener('error', function(){ this.style.display = 'none'; });
      el.onclick = () => {
        dragonGrid.querySelectorAll('.dragon-row').forEach(c => c.classList.toggle('on', c === el));
        loadDragon(dr);
      };
      frag.appendChild(el);
    }
    dragonGrid.replaceChildren(frag);
  }
  const withAsset = manifest ? list.filter(hasAsset).length : null;
  pickerCount.textContent = list.length + '마리'
    + (withAsset === null ? '' : ' · 에셋 ' + withAsset);
}

/* ── 동굴 배경 (아이콘 드롭다운) ── */
const skinSelect  = document.getElementById('skinSelect');
const skinTrigger = document.getElementById('skinTrigger');
const skinMenu    = document.getElementById('skinMenu');
const skinThumb   = document.getElementById('skinThumb');
const skinName    = document.getElementById('skinName');

const SKINS = [{ n: 0, label: '없음' }];
for(let i = 1; i <= SKIN_COUNT; i++) SKINS.push({ n: i, label: '동굴 ' + i });
let curSkin = 0;

skinMenu.innerHTML = SKINS.map(s =>
  '<button type="button" class="icon-opt' + (s.n === curSkin ? ' on' : '') + '"'
  + ' role="option" aria-selected="' + (s.n === curSkin) + '" data-skin="' + s.n + '">'
  + '<span class="icon-thumb"' + (s.n ? ' style="background-image:url(' + SKIN_ICON(s.n) + ')"' : '') + '></span>'
  + '<span>' + s.label + '</span></button>').join('');

function pickSkin(n){
  curSkin = n;
  if(n){
    layerSkin.src = SKIN_SRC(n);
    layerSkin.classList.add('on');
    stage.classList.remove('checker');
    skinThumb.style.backgroundImage = 'url(' + SKIN_ICON(n) + ')';
  } else {
    layerSkin.classList.remove('on');
    layerSkin.removeAttribute('src');
    stage.classList.add('checker');
    skinThumb.style.backgroundImage = '';
  }
  skinName.textContent = SKINS.find(s => s.n === n).label;
  skinMenu.querySelectorAll('.icon-opt').forEach(b => {
    const on = +b.dataset.skin === n;
    b.classList.toggle('on', on);
    b.setAttribute('aria-selected', on);
  });
  closeSkinMenu();
}
function openSkinMenu(){
  skinSelect.classList.add('open');
  skinTrigger.setAttribute('aria-expanded', 'true');
}
function closeSkinMenu(){
  skinSelect.classList.remove('open');
  skinTrigger.setAttribute('aria-expanded', 'false');
}
skinTrigger.onclick = e => {
  e.stopPropagation();
  skinSelect.classList.contains('open') ? closeSkinMenu() : openSkinMenu();
};
skinMenu.querySelectorAll('.icon-opt').forEach(b => {
  b.onclick = () => pickSkin(+b.dataset.skin);
});
document.addEventListener('click', e => {
  if(!skinSelect.contains(e.target)) closeSkinMenu();
  if(!elemSelect.contains(e.target)) closeElemMenu();
});
document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if(skinSelect.classList.contains('open')){ closeSkinMenu(); skinTrigger.focus(); }
  if(elemSelect.classList.contains('open')){ closeElemMenu(); elemTrigger.focus(); }
});

/* ── 에셋 목록 불러오기 ── */
async function loadManifest(){
  const tried = [];
  for(const base of ASSET_BASES){
    try{
      const res = await fetch(base + 'manifest.json');
      if(!res.ok) throw new Error('HTTP ' + res.status);
      manifest = await res.json();
      ASSET_BASE = base;
      resolveAssets();
        renderDragonGrid();
      msg(null);
      return;
    }catch(err){
      tried.push(base + 'manifest.json  →  ' + err.message);
    }
  }
  msg('에셋 목록(manifest.json)을 불러오지 못했습니다.\n\n' + tried.join('\n'));
}

/* ── 시작 ── */
updateViewScale();
renderDragonGrid();
requestAnimationFrame(frame);
loadManifest();

</script>
