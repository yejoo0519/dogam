<style>
/* ── 테마 팔레트 (index.html과 동일) ──────────────── */
[data-theme="dark"]{
  --bg:#0e1116;--bg2:#161a22;--bg3:#1c212c;
  --border:#23293a;--border2:#1b1f2a;--border3:#2d3447;
  --text:#eaecf2;--text2:#b3b9c7;--text3:#7d8597;--text4:#565d6e;
  --accent:#7aa2f7;--accent-bg:rgba(122,162,247,0.12);--accent-border:rgba(122,162,247,0.30);
  --hp:#6cc487;--atk:#ef6a63;--def:#5dcff5;--ev:#f5c842;--ev-bar:rgba(245,200,66,0.16);
}
[data-theme="light"]{
  --bg:#f7f7f8;--bg2:#ffffff;--bg3:#f1f2f4;
  --border:#e6e7ea;--border2:#eeeff2;--border3:#d4d6db;
  --text:#15171c;--text2:#4a4d57;--text3:#71757f;--text4:#9aa0aa;
  --accent:#2f6fed;--accent-bg:rgba(47,111,237,0.10);--accent-border:rgba(47,111,237,0.32);
  --hp:#2e8b57;--atk:#c62828;--def:#1565c0;--ev:#a97400;--ev-bar:rgba(169,116,0,0.14);
}
[data-theme="beige"]{
  --bg:#f3ecdd;--bg2:#faf3e2;--bg3:#ebe0c7;
  --border:#d8caa8;--border2:#e1d4b3;--border3:#c0ad84;
  --text:#2a2316;--text2:#5a4e34;--text3:#837553;--text4:#a99971;
  --accent:#b06a1e;--accent-bg:rgba(176,106,30,0.10);--accent-border:rgba(176,106,30,0.32);
  --hp:#3f7d4f;--atk:#b03a30;--def:#2a6496;--ev:#96650f;--ev-bar:rgba(150,101,15,0.16);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Malgun Gothic',sans-serif;background:var(--bg);color:var(--text);padding:12px}

/* ── 상단 탭바 (다른 페이지와 동일) ── */
#tab-bar{display:flex;gap:0;margin-bottom:18px;border-bottom:2px solid var(--border);align-items:flex-end}
#tab-bar a{text-decoration:none}
#site-title{display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;margin-right:16px;margin-bottom:6px;border:1.5px solid var(--border3);border-radius:20px;padding:10px 18px;transition:border-color 0.15s;flex-shrink:0}
#site-title:hover{border-color:var(--accent)}
#site-title .title-main{font-size:16px;font-weight:700;color:var(--text2);line-height:1.4}

/* ── 페이지 헤더 ── */
#page-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px}
#page-head h1{font-size:22px;font-weight:700;color:var(--text);letter-spacing:-0.01em}
#count{font-size:12px;color:var(--text3);font-variant-numeric:tabular-nums}

/* ── 컨트롤 ── */
#controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.seg{display:inline-flex;background:var(--bg3);border:1px solid var(--border3);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 16px;border:none;border-radius:7px;background:none;color:var(--text3);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:color 0.12s,background 0.12s;letter-spacing:0.01em}
.seg button:hover{color:var(--text2)}
.seg button.active{background:var(--bg2);color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,0.10)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

#elem-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.etag{display:inline-flex;align-items:center;gap:5px;padding:4px 11px 4px 6px;border-radius:20px;font-size:11px;font-weight:500;border:1px solid var(--border3);background:var(--bg3);color:var(--text2);cursor:pointer;font-family:inherit;transition:border-color 0.12s,color 0.12s}
#e-all{padding:4px 12px}
.etag:hover{border-color:var(--accent-border);color:var(--text)}
.etag .eic{width:16px;height:16px;border-radius:4px;object-fit:cover;flex-shrink:0}
.etag.active{background:var(--accent-bg);border-color:var(--accent-border);color:var(--text)}
.etag:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ── 표 ── */
#tbl-wrap{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--bg2)}
#tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:660px}
thead th{background:var(--bg3);padding:9px 10px;font-size:11px;font-weight:600;color:var(--text3);text-align:center;white-space:nowrap;border-bottom:1px solid var(--border)}
thead th.left{text-align:left}
tbody td{padding:9px 10px;text-align:center;color:var(--text);border-bottom:1px solid var(--border2);vertical-align:middle;font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:none}
tbody tr{border-left:3px solid var(--el,transparent)}
tbody tr:hover td{background:var(--bg3)}
td.left{text-align:left;white-space:nowrap}

.rk{font-size:12px;font-weight:700;color:var(--text3)}
.rk.top{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:var(--accent-bg);color:var(--accent)}
.dragon-img{width:34px;height:34px;border-radius:7px;object-fit:cover;display:block;margin:0 auto;background:var(--bg3)}
.img-placeholder{width:34px;height:34px;border-radius:7px;background:var(--bg3);border:1px dashed var(--border3);margin:0 auto}
.dname{font-size:12px;font-weight:600;color:var(--text)}
.skill-ic{width:16px;height:16px;margin-left:5px;vertical-align:-3px}
.elem-ic{width:22px;height:22px;border-radius:5px;object-fit:cover;display:block;margin:0 auto}
.elem-ic-none{width:22px;height:22px;border-radius:5px;background:var(--bg3);margin:0 auto}
.s-hp{color:var(--hp)}
.s-atk{color:var(--atk)}
.s-def{color:var(--def)}
.lv{font-size:11px;color:var(--text3)}
.raw{font-size:11px;color:var(--text3);white-space:nowrap}

/* Eval — 이 표에서 유일하게 강조하는 열. 막대 길이 = 1위 대비 비율 */
td.ev-cell{padding:0;width:118px}
.ev{position:relative;display:flex;align-items:center;justify-content:flex-end;height:34px;padding:0 10px;margin:0 6px;border-radius:6px;overflow:hidden}
.ev::before{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--w,0%);background:var(--ev-bar);border-radius:6px}
.ev span{position:relative;font-size:13px;font-weight:700;color:var(--ev)}

#empty{padding:48px 16px;text-align:center;color:var(--text3);font-size:13px}

/* ── 모바일 ── */
.m-only{display:none}
@media(max-width:640px){
  body{padding:10px}
  #page-head h1{font-size:19px}
  table{min-width:0}
  thead{display:none}
  tbody tr{display:block;padding:9px 10px 10px;border-bottom:1px solid var(--border2)}
  tbody td{display:none}
  .m-only{display:block}
  .m-top{display:flex;align-items:center;gap:9px;margin-bottom:8px}
  .m-top .dragon-img,.m-top .img-placeholder{margin:0;flex-shrink:0}
  .m-name{flex:1;min-width:0;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .m-rank{min-width:26px;font-size:12px;font-weight:700;color:var(--text3);font-variant-numeric:tabular-nums}
  .m-rank.top{display:inline-flex;align-items:center;justify-content:center;height:22px;border-radius:11px;background:var(--accent-bg);color:var(--accent)}
  .m-stats{display:flex;gap:0;background:var(--bg3);border-radius:8px;padding:6px 0}
  .m-cell{flex:1;text-align:center;font-variant-numeric:tabular-nums}
  .m-cell b{display:block;font-size:9px;font-weight:500;color:var(--text4);letter-spacing:0.02em}
  .m-cell span{display:block;font-size:12px;font-weight:600;margin-top:1px}
  .m-raw{margin-top:6px;font-size:10px;color:var(--text4);text-align:center;font-variant-numeric:tabular-nums}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const ELEMS=["땅","물","불","바람","빛","어둠","황혼","여명","악몽"];

// 속성 색 — 3개 테마 배경 모두에서 읽히는 중간 톤
const elemColors={
  "땅":"#d4863a","물":"#4a90d9","불":"#e05252","바람":"#4caf6d","빛":"#f0a92e",
  "어둠":"#8b6ede","황혼":"#d1568f","여명":"#c08a6a","악몽":"#a05fd0"
};

const skillIcons={
  boom:'https://raw.githubusercontent.com/yejoo0519/dogam/refs/heads/main/icon/boom.png',
  def:'https://raw.githubusercontent.com/yejoo0519/dogam/refs/heads/main/icon/DEF.png'
};
const skillNames={boom:'폭스',def:'방확'};

const elemIcons={
  "땅":"https://raw.githubusercontent.com/yejoo0519/dogam/refs/heads/main/icon/11.png",
  "물":"https://raw.githubusercontent.com/yejoo0519/dogam/refs/heads/main/icon/12.png",
  "불":"https://raw.githubusercontent.com/yejoo0519/dogam/refs/heads/main/icon/13.png",
  "바람":"https://raw.githubusercontent.com/yejoo0519/dogam/refs/heads/main/icon/14.png",
  "빛":"https://raw.githubusercontent.com/yejoo0519/dogam/refs/heads/main/icon/84.png",
  "어둠":"https://raw.githubusercontent.com/yejoo0519/dogam/refs/heads/main/icon/87.png",
  "황혼":"https://raw.githubusercontent.com/yejoo0519/dogam/refs/heads/main/icon/487.png",
  "여명":"https://raw.githubusercontent.com/yejoo0519/dogam/refs/heads/main/icon/486.png",
  "악몽":"https://raw.githubusercontent.com/yejoo0519/dogam/refs/heads/main/icon/488.png"
};

let grade='SSS', lvFilter=45;
const elemFilters=new Set();

/* 속성 필터 버튼 생성 */
(function(){
  const row=document.getElementById('elem-row');
  const all=document.createElement('button');
  all.className='etag active'; all.id='e-all'; all.textContent='전체';
  all.onclick=()=>{elemFilters.clear();syncElem();render();};
  row.appendChild(all);
  ELEMS.forEach(e=>{
    const b=document.createElement('button');
    b.className='etag'; b.dataset.elem=e;
    b.style.setProperty('--el',elemColors[e]);
    b.innerHTML=`<img src="${elemIcons[e]}" class="eic" alt="" loading="lazy">${e}`;
    b.onclick=()=>{elemFilters.has(e)?elemFilters.delete(e):elemFilters.add(e);syncElem();render();};
    row.appendChild(b);
  });
})();

function syncElem(){
  document.getElementById('e-all').classList.toggle('active',elemFilters.size===0);
  document.querySelectorAll('.etag[data-elem]').forEach(b=>{
    b.classList.toggle('active',elemFilters.has(b.dataset.elem));
  });
}

function setGrade(g){
  grade=g;
  document.querySelectorAll('#seg-grade button').forEach(b=>b.classList.toggle('active',b.dataset.grade===g));
  render();
}
function setLv(lv){
  lvFilter=lv;
  document.querySelectorAll('#seg-lv button').forEach(b=>b.classList.toggle('active',Number(b.dataset.lv)===lv));
  render();
}

function render(){
  const src = grade==='SSS' ? sssData : ssData;
  let list=src.filter(d=>d.lv===lvFilter);
  if(elemFilters.size>0) list=list.filter(d=>elemFilters.has(d.elem));
  list=list.slice().sort((a,b)=>b.eval-a.eval);

  // eval 기준 순위 재계산 (동점 = 같은 순위)
  let rank=1;
  list.forEach((d,i)=>{ if(i>0 && d.eval<list[i-1].eval) rank=i+1; d._rank=rank; });

  const modeLabel = grade==='SSS' ? '챔대(SSS)' : '루키(SS)';
  document.getElementById('count').textContent=`${modeLabel} · Lv.${lvFilter} · ${list.length}마리`;
  const tbody=document.getElementById('tbody');
  const empty=document.getElementById('empty');
  tbody.innerHTML='';
  empty.style.display=list.length?'none':'block';
  if(!list.length) return;

  const top=list[0].eval;
  const frag=document.createDocumentFragment();
  list.forEach(d=>{
    const col=elemColors[d.elem]||'transparent';
    const img=imgMap[d.kor]
      ? `<img src="${imgMap[d.kor]}" class="dragon-img" alt="${d.kor}" loading="lazy">`
      : `<div class="img-placeholder"></div>`;
    const eicon=elemIcons[d.elem]
      ? `<img src="${elemIcons[d.elem]}" class="elem-ic" alt="${d.elem}" title="${d.elem}" loading="lazy">`
      : `<div class="elem-ic-none"></div>`;
    const skill=d.skill
      ? `<img src="${skillIcons[d.skill]}" class="skill-ic" alt="${skillNames[d.skill]}" title="${skillNames[d.skill]}">`
      : '';
    const rkCls=d._rank<=3?'rk top':'rk';
    const w=Math.round(d.eval/top*100);

    const tr=document.createElement('tr');
    tr.style.setProperty('--el',col);
    tr.innerHTML=`
      <td><span class="${rkCls}">${d._rank}</span></td>
      <td>${img}</td>
      <td class="left"><span class="dname">${d.kor} ${grade}</span>${skill}</td>
      <td>${eicon}</td>
      <td class="lv">Lv.${d.lv}</td>
      <td class="s-hp">${d.hp}</td>
      <td class="s-atk">${d.atk}</td>
      <td class="s-def">${d.def}</td>
      <td class="ev-cell"><div class="ev" style="--w:${w}%"><span>${d.eval}</span></div></td>
      <td class="raw">${d.base} / ${d.grow}</td>
      <td class="m-only">
        <div class="m-top">
          <span class="m-rank${d._rank<=3?' top':''}">${d._rank}</span>
          ${img}
          <span class="m-name">${d.kor} ${grade}${skill}</span>
          ${eicon}
        </div>
        <div class="m-stats">
          <div class="m-cell"><b>HP</b><span class="s-hp">${d.hp}</span></div>
          <div class="m-cell"><b>ATK</b><span class="s-atk">${d.atk}</span></div>
          <div class="m-cell"><b>DEF</b><span class="s-def">${d.def}</span></div>
          <div class="m-cell"><b>Eval</b><span style="color:var(--ev)">${d.eval}</span></div>
        </div>
        <div class="m-raw">기본 ${d.base} · 성장 ${d.grow}</div>
      </td>`;
    frag.appendChild(tr);
  });
  tbody.appendChild(frag);
}

render();
</script>
<script>
/* ── data-theme 동기화 (theme.js 연동) ── */
(function(){
  var link=document.getElementById("theme-css");
  if(!link)return;
  var sync=function(){
    var c=document.getElementById("custom-theme-style");
    if(c&&c.textContent&&c.textContent.length>0){document.documentElement.removeAttribute("data-theme");return;}
    var m=String(link.href||"").match(/theme-(dark|light|beige)\.css/);
    document.documentElement.setAttribute("data-theme",m?m[1]:"dark");
  };
  sync();
  new MutationObserver(sync).observe(link,{attributes:true,attributeFilter:["href"]});
  new MutationObserver(sync).observe(document.head,{childList:true,subtree:true,characterData:true});
})();
</script>
