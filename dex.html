<html lang="ko">
<head>
<meta charset="UTF-8">
<script src="./dragons.js"></script>
<script src="./cham-rules.js"></script>

<script>
if (!globalThis.DV1_DRAGON_VIEWS) {
  document.addEventListener('DOMContentLoaded', function () {
    var warning = document.createElement('div');
    warning.setAttribute('role', 'alert');
    warning.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:#171b25;color:#fff;padding:48px;font:18px/1.8 sans-serif';
    warning.textContent = '드래곤 데이터를 불러오지 못해 페이지를 시작하지 않았습니다. 새로고침하거나 사이트 관리자에게 문의해 주세요.';
    document.body.appendChild(warning);
  });
}
</script>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>드래곤 도감</title>
<link id="theme-css" rel="stylesheet" href="./theme-dark.css">
<link rel="stylesheet" href="./ui.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="./theme.js"></script>
<style>

/* 상단 바 */
#back-btn:hover{border-color:var(--accent-border);color:var(--text)}

/* 필터 */
#filter-section{padding:0 0 14px;border-bottom:1px solid var(--border);margin-bottom:14px}
#search-row{margin-bottom:8px}
#search-input{width:100%;padding:12px 15px;border:1px solid var(--bd2);border-radius:8px;font-size:15px;background:var(--sf2);color:var(--text);outline:none}
#search-input:focus{border-color:var(--gold)}
#search-input::placeholder{color:var(--text4)}
#filter-row{display:flex;flex-direction:column;gap:6px}
.filter-line{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.filter-label{font-size:12px;color:var(--dimmer);font-weight:600;margin-right:2px;flex-shrink:0}
.ftag{padding:7px 13px;border-radius:6px;font-size:12.5px;font-weight:600;border:1px solid var(--bd2);cursor:pointer;background:var(--sf);color:var(--dim);transition:all 0.12s;display:flex;align-items:center;gap:5px}
.ftag img{width:18px;height:18px;max-width:none;border-radius:4px;display:block}
.ftag:hover{border-color:var(--gold);color:var(--text)}
.ftag.active{background:var(--accent-bg);color:var(--gold);border-color:var(--gold)}
.filter-sep{width:1px;height:18px;background:var(--bd);margin:0 4px;flex-shrink:0;align-self:center}
#filter-count{font-size:12.5px;color:var(--dimmer);margin-top:7px}
#stat-filter-toggle-btn{margin-top:8px}
#stat-filter-panel{display:none;margin-top:10px;padding:14px;border:1px solid var(--bd2);border-radius:8px;background:var(--sf2)}
#stat-filter-panel.open{display:block}
.sf-table{width:100%;border-collapse:collapse;font-size:12.5px}
.sf-table th{padding:6px;color:var(--dimmer);font-weight:500;text-align:center}
.sf-table td{padding:6px 10px;text-align:center}
.sf-table td.sf-row-label{text-align:left;color:var(--text2);font-size:13px;font-weight:600;white-space:nowrap}
.sf-pair{display:flex;justify-content:center;align-items:center;gap:4px}
.sf-input{width:64px;padding:7px 8px;border:1px solid var(--bd2);border-radius:6px;font-size:12.5px;background:var(--sf);color:var(--text);text-align:center;outline:none}
.sf-input:focus{border-color:var(--gold)}
.sf-input::placeholder{color:var(--text4)}
.sf-tilde{color:var(--text4);margin:0 3px}
#stat-filter-reset{margin-top:12px;padding:7px 13px;border-radius:6px;font-size:12.5px;font-weight:600;border:1px solid var(--bd2);cursor:pointer;background:var(--sf);color:var(--dim)}
#stat-filter-reset:hover{border-color:var(--gold);color:var(--gold)}

/* 메인 */
#page{max-width:980px;margin:0 auto;padding:0 0 24px}

/* 드래곤 엔트리 */
#entries{animation:fadeIn 0.15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.dragon-entry{border:1px solid var(--bd);border-radius:10px;background:var(--sf);margin-bottom:14px;overflow:hidden}
.entry-body{display:flex;gap:20px;padding:20px;align-items:flex-start}

/* 이미지 박스 */
.img-box{width:190px;flex-shrink:0;border:1px solid var(--bd2);border-radius:10px;background:var(--sf2);display:flex;align-items:center;justify-content:center;min-height:190px;overflow:hidden}
.main-img{width:170px;height:170px;max-width:none;object-fit:contain;display:block;cursor:zoom-in}
.main-img-ph{width:170px;height:170px;display:none;align-items:center;justify-content:center;color:var(--text4);font-size:12px}

/* 라이트박스 (이미지 확대 보기) */
#lightbox{position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out;animation:fadeIn 0.15s}
#lightbox.open{display:flex}
#lightbox-img{max-width:90vw;max-height:90vh;object-fit:contain;border-radius:10px;cursor:default;box-shadow:0 8px 40px rgba(0,0,0,0.5)}
#lightbox-close{position:absolute;top:18px;right:22px;width:42px;height:42px;border-radius:50%;border:none;background:rgba(255,255,255,0.14);color:#fff;font-size:24px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
#lightbox-close:hover{background:rgba(255,255,255,0.28)}

/* 다운로드 버튼 / 메뉴 */
.strip-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.dl-btn{width:36px;height:36px;padding:0;border-radius:8px;border:1px solid var(--bd2);background:var(--sf2);color:var(--dim);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.1s}
.dl-btn:hover{background:var(--border);color:var(--text)}
.dl-btn:disabled{opacity:0.5;cursor:default}
#dl-menu{position:absolute;z-index:9998;display:none;flex-direction:column;background:var(--bg2);border:1px solid var(--border3);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,0.3);overflow:hidden;min-width:150px}
#dl-menu.open{display:flex}
#dl-menu button{padding:11px 15px;border:none;background:none;color:var(--text2);font-size:13.5px;text-align:left;cursor:pointer;white-space:nowrap}
#dl-menu button:hover{background:var(--bg3);color:var(--text)}
#dl-menu button:not(:last-child){border-bottom:1px solid var(--border2)}

/* 정보 패널 */
.info-panel{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.name-meta{display:flex;flex-direction:column;gap:6px}
.dragon-name{font-size:21px;font-weight:700;color:var(--text)}
.meta-row{display:flex;align-items:center;font-size:13px;color:var(--text2);flex-shrink:0;flex-wrap:wrap;gap:2px}
.meta-sep{color:var(--border3);margin:0 7px}
.meta-label{color:var(--text3)}
.meta-val{font-weight:600;color:var(--text)}
.desc-box{background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:11px 13px;font-size:13px;color:var(--text2);line-height:1.8;min-height:52px}
.strip-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.profile-strip{display:flex;gap:5px;flex-wrap:wrap}
.pthumb{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:opacity 0.12s}
.pthumb:hover{opacity:0.8}
.pthumb.unavail{opacity:0.2;cursor:default;pointer-events:none}
.pthumb-img{width:50px;height:50px;object-fit:contain;border-radius:7px;border:2px solid var(--border3);background:var(--bg2);display:block;transition:border-color 0.12s}
.pthumb-img.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pthumb-ph{width:50px;height:50px;border-radius:7px;border:1.5px dashed var(--border3);background:var(--bg2);display:flex;align-items:center;justify-content:center;color:var(--text4);font-size:9px}
.pthumb-label{font-size:9px;color:var(--text3)}
.state-btn{padding:6px 14px;border-radius:8px;border:1px solid var(--border3);background:var(--bg3);color:var(--text2);font-size:13px;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:background 0.1s}
.state-btn:hover{background:var(--border);color:var(--text)}

/* 스텟 테이블 */
.stat-section{display:none;border-top:1px solid var(--border)}
.stat-table{width:100%;border-collapse:collapse;font-size:13px;background:var(--bg2)}
.stat-table th{background:var(--bg3);padding:8px 12px;text-align:center;font-weight:500;color:var(--text2);border-bottom:1px solid var(--border)}
.stat-table td{padding:8px 12px;text-align:center;color:var(--text);border-bottom:0.5px solid var(--border2)}
.stat-table tbody tr:last-child td{border-bottom:none}
.stat-table tbody tr:hover td{background:var(--bg3)}
.stat-table .row-label{text-align:left;font-weight:500;color:var(--text2);width:80px}
.stat-nil{color:var(--text4)}
.grade-row{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;background:var(--bg2);border-bottom:1px solid var(--border)}
.grade-btn{padding:4px 12px;border-radius:16px;font-size:11px;border:1px solid var(--border3);background:var(--bg3);color:var(--text2);cursor:pointer;transition:all 0.12s}
.grade-btn:hover{border-color:var(--accent-border);color:var(--text)}
.grade-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* 속성 배지 */
.eb-땅{background:#fff3e0;color:#e65100}.eb-물{background:#e3f2fd;color:#1565c0}
.eb-불{background:#fce4ec;color:#b71c1c}.eb-바람{background:#e8f5e9;color:#1b5e20}
.eb-빛{background:#fffde7;color:#f57f17}.eb-어둠{background:#ede7f6;color:#4a148c}
.eb-황혼{background:#fdf2f8;color:#880e4f}.eb-여명{background:#fff8e1;color:#6d4c41}
.eb-악몽{background:#f3e5f5;color:#6a1b9a}

/* 페이지네이션 */
#pagination{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:4px;padding:10px 16px;flex-wrap:nowrap;background:var(--bg2);border-top:1px solid var(--border);z-index:100}
.pg-btn{min-width:34px;height:34px;padding:0 6px;border-radius:6px;border:1px solid var(--border3);background:var(--bg2);color:var(--text2);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;transition:all 0.12s}
.pg-btn:hover{border-color:var(--accent-border);color:var(--text)}
.pg-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.pg-btn.disabled{opacity:0.25;cursor:default;pointer-events:none}
@media(max-width:640px){
  .pg-btn{min-width:26px;height:30px;font-size:12px;padding:0 4px}
  #pagination{gap:3px;padding:8px 10px}
}

@media(max-width:620px){
  .entry-body{flex-direction:column;align-items:center;padding:14px}
  .img-box{width:160px;min-height:160px}
  .main-img,.main-img-ph{width:140px;height:140px}
  .name-meta{flex-direction:column;gap:5px}
  .pthumb-img,.pthumb-ph{width:42px;height:42px}
}
</style>
</head>
<body class="u">
<div class="u-app">
<main class="u-wrap full">

<div id="page">
  <div id="filter-section">
    <div id="search-row">
      <input id="search-input" type="text" placeholder="드래곤 이름 검색..." oninput="onFilter()">
    </div>
    <div id="filter-row"></div>
    <button id="stat-filter-toggle-btn" class="ftag" onclick="toggleStatFilterPanel()">스탯 필터 ▼</button>
    <div id="stat-filter-panel">
      <table class="sf-table">
        <thead><tr>
          <th class="sf-row-label"></th>
          <th>Lv.1</th>
          <th>Lv.45</th>
          <th>성장폭</th>
        </tr></thead>
        <tbody>
          <tr>
            <td class="sf-row-label">체력</td>
            <td><div class="sf-pair"><input class="sf-input" type="number" placeholder="이상" data-stat="hp" data-field="l1min"><input class="sf-input" type="number" placeholder="이하" data-stat="hp" data-field="l1max"></div></td>
            <td><div class="sf-pair"><input class="sf-input" type="number" placeholder="이상" data-stat="hp" data-field="l45min"><input class="sf-input" type="number" placeholder="이하" data-stat="hp" data-field="l45max"></div></td>
            <td><input class="sf-input" type="number" placeholder="정확값" data-stat="hp" data-field="gexact"></td>
          </tr>
          <tr>
            <td class="sf-row-label">공격</td>
            <td><div class="sf-pair"><input class="sf-input" type="number" placeholder="이상" data-stat="atk" data-field="l1min"><input class="sf-input" type="number" placeholder="이하" data-stat="atk" data-field="l1max"></div></td>
            <td><div class="sf-pair"><input class="sf-input" type="number" placeholder="이상" data-stat="atk" data-field="l45min"><input class="sf-input" type="number" placeholder="이하" data-stat="atk" data-field="l45max"></div></td>
            <td><input class="sf-input" type="number" placeholder="정확값" data-stat="atk" data-field="gexact"></td>
          </tr>
          <tr>
            <td class="sf-row-label">방어</td>
            <td><div class="sf-pair"><input class="sf-input" type="number" placeholder="이상" data-stat="def" data-field="l1min"><input class="sf-input" type="number" placeholder="이하" data-stat="def" data-field="l1max"></div></td>
            <td><div class="sf-pair"><input class="sf-input" type="number" placeholder="이상" data-stat="def" data-field="l45min"><input class="sf-input" type="number" placeholder="이하" data-stat="def" data-field="l45max"></div></td>
            <td><input class="sf-input" type="number" placeholder="정확값" data-stat="def" data-field="gexact"></td>
          </tr>
        </tbody>
      </table>
      <button id="stat-filter-reset" onclick="resetStatFilters()">필터 초기화</button>
    </div>
  </div>
  <div id="entries"></div>
  <div id="pagination"></div>
</div>

<div id="lightbox" onclick="closeLightbox()">
  <button id="lightbox-close" onclick="closeLightbox()">&times;</button>
  <img id="lightbox-img" src="" alt="" onclick="event.stopPropagation()">
</div>

<div id="dl-menu">
  <button onclick="dlCurrent()">현재 단계</button>
  <button onclick="dlAll()">전체 단계 (ZIP)</button>
</div>

<script>
if (!globalThis.DV1_DRAGON_VIEWS) throw new Error("드래곤 데이터 로드 실패: 초기화 중단");

const dexStatMap = DV1_DRAGON_VIEWS.statMap();
const dexGradeStatMap = DV1_DRAGON_VIEWS.gradeStatMap();
const dexDescMap = DV1_DRAGON_VIEWS.descriptionMap();
const dexData=DV1_DRAGON_VIEWS.dexRows();

const dexElemIcons={
  "땅":"./icon/11.png",
  "물":"./icon/12.png",
  "불":"./icon/13.png",
  "바람":"./icon/14.png",
  "빛":"./icon/84.png",
  "어둠":"./icon/87.png",
  "황혼":"./icon/487.png",
  "여명":"./icon/486.png",
  "악몽":"./icon/488.png",
};

const STAGES=[
  {i:1,l:"알"},{i:2,l:"해치"},{i:3,l:"해츨링"},{i:4,l:"성체"},
  {i:5,l:"캡슐"},{i:6,l:"각성"},{i:7,l:"초월"},{i:8,l:"강림"}
];

// 단계 → 풀 이미지 파일명 매핑
// 경로: dragon/{N}/{filename}.png
const STAGE_FILES = {
  1: "profile/1",    // 알 - profile/1.png 공용
  2: "child1",       // 해치
  3: "child2",       // 해츨링
  4: "adult",        // 성체
  5: "capsule",      // 캡슐
  6: "capsule2",     // 각성
  7: "transcended",  // 초월
  8: "advent",       // 강림
};

// 스텟 데이터 (나중에 채울 것)
// 형식: "드래곤이름": { 단계인덱스: { atk:[lo,hi,max_lo,max_hi], def:[...], hp:[...] } }
// 스탯·설명은 dragons.js에서 공통 변환




const PER_PAGE = 10;
const params = new URLSearchParams(window.location.search);
let curPageNum = Math.max(1, parseInt(params.get("p") || sessionStorage.getItem("dv1_page") || "1"));

// 필터 상태
let filterName = "";
let filterElems = new Set();
let filterTypes = new Set();
const ELEMS = ["땅","물","불","바람","빛","어둠","황혼","여명","악몽"];
const TYPES = ["체력","공격","방어","체공","체방","공방","중립"];

// 스탯 필터 상태: 각 스탯(hp/atk/def)별 Lv1/Lv45/성장폭 이상·이하
let statFilters = {
  hp:  { l1min:null, l1max:null, l45min:null, l45max:null, gexact:null },
  atk: { l1min:null, l1max:null, l45min:null, l45max:null, gexact:null },
  def: { l1min:null, l1max:null, l45min:null, l45max:null, gexact:null },
};

function toggleStatFilterPanel(){
  const panel = document.getElementById("stat-filter-panel");
  const btn = document.getElementById("stat-filter-toggle-btn");
  const isOpen = panel.classList.contains("open");
  panel.classList.toggle("open", !isOpen);
  btn.textContent = isOpen ? "스탯 필터 ▼" : "스탯 필터 ▲";
}

function applyStatFilters(){
  document.querySelectorAll("#stat-filter-panel .sf-input").forEach(inp => {
    const stat = inp.dataset.stat, field = inp.dataset.field;
    const v = inp.value.trim();
    statFilters[stat][field] = v === "" ? null : Number(v);
  });
  curPageNum = 1;
  sessionStorage.setItem("dv1_page", 1);
  renderAll();
}

function resetStatFilters(){
  document.querySelectorAll("#stat-filter-panel .sf-input").forEach(inp => inp.value = "");
  ["hp","atk","def"].forEach(k => {
    statFilters[k] = { l1min:null, l1max:null, l45min:null, l45max:null, gexact:null };
  });
  curPageNum = 1;
  sessionStorage.setItem("dv1_page", 1);
  renderAll();
}

function statFilterPass(d){
  if(typeof dexStatMap === "undefined") return true; // stat.js 미로딩 시 필터 무시하고 통과
  const ss = dexStatMap[d.id];
  for(const key of ["hp","atk","def"]){
    const f = statFilters[key];
    const hasFilter = f.l1min!=null || f.l1max!=null || f.l45min!=null || f.l45max!=null || f.gexact!=null;
    if(!hasFilter) continue;
    if(!ss || !ss[key]) return false; // 데이터 없는 드래곤은 필터 켜진 스탯에서 제외
    const s = ss[key];
    const lv1 = s[0];
    const growth = s[1];
    const lv45 = s[0] + Math.round(s[1] * 44);
    if(f.l1min!=null && lv1 < f.l1min) return false;
    if(f.l1max!=null && lv1 > f.l1max) return false;
    if(f.l45min!=null && lv45 < f.l45min) return false;
    if(f.l45max!=null && lv45 > f.l45max) return false;
    if(f.gexact!=null && growth !== f.gexact) return false;
  }
  return true;
}

function getFiltered(){
  return dexData.filter(d => {
    if(filterName && !d.n.includes(filterName)) return false;
    if(filterElems.size > 0 && !filterElems.has(d.e)) return false;
    if(filterTypes.size > 0 && !filterTypes.has(d.t)) return false;
    if(!statFilterPass(d)) return false;
    return true;
  });
}

function buildFilterUI(){
  const fr = document.getElementById("filter-row");
  fr.innerHTML = "";

  const line1 = document.createElement("div"); line1.className = "filter-line";
  const line2 = document.createElement("div"); line2.className = "filter-line";

  const lbl = (t, target) => {
    const s=document.createElement("span"); s.className="filter-label"; s.textContent=t; target.appendChild(s);
  };

  lbl("속성", line1);
  ELEMS.forEach(v => {
    const b=document.createElement("button");
    b.className="ftag"+(filterElems.has(v)?" active":"");
    const icon=dexElemIcons[v];
    if(icon){ const img=document.createElement("img"); img.src=icon; img.alt=v; b.appendChild(img); }
    b.appendChild(document.createTextNode(v));
    b.onclick=()=>{ filterElems.has(v)?filterElems.delete(v):filterElems.add(v); onFilter(); };
    line1.appendChild(b);
  });

  lbl("타입", line2);
  TYPES.forEach(v => {
    const b=document.createElement("button");
    b.className="ftag"+(filterTypes.has(v)?" active":"");
    b.textContent=v;
    b.onclick=()=>{ filterTypes.has(v)?filterTypes.delete(v):filterTypes.add(v); onFilter(); };
    line2.appendChild(b);
  });

  fr.appendChild(line1);
  fr.appendChild(line2);
}

function onFilter(){
  filterName = document.getElementById("search-input").value.trim();
  curPageNum = 1;
  sessionStorage.setItem("dv1_page", 1);
  renderAll();
}

// 엔트리별 현재 선택 단계 저장
const stageState = {};

// 등급 드래곤 - 엔트리별 현재 선택 등급 저장
const GRADES = ["C","B","A","S","SS","SSS"];
const gradeState = {};

function gradeSetOf(d){
  return (typeof dexGradeStatMap !== "undefined" ? dexGradeStatMap[d.id] : null) || null;
}

function firstGrade(d){const g=gradeSetOf(d);return (g&&GRADES.find(x=>g[x]))||"C";}
function gradeRowHtml(d, idx){
  if(!gradeSetOf(d)) return "";
  const cur = gradeState[idx] || firstGrade(d);
  return `<div class="grade-row" id="grade-${idx}">` + GRADES.map(g =>
    `<button class="grade-btn${g===cur?" active":""}" data-grade="${g}" onclick="selectGrade(${idx},'${g}')">${g}</button>`
  ).join("") + `</div>`;
}

function selectGrade(idx, g){
  gradeState[idx] = g;
  const row = document.getElementById("grade-" + idx);
  if(row) row.querySelectorAll(".grade-btn").forEach(b => b.classList.toggle("active", b.dataset.grade === g));
  renderStat(dexData[idx], idx, stageState[idx] || 4);
}

function getN(name){
  const d = dexData.find(x => x.n === name);
  return d && d.id ? String(d.id) : null;
}
const BASE = ".";

// ── 이미지 로딩 안정화: 실패 시 백오프 재시도 후 placeholder ──
function dexImgRetry(img,onGiveUp){
  var t=+(img.dataset.retry||0);
  if(t<3){
    img.dataset.retry=t+1;
    var u=img.src.split('?')[0];
    setTimeout(function(){ img.src=u+'?r='+Date.now(); }, 500*(t+1));
  } else if(typeof onGiveUp==='function'){
    onGiveUp.call(img);
  }
}
function dexMainImgErr(img,idx){
  dexImgRetry(img,function(){
    img.style.display='none';
    var ph=document.getElementById('mph-'+idx);
    if(ph) ph.style.display='flex';
  });
}


// 썸네일: dragon/{N}/profile/{stage}.png
function profileUrl(name, stage){
  const n = getN(name);
  return n ? `${BASE}/dragon/${n}/profile/${stage}.png` : "";
}
// 풀 이미지: dragon/{N}/{filename}.png
function fullUrl(name, stage){
  const n = getN(name);
  const f = STAGE_FILES[stage];
  return (n && f) ? `${BASE}/dragon/${n}/${f}.png` : "";
}
function stageAvail(d, i){
  if(i===6 && !d.aw) return false;
  if(i===7 && !d.tr) return false;
  if(i===8 && !d.ad) return false;
  return true;
}
function highStage(d){ return d.ad?"강림":d.tr?"초월":d.aw?"각성":"성체"; }

// ── 전체 렌더 ──
function renderAll(){
  buildFilterUI();
  const filtered = getFiltered();
  const totalPages = Math.ceil(filtered.length / PER_PAGE);
  curPageNum = Math.min(curPageNum, totalPages || 1);
  const pageData = filtered.slice((curPageNum-1)*PER_PAGE, curPageNum*PER_PAGE);

  window.__dexN = filtered.length;
  if (window.UI && UI.sub) UI.sub(`검색 결과 ${filtered.length}마리`);

  const container = document.getElementById("entries");
  container.innerHTML = "";
  container.style.animation = "none";
  container.offsetHeight; // reflow
  container.style.animation = "";
  pageData.forEach(d => {
    const globalIdx = dexData.indexOf(d);
    if(stageState[globalIdx] === undefined) stageState[globalIdx] = 4;
    container.appendChild(buildEntry(d, globalIdx));
  });
  buildPagination(filtered.length, totalPages);
}

function buildEntry(d, idx){
  const wrap = document.createElement("div");
  wrap.className = "dragon-entry";
  wrap.dataset.idx = idx;

  const initFull = fullUrl(d.n, 4);

  wrap.innerHTML = `
    <div class="entry-body">
      <div class="img-box">
        <img class="main-img" id="mimg-${idx}"
          src="${initFull}"
          alt="${d.n}"
          onclick="openLightbox(this)"
          loading="lazy" onerror="dexMainImgErr(this,${idx})"
          style="${initFull?'':'display:none'}">
        <div class="main-img-ph" id="mph-${idx}" style="${initFull?'display:none':'display:flex'}">이미지 없음</div>
      </div>
      <div class="info-panel">
        <div class="name-meta">
          <div class="dragon-name">${d.n}</div>
          <div class="meta-row">
            <span class="meta-label">속성</span>&nbsp;<span class="meta-val eb-${d.e}" style="padding:1px 6px;border-radius:4px;font-size:11px;display:inline-flex;align-items:center;gap:3px">${dexElemIcons[d.e]?`<img src="${dexElemIcons[d.e]}" style="width:14px;height:14px;border-radius:2px">`:''}${d.e}</span>
            <span class="meta-sep">|</span>
            <span class="meta-label">타입</span>&nbsp;<span class="meta-val">${d.t_kr}</span>
            <span class="meta-sep">|</span>
            <span class="meta-label">세대</span>&nbsp;<span class="meta-val">${d.gen||"1"}</span>
            <span class="meta-sep">|</span>
            <span class="meta-label">단계</span>&nbsp;<span class="meta-val" id="mstage-${idx}">성체</span>
            <span class="meta-sep">|</span>
            <span class="meta-label">레벨업</span>&nbsp;<span class="meta-val">${d.lv?'가능':'불가'}</span>
            <span class="meta-sep">|</span>
            <span class="meta-label">코드화</span>&nbsp;<span class="meta-val">${d.cd}</span>
          </div>
        </div>
        <div class="desc-box" style="${(typeof dexDescMap!=='undefined'&&dexDescMap[d.n])||d.desc?'':'font-style:italic'}">${(typeof dexDescMap!=='undefined'&&dexDescMap[d.n])||d.desc||'(설명 데이터가 아직 없습니다)'}</div>
        <div class="strip-row">
          <div class="profile-strip" id="strip-${idx}"></div>
          <div class="strip-actions">
            <button class="dl-btn" id="dlbtn-${idx}" onclick="openDlMenu(event, ${idx})" title="이미지 다운로드">⬇</button>
            <button class="state-btn" id="sbtn-${idx}" onclick="toggleStat(${idx})">State펼치기 ▼</button>
          </div>
        </div>
      </div>
    </div>
    <div class="stat-section" id="stat-${idx}">
      ${gradeRowHtml(d, idx)}
      <table class="stat-table">
        <thead>
          <tr>
            <th class="row-label"></th>
            <th>1레벨</th>
            <th>45레벨</th>
            <th>성장폭</th>
          </tr>
        </thead>
        <tbody id="stbody-${idx}"></tbody>
      </table>
    </div>`;

  // 프로필 스트립 구성
  const strip = wrap.querySelector(`#strip-${idx}`);
  STAGES.forEach(s => {
    const avail = stageAvail(d, s.i);
    if(!avail) return; // 미보유 단계는 표시하지 않음
    const pUrl = profileUrl(d.n, s.i);
    const fallbackUrl = profileUrl(d.n, 4); // 성체 프로필 폴백
    const thumbWrap = document.createElement("div");
    thumbWrap.className = "pthumb" + (avail ? "" : " unavail");
    thumbWrap.dataset.si = s.i;

    if(pUrl){
      const img = document.createElement("img");
      img.className = "pthumb-img" + (s.i === 4 ? " sel" : "");
      // 성체(4)는 dexImgMap 이미지로 폴백, 나머지는 플레이스홀더
      img.loading = "lazy";
      img.src = pUrl;
      img.alt = s.l;
      img.onerror = function(){
        if(s.i === 5){ this.closest(".pthumb").style.display = "none"; return; } // 캡슐 미보유: 깜빡임 없이 즉시 숨김
        dexImgRetry(this, function(){
          this.style.display = "none";
          const ph = document.createElement("div");
          ph.className = "pthumb-ph"; ph.textContent = s.l[0];
          this.parentNode.insertBefore(ph, this);
        });
      };
      thumbWrap.appendChild(img);
    } else {
      const ph = document.createElement("div");
      ph.className = "pthumb-ph"; ph.textContent = s.l[0];
      thumbWrap.appendChild(ph);
    }
    const lbl = document.createElement("span");
    lbl.className = "pthumb-label"; lbl.textContent = s.l;
    thumbWrap.appendChild(lbl);

    if(avail) thumbWrap.onclick = () => selectStage(d, idx, s.i);
    strip.appendChild(thumbWrap);
  });

  return wrap;
}

function selectStage(d, idx, si){
  stageState[idx] = si;
  document.getElementById("mstage-" + idx).textContent = STAGES.find(s=>s.i===si).l;

  // 큰 이미지 교체
  const mi = document.getElementById("mimg-" + idx);
  const mp = document.getElementById("mph-" + idx);
  const fUrl = fullUrl(d.n, si);
  if(fUrl){
    mi.src = fUrl; mi.style.display = "block"; mp.style.display = "none";
    mi.onerror = () => { mi.style.display = "none"; mp.style.display = "flex"; };
  } else {
    mi.style.display = "none"; mp.style.display = "flex";
  }

  // 썸네일 sel 업데이트
  document.querySelectorAll(`#strip-${idx} .pthumb-img`).forEach(img => {
    img.classList.toggle("sel", parseInt(img.closest(".pthumb").dataset.si) === si);
  });
  const statSec = document.getElementById("stat-" + idx);
  if(statSec && statSec.style.display !== "none") renderStat(d, idx, si);
}

function toggleStat(idx){
  const d = dexData[idx];
  const sec = document.getElementById("stat-" + idx);
  const btn = document.getElementById("sbtn-" + idx);
  const isOpen = sec.style.display === "block";
  sec.style.display = isOpen ? "none" : "block";
  btn.textContent = isOpen ? "State펼치기 ▼" : "State닫기 ▲";
  if(!isOpen) renderStat(d, idx, stageState[idx] || 4);
}

function renderStat(d, idx, si){
  const tbody = document.getElementById("stbody-" + idx);
  const gset = gradeSetOf(d);
  const ss = gset ? (gset[gradeState[idx] || firstGrade(d)] || null)
                  : ((typeof dexStatMap !== "undefined" ? dexStatMap[d.id] : null) || null);
  tbody.innerHTML = [
    {label:"체력",   key:"hp"},
    {label:"공격력", key:"atk"},
    {label:"방어력", key:"def"},
  ].map(r => {
    const s = ss ? ss[r.key] : null;
    if(!s) return `<tr>
      <td class="row-label">${r.label}</td>
      <td class="stat-nil">-</td><td class="stat-nil">-</td><td class="stat-nil">-</td></tr>`;
    const lv45 = s[0] + Math.round(s[1] * 44);
    return `<tr>
      <td class="row-label">${r.label}</td>
      <td>${s[0]}</td><td>${lv45}</td><td>${s[1]}</td></tr>`;
  }).join("");
}

function buildPagination(total, totalPages){
  const pg = document.getElementById("pagination");
  pg.innerHTML = "";
  if(totalPages <= 1) return;
  const isMobile = window.innerWidth < 640;
  const GROUP = isMobile ? 5 : 10;
  const groupStart = Math.floor((curPageNum - 1) / GROUP) * GROUP + 1;
  const groupEnd = Math.min(groupStart + GROUP - 1, totalPages);

  const btn = (label, targetPage, isActive, isDisabled) => {
    const a = document.createElement("a");
    a.className = "pg-btn" + (isActive ? " active" : "") + (isDisabled ? " disabled" : "");
    a.textContent = label;
    if(!isDisabled && !isActive){
      a.href = "javascript:void(0)";
      a.onclick = () => { curPageNum = targetPage; sessionStorage.setItem("dv1_page", targetPage); renderAll(); };
    }
    pg.appendChild(a);
  };

  btn("«", 1, false, curPageNum === 1);
  btn("‹", Math.max(1, groupStart - 1), false, groupStart === 1);
  for(let p = groupStart; p <= groupEnd; p++) btn(p, p, p === curPageNum, false);
  btn("›", Math.min(totalPages, groupEnd + 1), false, groupEnd === totalPages);
  btn("»", totalPages, false, curPageNum === totalPages);
}

// 스탯 필터 입력 이벤트 연결
document.querySelectorAll("#stat-filter-panel .sf-input").forEach(inp => {
  inp.addEventListener("input", applyStatFilters);
});

// 테마 동기화
(function(){
  var link=document.getElementById("theme-css");
  if(!link)return;
  var sync=function(){
    var c=document.getElementById("custom-theme-style");
    if(c&&c.textContent&&c.textContent.length>0){document.documentElement.removeAttribute("data-theme");return;}
    var m=String(link.href||"").match(/theme-(dark|light|beige)\.css/);
    document.documentElement.setAttribute("data-theme",m?m[1]:"dark");
  };
  sync();
  new MutationObserver(sync).observe(link,{attributes:true,attributeFilter:["href"]});
  new MutationObserver(sync).observe(document.head,{childList:true,subtree:true,characterData:true});
})();

// ── 라이트박스 ──
function openLightbox(img){
  if(!img || img.style.display === "none" || !img.getAttribute("src")) return;
  const lb = document.getElementById("lightbox");
  const lbImg = document.getElementById("lightbox-img");
  lbImg.src = img.src;
  lbImg.alt = img.alt || "";
  lb.classList.add("open");
}
function closeLightbox(){
  document.getElementById("lightbox").classList.remove("open");
}
document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){ closeLightbox(); closeDlMenu(); }
});

// ── 이미지 다운로드 ──
let dlMenuIdx = null;
function openDlMenu(e, idx){
  e.stopPropagation();
  dlMenuIdx = idx;
  const menu = document.getElementById("dl-menu");
  menu.classList.add("open");
  const r = e.currentTarget.getBoundingClientRect();
  const mw = menu.offsetWidth;
  let left = r.left + window.scrollX;
  const vw = document.documentElement.clientWidth;
  if(r.left + mw > vw - 8) left = r.right + window.scrollX - mw;
  if(left < window.scrollX + 8) left = window.scrollX + 8;
  menu.style.left = left + "px";
  menu.style.top = (r.bottom + window.scrollY + 4) + "px";
}
function closeDlMenu(){
  document.getElementById("dl-menu").classList.remove("open");
  dlMenuIdx = null;
}
document.addEventListener("click", function(e){
  const menu = document.getElementById("dl-menu");
  if(menu.classList.contains("open") && !menu.contains(e.target)) closeDlMenu();
});

async function saveBlob(url, filename){
  const resp = await fetch(url);
  if(!resp.ok) throw new Error("HTTP " + resp.status);
  const blob = await resp.blob();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}

async function dlCurrent(){
  const idx = dlMenuIdx;
  closeDlMenu();
  if(idx === null) return;
  const d = dexData[idx];
  const si = stageState[idx] || 4;
  const label = STAGES.find(s => s.i === si).l;
  const url = fullUrl(d.n, si);
  if(!url){ alert("받을 수 있는 이미지가 없습니다."); return; }
  try{
    await saveBlob(url, `${d.n}_${label}.png`);
  }catch(err){
    alert("이미지를 받지 못했습니다. (해당 단계 이미지가 없을 수 있습니다)");
  }
}

let _jszipLoad = null;
function loadJSZip(){
  if(window.JSZip) return Promise.resolve();
  if(_jszipLoad) return _jszipLoad;
  _jszipLoad = new Promise((res, rej) => {
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
    sc.onload = res;
    sc.onerror = () => rej(new Error("JSZip 로드 실패"));
    document.head.appendChild(sc);
  });
  return _jszipLoad;
}

async function dlAll(){
  const idx = dlMenuIdx;
  closeDlMenu();
  if(idx === null) return;
  const d = dexData[idx];
  const btn = document.getElementById("dlbtn-" + idx);
  const stages = STAGES.filter(s => stageAvail(d, s.i));
  try{
    if(btn){ btn.disabled = true; btn.textContent = "…"; }
    await loadJSZip();
    const zip = new JSZip();
    let added = 0;
    for(const s of stages){
      const url = fullUrl(d.n, s.i);
      if(!url) continue;
      try{
        const resp = await fetch(url);
        if(!resp.ok) continue;
        zip.file(`${s.i}_${s.l}.png`, await resp.blob());
        added++;
      }catch(_){}
    }
    if(added === 0){ alert("받을 수 있는 이미지가 없습니다."); return; }
    const content = await zip.generateAsync({type:"blob"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(content);
    a.download = `${d.n}.zip`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  }catch(err){
    alert("ZIP 생성에 실패했습니다: " + err.message);
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = "⬇"; }
  }
}

renderAll();
