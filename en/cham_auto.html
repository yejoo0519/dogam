<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>챔피언대전 자동 계산기</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<link id="theme-css" rel="stylesheet" href="../theme-dark.css">
<link rel="stylesheet" href="../ui.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="./theme.js"></script>
<style>

.hd-back{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:1px solid var(--bd);background:var(--sf2);color:var(--text2);text-decoration:none;font-size:16px;flex-shrink:0}
.hd-icon{font-size:26px}.hd-t{font-size:15px;font-weight:800;color:var(--gold)}.hd-s{font-size:11px;color:var(--dim);margin-top:2px}
.wrap{max-width:none;margin:0;padding:0}
.sec{background:var(--sf);border:1px solid var(--bd);border-radius:8px;margin-bottom:14px;overflow:hidden}
.sec-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 15px;background:transparent;border-bottom:1px solid var(--bd);font-size:13.5px;font-weight:600;color:var(--text)}
.sec-bd{padding:12px 16px}
select,input[type=number]{background:var(--sf2);border:1px solid var(--bd);color:var(--text);padding:5px 7px;border-radius:5px;font-family:inherit;font-size:13px;min-width:0}
select:focus,input:focus{outline:none;border-color:var(--gold)}
input[type=number]{width:100%}
.btn{background:none;border:1px solid var(--gold);color:var(--gold);padding:5px 12px;border-radius:5px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:700}
.btn-red{background:none;border:1px solid var(--red);color:var(--red);padding:5px 12px;border-radius:5px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:700}
.common-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.common-grid{grid-template-columns:1fr}}
.lbl{font-size:11px;color:var(--dim);margin-bottom:5px;font-weight:700}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.row3 label{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:800}
.c-hp{color:var(--hpc)}.c-atk{color:var(--atc)}.c-def{color:var(--dfc)}

.team-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.team-tab{flex:1;min-width:90px;padding:10px 8px;background:var(--sf);border:1px solid var(--bd);border-radius:8px;color:var(--dim);font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;text-align:center;line-height:1.35}
.team-tab small{display:block;font-size:10px;font-weight:700;opacity:.8}
.team-tab.on{border-color:var(--gold);color:var(--gold);background:var(--accent-bg)}

.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:680px){.cards{grid-template-columns:1fr}}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.card-hd{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--sf2);border-bottom:1px solid var(--bd)}
.card-img{width:44px;height:44px;object-fit:contain;border-radius:8px;background:var(--sf);flex-shrink:0}
.card-name{font-size:14px;font-weight:800;line-height:1.3;word-break:keep-all}
.card-sub{font-size:11px;color:var(--dim);margin-top:2px}
.card-slot{margin-left:auto;font-size:11px;color:var(--dim);font-weight:800;white-space:nowrap}
.card-bd{padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.grp{border-top:1px dashed var(--bd);padding-top:9px}
.grp:first-child{border-top:none;padding-top:0}
.grp-t{font-size:11px;font-weight:800;color:var(--gold);margin-bottom:6px;display:flex;justify-content:space-between;gap:6px}
.grp-t span{color:var(--dim);font-weight:700}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.f1{display:grid;grid-template-columns:1fr;gap:6px}
.gem-row,.sp-row{display:grid;grid-template-columns:40px 1fr 1fr;gap:6px;align-items:center;margin-bottom:5px}
.sp-row{grid-template-columns:40px 1fr 1fr 58px}
.gem-row .k,.sp-row .k{font-size:11px;color:var(--dim);font-weight:700}
.sp-row .v{font-size:11px;color:var(--text2);text-align:right;font-weight:700}
.ds-wrap{position:relative}
.ds-in{width:100%;background:var(--sf2);border:1px solid var(--bd);color:var(--text);padding:5px 7px;border-radius:5px;font-family:inherit;font-size:13px}
.ds-in:focus{outline:none;border-color:var(--gold)}
.ds-drop{display:none;position:absolute;left:0;right:0;top:100%;margin-top:2px;max-height:240px;overflow:auto;background:var(--sf2);border:1px solid var(--gold);border-radius:6px;z-index:50;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.ds-drop.open{display:block}
.ds-item{display:flex;align-items:center;gap:8px;padding:6px 8px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--bd)}
.ds-item:last-child{border-bottom:none}
.ds-item:hover{background:var(--accent-bg)}
.ds-item img{width:26px;height:26px;object-fit:contain;border-radius:5px;flex-shrink:0}
.ds-item .m{margin-left:auto;font-size:10px;color:var(--dim);white-space:nowrap}
.ds-empty{padding:8px;font-size:12px;color:var(--dim);text-align:center}
.base-line{display:flex;gap:10px;font-size:12px;font-weight:800;flex-wrap:wrap}
.skill{font-size:10px;padding:1px 6px;border-radius:8px;border:1px solid var(--bd);color:var(--dim);margin-left:4px;font-weight:700}
.result{margin-top:auto;border-top:1px solid var(--bd);background:var(--sf2);padding:10px 12px}
.res-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.res-stats div{background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:6px 2px}
.res-stats b{display:block;font-size:16px}
.res-stats small{font-size:10px;color:var(--dim);font-weight:800}
.res-sum{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:12px;color:var(--dim);flex-wrap:wrap}
.res-sum b{color:var(--text)}
.buff-badge{display:inline-block;font-size:10px;font-weight:800;padding:1px 6px;border-radius:8px;border:1px solid var(--gold);color:var(--gold);margin-left:3px}
.empty-note{font-size:12px;color:var(--dim);text-align:center;padding:4px 0}

.sum-table{width:100%;border-collapse:collapse;font-size:12px}
.sum-table th{font-size:11px;color:var(--dim);padding:6px;border-bottom:1px solid var(--bd);text-align:center;white-space:nowrap}
.sum-table td{padding:6px;border-bottom:1px solid var(--bd);text-align:center}
.sum-table td.nm{text-align:left;font-weight:700}
.sum-table tr.team-sep td{background:var(--sf2);color:var(--gold);font-weight:800;text-align:left;font-size:11px}
.sum-scroll{overflow-x:auto}
.save-msg{font-size:11px;color:var(--green);margin-left:auto;white-space:nowrap}

/* ── 자동 계산기 전용 ───────────────────────── */

.page-tab{flex:1;padding:11px 8px;background:var(--sf);border:1px solid var(--bd);border-radius:8px;color:var(--dim);font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;text-align:center}
.page-tab.on{border-color:var(--gold);color:var(--gold);background:var(--accent-bg)}
@media(max-width:680px){.page-tab{font-size:12px;padding:10px 4px;word-break:keep-all}}
.panel{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:12px 16px}
.note{font-size:12px;color:var(--dim);line-height:1.7}
.hr{height:1px;background:var(--bd);margin:12px 0}
.metric-bar{display:flex;gap:6px}
.metric-btn{padding:7px 16px;background:var(--sf2);border:1px solid var(--bd);border-radius:8px;color:var(--dim);font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.metric-btn.on{border-color:var(--gold);color:var(--gold);background:var(--accent-bg)}
.goto-my{display:inline-flex;align-items:center;gap:4px;padding:6px 14px;border:1px solid var(--gold);border-radius:16px;background:var(--accent-bg);color:var(--gold);font-size:12px;font-weight:800;text-decoration:none;white-space:nowrap;flex-shrink:0}
.goto-my:hover{background:var(--gold);color:var(--bg)}
.spec-line{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--text2)}
.spec-line b{color:var(--text)}
.spec-warn{font-size:12px;color:var(--red);margin-top:8px;line-height:1.6}
.run-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.btn-run{background:var(--accent-bg);border:1px solid var(--gold);color:var(--gold);padding:10px 26px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:800}
.btn-run:disabled{opacity:.5;cursor:not-allowed}
.min-box{display:flex;flex-direction:column;gap:14px;margin-top:7px;padding:12px;border:1px solid var(--bd);border-radius:8px;background:var(--sf2)}
.min-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px 8px;align-items:center}
.min-row .k{grid-column:1/3;font-size:12.5px;font-weight:600;color:var(--text2)}
.min-row .tg{grid-column:3/4;justify-self:end;font-size:11px;font-weight:600;padding:4px 10px;border-radius:5px;border:1px solid var(--bd);background:var(--sf);color:var(--dim);cursor:pointer;font-family:inherit}
.min-row .tg.on{border-color:var(--gold);background:var(--accent-bg);color:var(--gold)}
.min-row .f{display:flex;flex-direction:column;align-items:stretch;gap:3px;min-width:0}
.min-row .f span{font-size:11px;font-weight:500;color:var(--dim);white-space:nowrap}
.min-row input{width:100%;padding:6px 8px;border:1px solid var(--bd);border-radius:5px;background:var(--sf);color:var(--text);font-family:inherit;font-size:12px;text-align:right}
.min-row input:focus{outline:none;border-color:var(--gold)}
.min-row.off .f{opacity:.4}
.min-row.off input{pointer-events:none}
.prog{width:100%;height:6px;border-radius:99px;background:var(--bd);overflow:hidden;margin-top:2px}
.prog i{display:block;height:100%;width:0;background:var(--gold);transition:width .1s linear}
.own-bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:7px 0 8px}
.own-q{flex:1;min-width:130px;padding:6px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--sf);color:var(--text);font-family:inherit;font-size:12px}
.own-q:focus{outline:none;border-color:var(--gold)}
.own-body{max-height:330px;overflow-y:auto;border:1px solid var(--bd);border-radius:7px;background:var(--sf2);padding:9px 11px}
.own-grp+.own-grp{margin-top:11px}
.own-grp-t{font-size:11px;font-weight:800;color:var(--gold);margin-bottom:5px}
.own-grp-t span{color:var(--dim);font-weight:700;margin-left:3px}
.own-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px}
.own-it{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 3px 4px;border:1px solid var(--bd);border-radius:7px;background:var(--sf);cursor:pointer;font-family:inherit;opacity:.4;filter:grayscale(1)}
.own-it:hover{opacity:.75}
.own-it.on,.own-it.on:hover{opacity:1;filter:none;border-color:var(--gold);background:var(--accent-bg)}
.own-it img{width:38px;height:38px;object-fit:contain}
.own-it em{font-style:normal;font-size:9.5px;line-height:1.2;color:var(--dim);text-align:center;word-break:keep-all;max-height:23px;overflow:hidden}
.own-it.on em{color:var(--text)}
.own-n{position:absolute;top:2px;right:4px;font-size:10px;font-weight:800;color:var(--gold)}
.own-empty{font-size:12px;color:var(--dim);padding:16px 4px;text-align:center}
.run-note{font-size:11px;color:var(--dim);line-height:1.6}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .chip{padding:6px 12px;font-size:12px}
.chip{padding:4px 0;min-width:0;background:var(--sf2);border:1px solid var(--bd);border-radius:6px;color:var(--dim);font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;text-align:center}
.chip.on-hp{border-color:var(--hpc);color:var(--hpc);background:rgba(251,191,36,.12)}
.chip.on-atk{border-color:var(--atc);color:var(--atc);background:rgba(248,113,113,.12)}
.chip.on-def{border-color:var(--dfc);color:var(--dfc);background:rgba(96,165,250,.12)}
.chip.on{border-color:var(--gold);color:var(--gold);background:var(--accent-bg)}
.preset-row{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.preset-row .chip{padding:3px 9px;font-size:11px}
.preset-row .chip.pat{font-family:'Courier New',monospace;letter-spacing:1px;font-size:12px}
.preset-row .sep{width:1px;background:var(--bd);margin:0 2px}
.sp2-row{display:grid;grid-template-columns:30px repeat(3,1fr) 44px 50px;gap:4px;align-items:center;margin-top:4px}
.sp2-row .k{font-size:11px;color:var(--dim);font-weight:700}
.sp2-row .v{font-size:11px;color:var(--text2);text-align:right;font-weight:700;white-space:nowrap}
.sp2-bonus{grid-template-columns:30px repeat(3,1fr) 98px}
.icon-btn{background:none;border:1px solid var(--bd);color:var(--dim);width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit;display:flex;align-items:center;justify-content:center;padding:0}
.icon-btn:hover{border-color:var(--gold);color:var(--gold)}
.icon-btn.red:hover{border-color:var(--red);color:var(--red)}

/* 드래곤 등록 */
.team-tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.team-tab{flex:1;min-width:90px;padding:9px 8px;background:var(--sf);border:1px solid var(--bd);border-radius:8px;color:var(--dim);font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;text-align:center;line-height:1.35}
.team-tab small{display:block;font-size:10px;font-weight:700;opacity:.8}
.team-tab.on{border-color:var(--gold);color:var(--gold);background:var(--accent-bg)}
.team-head{display:flex;align-items:center;gap:10px;margin:2px 0 8px 2px}
.team-head small{font-size:11px;color:var(--dim);font-weight:700}
.attr-grp{background:var(--sf);border:1px solid var(--bd);border-radius:8px;margin-bottom:8px;overflow:hidden}
.attr-grp>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:9px 14px;cursor:pointer;font-size:13px;font-weight:800;user-select:none}
.attr-grp>summary::-webkit-details-marker{display:none}
.attr-grp>summary::before{content:'▸';color:var(--dim);font-size:11px;transition:transform .15s}
.attr-grp[open]>summary::before{transform:rotate(90deg)}
.attr-grp>summary .n{font-size:11px;color:var(--dim);font-weight:700}
.attr-grp>summary .n b{color:var(--gold)}
.attr-grp>summary .btn{margin-left:auto;padding:3px 10px;font-size:11px}
.attr-body{padding:10px 12px;border-top:1px solid var(--bd)}
.attr-body .dr-grid{margin-bottom:0}
.attr-empty{font-size:12px;color:var(--dim);text-align:center;padding:8px 0}
.grp-tools{display:flex;justify-content:flex-end;gap:6px;margin:-2px 0 8px}
.grp-tools .btn{padding:3px 10px;font-size:11px}
.dr-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
@media(max-width:1000px){.dr-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:680px){.dr-grid{grid-template-columns:1fr}}
.dr-card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.dr-hd{display:flex;align-items:center;gap:9px;padding:8px 10px;background:var(--sf2);border-bottom:1px solid var(--bd);cursor:pointer}
.dr-img{width:38px;height:38px;object-fit:contain;border-radius:7px;background:var(--sf);flex-shrink:0}
.dr-name{font-size:13px;font-weight:800;line-height:1.3;word-break:keep-all}
.dr-sub{font-size:10px;color:var(--dim);margin-top:1px}
.dr-acts{margin-left:auto;display:flex;gap:4px;flex-shrink:0}
.dr-bd{padding:9px 10px;display:flex;flex-direction:column;gap:8px}
.dr-card.closed .dr-bd{display:none}
.dr-sum{padding:7px 10px;font-size:11px;color:var(--text2);line-height:1.5;border-top:1px solid var(--bd);display:none}
.dr-card.closed .dr-sum{display:block}
.dr-sum b{color:var(--text)}
.dr-sum .warn{color:var(--red)}
.empty-team{border:1px dashed var(--bd);border-radius:10px;padding:18px;text-align:center;color:var(--dim);font-size:12px;margin-bottom:16px}

/* 보유 정령 */
.spx-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:1000px){.spx-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:680px){.spx-grid{grid-template-columns:1fr}}
.spx-card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:9px 10px}
.spx-hd{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.spx-no{font-size:11px;font-weight:800;color:var(--gold);white-space:nowrap}
.spx-memo{flex:1;min-width:0;font-size:12px!important;padding:4px 7px!important}
.spx-empty{border:1px dashed var(--bd);border-radius:10px;padding:18px;text-align:center;color:var(--dim);font-size:12px}

/* 결과 카드 */
.team-block{margin-bottom:16px}
.team-title{display:flex;align-items:baseline;gap:8px;font-size:13px;font-weight:800;color:var(--gold);margin:0 0 8px 2px}
.team-title small{font-size:11px;color:var(--dim);font-weight:700}
.card-bd{padding:10px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12px}
.kv .k{color:var(--dim);font-weight:700;flex-shrink:0}
.kv .v{color:var(--text);font-weight:700;text-align:right;word-break:keep-all}
.total-line{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;font-weight:800}
.total-line span{color:var(--dim);font-weight:700;font-size:12px}
.empty-note{color:var(--dim);text-align:center;padding:20px 0;font-size:13px;background:var(--sf);border:1px solid var(--bd);border-radius:8px}

/* 정령·버프 순위표 */
.sim-grid{display:block}
@media(max-width:860px){.sim-grid{grid-template-columns:1fr}}
.rank-tbl{width:100%;border-collapse:collapse;font-size:12px}
.rank-tbl th{font-size:11px;color:var(--dim);padding:7px 6px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap;position:sticky;top:0;background:var(--sf)}
.rank-tbl th.l,.rank-tbl td.l{text-align:left}
.rank-tbl td{padding:6px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
.rank-tbl td.rk{color:var(--dim);font-weight:800;width:28px;text-align:center}
.rank-tbl .nmc{display:flex;align-items:center;gap:7px;text-align:left;white-space:normal;min-width:130px}
.rank-tbl .nmc img{width:28px;height:28px;object-fit:contain;border-radius:5px;flex-shrink:0}
.rank-tbl .nmc b{display:block;font-size:12px;word-break:keep-all}
.rank-tbl .nmc small{display:block;font-size:10px;color:var(--dim);font-weight:700}

.grp-bar .cnt{font-size:11.5px;color:var(--dim)}

.sp-chips{display:inline-flex;gap:3px;align-items:center}

.sp-chip.atk{background:rgba(248,113,113,.14);color:var(--atc)}

// ── 클라우드 저장 (계정 프리셋별) ──────────────────────────
const PRESET_KEY=PRE+'_spec_presets';
function user(){try{return (typeof getUser==='function')?getUser():null;}catch(e){return null;}}
function canCloud(){return !!user()&&typeof supabase==='function';}
function chamData(){return {minst:S.minst,teams:S.teams,spx:{list:S.spx.list,target:S.spx.target,grade:S.spx.grade,own:S.spx.own},rounds:S.rounds,round:S.round,metric:S.metric,sim:S.sim};}
function applyCham(d){
  if(!d)return false;
  const base=mkState();
  if(Array.isArray(d.teams))S.teams=[0,1,2].map(ti=>((d.teams[ti])||[]).filter(q=>q&&ATTRS.includes(q.attr)).map(q=>{
    const e=mkEntry();
    return {...e,...q,uid:q.uid||e.uid,sp:e.sp.map((o,k)=>{const r={...o,...((q.sp||[])[k]||{})};if(r.type!=='%'&&r.type!=='+')r.type=SP_DEF_TYPE(k);return r;})};
  }));
  if(d.spx){
    S.spx.list=(d.spx.list||[]).map(x=>{const q=mkSpirit();return {...q,...x,uid:x.uid||q.uid,memo:String(x.memo||'').slice(0,30),
      sp:q.sp.map((o,k)=>{const r={...o,...((x.sp||[])[k]||{})};if(r.type!=='%'&&r.type!=='+')r.type=SP_DEF_TYPE(k);if(!STATS.includes(r.stat))r.stat='';return r;})};});
    S.spx.target=d.spx.target==='all'?'all':'mine';
    S.spx.grade=GRADES.includes(d.spx.grade)?d.spx.grade:'9.0';
    S.spx.own=normOwn(d.spx.own);
  }
  if(d.minst!==undefined){S.minst=normMin(d.minst);
  }
  if(Array.isArray(d.rounds))S.rounds=base.rounds.map((r,i)=>{
    const q=d.rounds[i]||{};return {name:String(q.name||r.name).slice(0,12),buff:{...r.buff,...(q.buff||{})}};
  });
  if(d.round>=0&&d.round<ROUND_N)S.round=d.round;
  if(d.metric==='eval'||d.metric==='bv')S.metric=d.metric;
  if(d.sim)S.sim={...base.sim,...d.sim,sp:base.sim.sp.map((o,k)=>{const r={...o,...((d.sim.sp||[])[k]||{})};if(r.type!=='%'&&r.type!=='+')r.type=SP_DEF_TYPE(k);return r;})};
  return true;
}

function setCloudStatus(t,c){

let cloudT=null,cloudBusy=false,cloudAgain=false,BOOTING=true;
function cloudQueue(){
  if(!canCloud()||BOOTING)return;
  clearTimeout(cloudT);
  setCloudStatus(L.cloud_saving,'var(--dim)');
  cloudT=setTimeout(cloudPush,2500);
}
async function cloudPush(){
  if (!await ChamAccess.requireAccess()) return;
  cloudT=null;
  if(!canCloud())return;
  if(cloudBusy){cloudAgain=true;return;}
  cloudBusy=true;
  try{
    const u=user();
    const rows=await supabase('GET','users',null,`?id=eq.${u.id}&select=spec_data`);
    let raw=rows&&rows[0]&&rows[0].spec_data;
    if(typeof raw==='string')raw=JSON.parse(raw);
    const P=(raw&&raw.v===2&&Array.isArray(raw.presets)&&raw.presets.length)?raw:{v:2,activeId:'p1',presets:[{id:'p1',name:IS_EN?'Default':'기본',data:raw||{}}]};
    P.cham=P.cham||{};
    P.cham[P.activeId||activePresetId()]=chamData();
    await supabase('PATCH','users',{spec_data:JSON.stringify(P)},`?id=eq.${u.id}`);
    try{localStorage.setItem(PRESET_KEY,JSON.stringify(P));}catch(e){}
    setCloudStatus(L.cloud_saved);
  }catch(e){
    console.warn('[cham] cloud save failed',e);
    setCloudStatus(L.cloud_fail,'var(--red)');
  }
  cloudBusy=false;
  if(cloudAgain){cloudAgain=false;cloudPush();}
}
async function cloudPull(){
  if (!await ChamAccess.requireAccess()) return;
  if(!canCloud())return false;
  try{
    const u=user();
    const rows=await supabase('GET','users',null,`?id=eq.${u.id}&select=spec_data`);
    let raw=rows&&rows[0]&&rows[0].spec_data;
    if(typeof raw==='string')raw=JSON.parse(raw);
    if(!raw||!raw.cham)return false;
    const id=raw.activeId||activePresetId();
    if(!raw.cham[id])return false;
    applyCham(raw.cham[id]);
    try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}
    return true;
  }catch(e){console.warn('[cham] cloud load failed',e);return false;}
}

let SPEC=null;
// 무한 인첸트: 장신구마다 체/공/방 인첸트를 모두 후보로 둠 (자원 id는 동일)
function accVariants(){
  const out=[];
  SPEC.accCards.forEach(a=>{STATS.forEach(st=>out.push({...a,enc:st}));});
  return out;
}
function loadSpec(){
  const p=rd(SPEC_KEY)||{};

    accCards:(p.accCards||[]).map((c,i)=>{
      const db=D.ACC.find(a=>a.ko===c.name||a.en===c.name);
      return db?{...db,_id:i,enc:['hp','atk','def'].includes(c.enchant)?c.enchant:null}:null;
    }).filter(Boolean),

// ── 계산 (엑셀 챔대용 공식) ───────────────────────────────────
function procSpirit(en){
  const plus={hp:0,atk:0,def:0},pct={hp:0,atk:0,def:0},bonus={hp:0,atk:0,def:0};
  (en&&en.sp||[]).slice(0,4).forEach((o,i)=>{
    if(!o||!o.stat||!o.type||!SP_PLUS[o.stat])return;
    if(o.type==='+')plus[o.stat]+=SP_PLUS[o.stat][i+1];
    else if(o.type==='%')pct[o.stat]+=SP_PCT[i+1];
  });
  if(en&&en.bonus&&SP_BONUS[en.bonus])bonus[en.bonus]=SP_BONUS[en.bonus];
  return{plus,pct,bonus};
}
function calcPendPct(pend){
  let pH=0,pA=0,pD=0;
  if(pend){
    const mo=pend.type==='태양'?3:pend.type==='달'?2:1;
    (pend.options||[]).slice(0,mo).forEach(o=>{
      if(!o||!o.stat)return;
      const v=(o.val||0)/100;
      if(o.stat==='hp')pH+=v;else if(o.stat==='atk')pA+=v;else pD+=v;
    });
  }
  return{pH,pA,pD};
}
function chamStat(base,gem,pot,accP,spPct,spPlus,pendP,bonus,coll,buffP){
  const s1=INT((base+gem+pot)*(1+accP));
  const s2=INT(s1*(1+SPIRIT_W*spPct)+(SPIRIT_W*spPlus)*(1+SPIRIT_W*spPct));
  const s3=INT(s2*(1+pendP))+bonus+coll;
  return INT(s3*(1+buffP));
}
function calcOption(cand,acc,pend,gemHAD){
  const {pH,pA,pD}=pend?pend._pct:{pH:0,pA:0,pD:0};
  const sp=cand.sp;
  const out={};
  const buffs=[];
  STATS.forEach(st=>{
    const accP=acc[st]+(acc.enc===st?ENC_PCT:0);
    const pendP=st==='hp'?pH:st==='atk'?pA:pD;
    const buffP=(curBuff()[st]&&curBuff()[st]===cand.attr)?BUFF_PCT[st]:0;
    if(buffP)buffs.push(st);
    out[st]=chamStat(cand.base[st],gemHAD[st],POTION[st],accP,sp.pct[st],sp.plus[st],pendP,sp.bonus[st],COLL[st],buffP);
  });
  out.eval=out.hp+out.atk*4+out.def*4;
  out.bv=out.hp*out.atk*out.def;
  out.m=S.metric==='eval'?out.eval:out.bv;
  out.buffs=buffs;
  return out;
}

// ── 젬 재고 ──────────────────────────────────────────────────
let INV=null;
function buildInv(){
  INV={tot:{}};
  STATS.forEach(s=>{
    INV[s]=[40,39,38,37,36].map(lv=>({lv,val:GEM[lv]?GEM[lv][s]:0,cnt:Number((SPEC.gems[s]||{})[lv])||0})).filter(x=>x.cnt>0&&x.val>0);
    INV.tot[s]=INV[s].reduce((a,x)=>a+x.cnt,0);
  });
}
function topGemSum(st,k){
  let s=0,left=k;
  for(const g of INV[st]){const t=Math.min(g.cnt,left);s+=t*g.val;left-=t;if(!left)break;}
  return s;
}
function genShapes(){
  const res=[];
  for(let h=0;h<=5;h++)for(let a=0;a<=5-h;a++)for(let d=0;d<=5-h-a;d++){
    if(h>INV.tot.hp||a>INV.tot.atk||d>INV.tot.def)continue;
    res.push({h,a,d});
  }
  return res;
}

// ── 등록 드래곤 → 계산 후보 ───────────────────────────────────
function entryValid(ti,en){
  if(!en.attr||!en.name)return false;
  if(TEAMS[ti].kind==='gang')return !!(en.dtype&&D.BASE[en.grade]&&D.BASE[en.grade][en.dtype]&&gangRow(en));
  return !!gradeRow(en,TEAMS[ti].lv);
}
function teamCandidates(ti){
  const t=TEAMS[ti];
  return S.teams[ti].map((en,i)=>{
    if(!entryValid(ti,en))return null;
    if(t.kind==='gang'){
      const g=gangRow(en);
      return {id:'e'+ti+'-'+i,attr:en.attr,name:en.name,en:g.en,img:g.img,imgStage:8,
        sub:attrLbl(en.attr)+' · '+typeLbl(en.dtype)+' · '+en.grade,
        base:D.BASE[en.grade][en.dtype],sp:procSpirit(en),entry:en};
    }
    const g=gradeRow(en,t.lv);
    return {id:'e'+ti+'-'+i,attr:en.attr,name:en.name,en:g.en,did:g.did,img:g.did,imgStage:4,
      sub:attrLbl(en.attr)+' · Lv.'+t.lv,base:{hp:g.hp,atk:g.atk,def:g.def},sp:procSpirit(en),sk:g.sk,entry:en};
  }).filter(Boolean);
}

// ── 드래곤별 셋팅 후보 ────────────────────────────────────────
let ACCV=[];
function buildOptions(cand,shapes,pends){
  const bestBy=new Map();
  const opts=[];let minM=-Infinity;
  for(const acc of ACCV){
    for(const pend of pends){
      for(const sh of shapes){
        const r=calcOption(cand,acc,pend,{hp:topGemSum('hp',sh.h),atk:topGemSum('atk',sh.a),def:topGemSum('def',sh.d)});
        const opt={cand,acc,pend,sh,r,m:r.m};
        const sig=sh.h+','+sh.a+','+sh.d;
        const pid=pend?pend._id:'x';
        const gc=sh.h+sh.a+sh.d;
        if(!pend){const k='n'+acc._id+'|'+sig;if(!bestBy.has(k)||opt.m>bestBy.get(k).m)bestBy.set(k,opt);}
        for(const k of ['a'+acc._id,'p'+pid,'pg'+pid+'|'+gc,'pa'+pid+'|'+acc._id,'pag'+pid+'|'+acc._id+'|'+gc]){
          if(!bestBy.has(k)||opt.m>bestBy.get(k).m)bestBy.set(k,opt);
        }
        if(opt.m>minM||opts.length<OPT_LIMIT){
          let lo=0,hi=opts.length;
          while(lo<hi){const md=(lo+hi)>>1;if(opts[md].m>=opt.m)lo=md+1;else hi=md;}
          opts.splice(lo,0,opt);
          if(opts.length>OPT_LIMIT)opts.pop();
          minM=opts.length===OPT_LIMIT?opts[opts.length-1].m:-Infinity;
        }
      }
    }
  }
  const seen=new Set(),merged=[];
  [...opts,...bestBy.values()].sort((a,b)=>b.m-a.m).forEach(o=>{
    const k=o.acc._id+'|'+(o.pend?o.pend._id:'x')+'|'+o.sh.h+','+o.sh.a+','+o.sh.d;
    if(seen.has(k))return;seen.add(k);merged.push(o);
  });
  return merged;
}

// ── 자원 체크 ────────────────────────────────────────────────
function fits(opt,used){
  if(used.acc.has(opt.acc._id))return false;
  if(opt.cand.spId!=null&&used.sp&&used.sp.has(opt.cand.spId))return false;
  if(opt.pend&&used.pend.has(opt.pend._id))return false;
  if(used.gem.hp+opt.sh.h>INV.tot.hp)return false;
  if(used.gem.atk+opt.sh.a>INV.tot.atk)return false;
  if(used.gem.def+opt.sh.d>INV.tot.def)return false;
  return true;
}
function consume(opt,used){
  used.acc.add(opt.acc._id);
  if(opt.cand.spId!=null&&used.sp)used.sp.add(opt.cand.spId);
  if(opt.pend)used.pend.add(opt.pend._id);
  used.gem.hp+=opt.sh.h;used.gem.atk+=opt.sh.a;used.gem.def+=opt.sh.d;
  used.slot.add(opt.cand.id);
}
function release(opt,used){
  used.acc.delete(opt.acc._id);
  if(opt.cand.spId!=null&&used.sp)used.sp.delete(opt.cand.spId);
  if(opt.pend)used.pend.delete(opt.pend._id);
  used.gem.hp-=opt.sh.h;used.gem.atk-=opt.sh.a;used.gem.def-=opt.sh.d;
  used.slot.delete(opt.cand.id);
}

// 상위 N개 + 장신구별/펜던트별/장신구별(펜던트 없음) 최고를 남겨 자원 충돌 시 대안 확보
function diversifyOpts(opts,n){
  const keep=new Set(),out=[];
  const add=o=>{if(!keep.has(o)){keep.add(o);out.push(o);}};
  opts.slice(0,n).forEach(add);
  const seenA=new Set(),seenAE=new Set(),seenP=new Set(),seenPG=new Set(),seenPA=new Set(),seenPAG=new Set(),seenAN=new Set(),seenS=new Set(),seenSp=new Set(),seenASp=new Set(),seenG=new Set(),seenAG=new Set();
  for(const o of opts){
    const a=o.acc._id,p=o.pend?o.pend._id:'x',sh=o.sh.h+','+o.sh.a+','+o.sh.d;
    if(!seenA.has(a)){seenA.add(a);add(o);}
    const ae=a+'|'+(o.acc.enc||'x');
    if(!seenAE.has(ae)){seenAE.add(ae);add(o);}
    if(!seenP.has(p)){seenP.add(p);add(o);}
    if(p==='x'&&!seenAN.has(a)){seenAN.add(a);add(o);}
    if(!seenS.has(sh)&&seenS.size<12){seenS.add(sh);add(o);}
    // 젬이 모자랄 때를 대비해 사용 젬 개수(0~5)별 최고도 확보
    const gc=o.sh.h+o.sh.a+o.sh.d;
    if(!seenG.has(gc)){seenG.add(gc);add(o);}
    const pid=o.pend?o.pend._id:'x';
    if(!seenPG.has(pid+'|'+gc)){seenPG.add(pid+'|'+gc);add(o);}
    if(!seenPA.has(pid+'|'+a)){seenPA.add(pid+'|'+a);add(o);}
    if(!seenPAG.has(pid+'|'+a+'|'+gc)&&seenPAG.size<220){seenPAG.add(pid+'|'+a+'|'+gc);add(o);}
    const ag=a+'|'+gc;
    if(gc<=2&&!seenAG.has(ag)&&seenAG.size<40){seenAG.add(ag);add(o);}
    const sp=o.cand.spId==null?'x':o.cand.spId;
    if(!seenSp.has(sp)){seenSp.add(sp);add(o);}
    const ap=a+'|'+sp;
    if(!seenASp.has(ap)&&seenASp.size<80){seenASp.add(ap);add(o);}
  }
  return out;
}

// ── 팀 3마리 최적 조합 ────────────────────────────────────────
function bestTeamDeck(sets,used,optCap,mTi){
  const gemLeft={hp:INV.tot.hp-used.gem.hp,atk:INV.tot.atk-used.gem.atk,def:INV.tot.def-used.gem.def};
  const S3=sets
    .filter(s=>!used.slot.has(s.cand.id))
    .map(s=>({cand:s.cand,opts:diversifyOpts(s.opts.filter(o=>fits(o,used)),optCap||60).sort((a,b)=>b.m-a.m)}))
    .filter(s=>s.opts.length)
    .map(s=>({...s,best:s.opts[0].m}))
    .sort((a,b)=>b.best-a.best)
    .slice(0,14);
  let bestDeck=null,bestScore=-Infinity;
  const compat=(a,b)=>{
    if(a.acc._id===b.acc._id)return false;
    if(a.cand.spId!=null&&a.cand.spId===b.cand.spId)return false;
    if(a.cand.id===b.cand.id)return false;
    if(a.pend&&b.pend&&a.pend._id===b.pend._id)return false;
    return true;
  };
  const gemOk=(a,b,c)=>
    (a.sh.h+b.sh.h+(c?c.sh.h:0)<=gemLeft.hp)&&
    (a.sh.a+b.sh.a+(c?c.sh.a:0)<=gemLeft.atk)&&
    (a.sh.d+b.sh.d+(c?c.sh.d:0)<=gemLeft.def);
  for(let i=0;i<S3.length-2;i++)for(let j=i+1;j<S3.length-1;j++)for(let k=j+1;k<S3.length;k++){
    const A=S3[i],B=S3[j],C=S3[k];
    if(A.best+B.best+C.best<=bestScore)continue;
    for(const a of A.opts){
      if(a.m+B.best+C.best<=bestScore)break;
      for(const b of B.opts){
        if(a.m+b.m+C.best<=bestScore)break;
        if(!compat(a,b)||!gemOk(a,b,null))continue;
        for(const c of C.opts){
          if(a.m+b.m+c.m<=bestScore)break;
          if(!compat(a,c)||!compat(b,c)||!gemOk(a,b,c))continue;
          bestScore=a.m+b.m+c.m;
          bestDeck=[a,b,c];
        }
      }
    }
  }
  if(bestDeck)return bestDeck;
  // 조합 탐색이 실패하면(자원이 빠듯할 때) 남은 자원으로 한 마리씩 그리디로 채움
  const tmp={acc:new Set(used.acc),pend:new Set(used.pend),gem:{...used.gem},slot:new Set(used.slot),sp:new Set(used.sp)};
  const pool=sets.filter(s=>!used.slot.has(s.cand.id));
  const picked=[];
  for(const s of pool){
    if(picked.length>=3)break;
    const o=(s.opts||[]).find(x=>fits(x,tmp)&&minOk(mTi,x.r))||bestFeasibleOption(s.cand,tmp,mTi);
    if(!o)continue;
    picked.push(o);consume(o,tmp);
  }
  return picked.length===3?picked:null;
}
// 남은 자원만으로 그 드래곤의 최적 셋팅을 그 자리에서 계산 (폴백용)
function bestFeasibleOption(cand,used,mTi){
  const left={hp:INV.tot.hp-used.gem.hp,atk:INV.tot.atk-used.gem.atk,def:INV.tot.def-used.gem.def};
  const pends=[null,...SPEC.pendants.map(p=>({...p,_pct:calcPendPct(p)}))].filter(p=>!p||!used.pend.has(p._id));
  const accs=ACCV.filter(a=>!used.acc.has(a._id));
  let best=null;
  for(const acc of accs)for(const pend of pends){
    for(let h=0;h<=Math.min(5,left.hp);h++)for(let a=0;a<=Math.min(5-h,left.atk);a++){
      const dMax=Math.min(5-h-a,left.def);
      for(let d=0;d<=dMax;d++){
        const r=calcOption(cand,acc,pend,{hp:topGemSum('hp',h),atk:topGemSum('atk',a),def:topGemSum('def',d)});
        if(!minOk(mTi,r))continue;
        if(!best||r.m>best.m)best={cand,acc,pend,sh:{h,a,d},r,m:r.m};
      }
    }
  }
  return best;
}

// ── 남은 펜던트 채우기 (보유 펜던트가 드래곤 수보다 많을 때) ──
function assignLeftoverPendants(decks){
  const all=[];
  decks.forEach(d=>{if(d)d.forEach(o=>all.push(o));});
  if(!all.length)return;
  const used=new Set(all.filter(o=>o.pend).map(o=>o.pend._id));
  let left=SPEC.pendants.filter(p=>!used.has(p._id)).map(p=>({...p,_pct:calcPendPct(p)}));
  if(!left.length)return;
  // 펜던트가 없는 드래곤부터, 남은 것 중 가장 이득이 큰 걸 배정
  let empties=all.filter(o=>!o.pend);
  while(left.length&&empties.length){
    let pick=null;
    empties.forEach(o=>{
      const g={hp:topGemSum('hp',o.sh.h),atk:topGemSum('atk',o.sh.a),def:topGemSum('def',o.sh.d)};
      left.forEach(p=>{
        const r=calcOption(o.cand,o.acc,p,g);
        const gain=r.m-o.m;
        if(!pick||gain>pick.gain)pick={o,p,r,gain};
      });
    });
    if(!pick||pick.gain<=0)break;
    pick.o.pend=pick.p;pick.o.r=pick.r;pick.o.m=pick.r.m;
    left=left.filter(p=>p._id!==pick.p._id);
    empties=empties.filter(o=>o!==pick.o);
  }
  // 남은 게 더 좋으면 이미 낀 것과 교체
  let changed=true,guard=0;
  while(left.length&&changed&&guard++<20){
    changed=false;
    let best=null;
    all.forEach(o=>{
      if(!o.pend)return;
      const g={hp:topGemSum('hp',o.sh.h),atk:topGemSum('atk',o.sh.a),def:topGemSum('def',o.sh.d)};
      left.forEach(p=>{
        const r=calcOption(o.cand,o.acc,p,g);
        const gain=r.m-o.m;
        if(gain>0&&(!best||gain>best.gain))best={o,p,r,gain,old:o.pend};
      });
    });
    if(best){
      left=left.filter(p=>p._id!==best.p._id).concat([{...best.old,_pct:calcPendPct(best.old)}]);
      best.o.pend=best.p;best.o.r=best.r;best.o.m=best.r.m;
      changed=true;
    }
  }
}

// ── 최종 젬 단계 배정 ────────────────────────────────────────
function finalizeGems(decks){
  const left={};STATS.forEach(s=>{left[s]=INV[s].map(g=>({...g}));});
  const take=(st,k)=>{
    const items=[];let sum=0;
    for(const g of left[st]){
      while(g.cnt>0&&items.length<k){g.cnt--;items.push({lv:g.lv,val:g.val});sum+=g.val;}
      if(items.length>=k)break;
    }
    return{items,sum};
  };
  const all=[];
  decks.forEach(d=>{if(d)d.forEach(o=>all.push(o));});
  all.sort((a,b)=>b.m-a.m);
  all.forEach(o=>{
    const gh=take('hp',o.sh.h),ga=take('atk',o.sh.a),gd=take('def',o.sh.d);
    o.gems={hp:gh.items,atk:ga.items,def:gd.items};
    o.r=calcOption(o.cand,o.acc,o.pend,{hp:gh.sum,atk:ga.sum,def:gd.sum});
    o.m=o.r.m;
  });
}

async function solve(makeSets,optCap,onProg){
  const P=typeof onProg==='function'?onProg:()=>{};
  buildInv();
  ACCV=accVariants();
  const shapes=genShapes();
  const pends=[null,...SPEC.pendants.map(p=>({...p,_pct:calcPendPct(p)}))];
  P(1);await tick();
  let setsByTeam;
  if(makeSets){
    setsByTeam=await makeSets(shapes,pends,f=>P(1+f*62));
  }else{
    setsByTeam=[];
    for(let ti=0;ti<3;ti++){
      const cands=teamCandidates(ti);const arr=[];
      for(let i=0;i<cands.length;i++){
        const opts=buildOptions(cands[i],shapes,pends);
        if(opts.length)arr.push({cand:cands[i],opts});
        P(1+((ti+(i+1)/Math.max(1,cands.length))/3)*62);
        await tick();
      }
      setsByTeam.push(arr);
    }
  }
  // 자동 계산에서만 팀별 최소 스탯을 적용한다 (정령 배분은 제외)
  const useMin=!makeSets;
  if(useMin)setsByTeam=setsByTeam.map((arr,ti)=>{
    if(!minOf(ti))return arr;
    return arr.map(s=>({...s,opts:s.opts.filter(o=>minOk(ti,o.r))})).filter(s=>s.opts.length);
  });
  const mti=ti=>useMin?ti:-1;
  P(63);await tick();
  const orders=[[0,1,2],[2,1,0]];
  let best=null;
  const STEPS=orders.length*9;let step=0;
  const bump=async()=>{step++;P(63+step/STEPS*35);await tick();};
  for(const order of orders){
    const used={acc:new Set(),pend:new Set(),gem:{hp:0,atk:0,def:0},slot:new Set(),sp:new Set()};
    let decks=[null,null,null];
    for(const ti of order){
      const deck=bestTeamDeck(setsByTeam[ti],used,optCap,mti(ti));
      decks[ti]=deck;
      if(deck)deck.forEach(o=>consume(o,used));
      await bump();
    }
    for(let r=0;r<2;r++){
      for(let ti=0;ti<3;ti++){
        if(decks[ti])decks[ti].forEach(o=>release(o,used));
        const deck=bestTeamDeck(setsByTeam[ti],used,optCap,mti(ti));
        const oldM=decks[ti]?decks[ti].reduce((s,o)=>s+o.m,0):-1;
        const newM=deck?deck.reduce((s,o)=>s+o.m,0):-1;
        decks[ti]=newM>=oldM?deck:decks[ti];
        if(decks[ti])decks[ti].forEach(o=>consume(o,used));
        await bump();
      }
    }
    decks=decks.map(d=>d?d.map(o=>({...o})):null);
    const total=decks.reduce((s,d)=>s+(d?d.reduce((x,o)=>x+o.m,0):0),0);
    const filled=decks.reduce((s,d)=>s+(d?d.length:0),0);
    if(!best||filled>best.filled||(filled===best.filled&&total>best.total))best={decks,total,filled};
  }
  assignLeftoverPendants(best.decks);
  finalizeGems(best.decks);
  P(100);
  return best;
}

async function run(){
  if (!await ChamAccess.requireAccess()) return;
  const btn=document.getElementById('run-btn');
  btn.disabled=true;btn.textContent=L.running_p(0);progBar(btn,0);
  save();
  await tick();
  try{
    const t0=performance.now();
    let last=-1;
    const best=await solve(null,null,p=>{
      const v=Math.max(0,Math.min(99,Math.round(p)));
      if(v!==last){last=v;btn.textContent=L.running_p(v);progBar(btn,v);}
    });
    renderResult(best,performance.now()-t0);
    document.getElementById('advice').innerHTML='';
  }catch(e){console.error(e);alert(L.err+e.message);}
  progBar(btn,null);
  btn.disabled=false;btn.textContent=L.run;
  updateRunState();
}

    Object.keys(cnt).sort((a,b)=>b-a).forEach(lv=>parts.push(`${statLbl(st)} ${GEM_NAME[lv]} ×${cnt[lv]}`));

function renderResult(best,ms,elId,reasonFn){
  if(elId!=='spx-result')LAST_BEST=best;

  if(!best||!best.filled){el.innerHTML=`<div class="sec"><div class="sec-bd empty-note">${L.no_result}</div></div>`;return;}
  let html='';

  TEAMS.forEach((t,ti)=>{

    html+=`<div class="team-block"><div class="team-title">${esc(L.team(ti+1))}<small>${esc(t.kind==='gang'?L.kind_gang:L.kind_grade(t.lv))}</small></div>`;

      html+=`<div class="sec"><div class="sec-bd empty-note">${reason}</div></div></div>`;return;
    }
    deck.sort((a,b)=>b.m-a.m);

function dsCandidates(ti,i,q){
  const t=TEAMS[ti];const en=S.teams[ti][i];const key=normName(q);
  const attrs=[en.attr];
  const hit=(d,extra)=>{if(!key)return true;const names=[d.ko,d.en,...(extra||[])];return names.some(n=>n&&normName(n).includes(key));};
  let list=[];
  if(t.kind==='gang'){
    const DB=window.DRAGON_TYPE_DB||{};
    const aliasOf=name=>{for(const l of Object.values(DB)){if(!Array.isArray(l))continue;for(const e of l){if(e&&typeof e==='object'&&normName(e.name)===normName(name))return e.aliases||[];}}return[];};
    attrs.forEach(a=>gangDb(a).forEach(d=>{if(hit(d,aliasOf(d.ko)))list.push({d,attr:a,img:imgUrl(d.img,8),meta:attrLbl(a)});}));
  }else{
    attrs.forEach(a=>D.GRADE.filter(g=>g.elem===a&&g.lv===t.lv).sort((x,y)=>y.ev-x.ev).forEach(d=>{if(hit(d))list.push({d,attr:a,img:imgUrl(d.did,4),meta:attrLbl(a)+' · '+d.ev});}));
  }
  return list.slice(0,40);
}
function dsFilter(ti,i,q){

    :`<div class="ds-empty">${L.no_result_s}</div>`;
  drop.classList.add('open');
}

function dsBlur(ti,i,el){

// ── 정령·버프 시뮬 (등급용 SSS에 정령만 장착) ─────────────────
const NO_ACC={hp:0,atk:0,def:0,enc:null,_id:-1};
// 결과는 입력이 그대로면 재사용한다 (SSS 162마리 x 장비 조합이라 매번 돌리면 0.6초쯤 걸림)
let SIM_CACHE=null,SIM_CKEY='';
function simCacheKey(){
  const sp=SPEC||{};
  return JSON.stringify([S.sim.lv,S.sim.gear,S.metric,S.sim.sp,S.sim.bonus,curBuff(),
    (sp.accCards||[]).map(a=>a.name+'|'+a.enc),sp.gems,(sp.pendants||[]).map(p=>p.type+'|'+JSON.stringify(p.options))]);
}
function simCached(){return !!SIM_CACHE&&SIM_CKEY===simCacheKey();}
function simRows(){
  const a=S.sim.attr;
  const all=simRowsAll();
  return a?all.filter(x=>x.g.elem===a):all;
}
function simRowsAll(){
  const key=simCacheKey();
  if(SIM_CACHE&&SIM_CKEY===key)return SIM_CACHE;
  const rows=simRowsCalc();
  SIM_CKEY=key;SIM_CACHE=rows;
  return rows;
}
function simRowsCalc(){
  const lv=S.sim.lv;
  const sp=procSpirit(S.sim);
  const seen=new Set();
  const list=D.GRADE.filter(g=>g.lv===lv&&/ SSS$/.test(g.ko)).filter(g=>{
    const k=g.ko+'|'+g.elem;if(seen.has(k))return false;seen.add(k);return true;
  });
  const useGear=S.sim.gear===1&&SPEC&&SPEC.accCards.length;
  if(!useGear){
    return list.map(g=>({g,r:calcOption({attr:g.elem,base:{hp:g.hp,atk:g.atk,def:g.def},sp},NO_ACC,null,{hp:0,atk:0,def:0}),gear:null}))
      .sort((a,b)=>b.r.m-a.r.m);
  }
  // 내 스펙에서 그 드래곤에게 가장 좋은 장신구·인첸트·젬·펜던트 조합을 찾아 적용 (드래곤별 독립)
  buildInv();
  ACCV=accVariants();
  const shapes=genShapes();
  const gemSum=shapes.map(sh=>({sh,g:{hp:topGemSum('hp',sh.h),atk:topGemSum('atk',sh.a),def:topGemSum('def',sh.d)}}));
  const pends=[null,...SPEC.pendants.map(p=>({...p,_pct:calcPendPct(p)}))];
  return list.map(g=>{
    const cand={attr:g.elem,base:{hp:g.hp,atk:g.atk,def:g.def},sp};
    let best=null;
    for(const acc of ACCV)for(const pend of pends)for(const gs of gemSum){
      const r=calcOption(cand,acc,pend,gs.g);
      if(!best||r.m>best.r.m)best={r,acc,pend,sh:gs.sh};
    }
    return {g,r:best.r,gear:best};
  }).sort((a,b)=>b.r.m-a.r.m);
}
function simGearText(gear){
  if(!gear)return '';
  const parts=[nm(gear.acc)+(gear.acc.enc?`+${statLbl(gear.acc.enc)}`:'')];
  const gs=[];
  if(gear.sh.h)gs.push(statLbl('hp')+'×'+gear.sh.h);
  if(gear.sh.a)gs.push(statLbl('atk')+'×'+gear.sh.a);
  if(gear.sh.d)gs.push(statLbl('def')+'×'+gear.sh.d);
  if(gs.length)parts.push(L.gems+' '+gs.join(' '));
  if(gear.pend)parts.push(L.pend_t[gear.pend.type]||gear.pend.type);
  return parts.join(' · ');
}

function bestSummary(best){
  const rows=[];
  (best&&best.decks||[]).forEach((deck,ti)=>{
    if(!deck)return;
    deck.slice().sort((a,b)=>b.m-a.m).forEach(o=>rows.push({
      ti,name:nm({ko:o.cand.name,en:o.cand.en||o.cand.name}),img:o.cand.img,stage:o.cand.imgStage,
      sub:o.cand.sub,acc:nm(o.acc)+(o.acc.enc?` (${L.enc} ${statLbl(o.acc.enc)})`:''),
      gems:gemText(o),pend:o.pend?`${L.pend_t[o.pend.type]||o.pend.type} ${(o.pend.options||[]).slice(0,o.pend.type==='태양'?3:o.pend.type==='달'?2:1).map(x=>statLbl(x.stat)+x.val+'%').join('/')}`:L.none,
      sp:(o.cand.spLabel!=null?o.cand.spLabel:(o.cand.entry?spiritText(o.cand.entry):''))||L.none,
      hp:o.r.hp,atk:o.r.atk,def:o.r.def,eval:o.r.eval,bv:o.r.bv,buffs:o.r.buffs
    }));
  });
  const tot=rows.reduce((a,r)=>({eval:a.eval+r.eval,bv:a.bv+r.bv}),{eval:0,bv:0});
  return {rows,tot};
}
function loadImg(src){
  return new Promise(res=>{
    if(!src)return res(null);
    const im=new Image();
    im.onload=()=>res(im);im.onerror=()=>res(null);
    im.src=src;
  });
}
async function exportImage(best){
  if(!best||!best.filled)return;
  const S1=bestSummary(best);
  const cssv=getComputedStyle(document.documentElement);
  const col=k=>cssv.getPropertyValue(k).trim()||'#fff';
  const BG=col('--bg'),SF=col('--sf'),BD=col('--bd'),TX=col('--text'),DIM=col('--dim'),GOLD=col('--gold');
  const CH=[col('--hpc'),col('--atc'),col('--dfc')];
  const W=1080,CARD_H=176,PAD=24;
  const H=PAD*2+64+3*(26+3*(CARD_H+10))+60;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const x=cv.getContext('2d');
  x.fillStyle=BG;x.fillRect(0,0,W,H);
  x.textBaseline='top';
  const F=(w,s)=>`${w} ${s}px 'Nanum Gothic',sans-serif`;
  x.fillStyle=GOLD;x.font=F(800,26);x.fillText(L.img_title,PAD,PAD);
  const rd=S.rounds[S.round];
  const buffTxt=STATS.filter(st=>curBuff()[st]).map(st=>`${statLbl(st)} ${attrLbl(curBuff()[st])}`).join('  ')||L.none;

  const imgs=await Promise.all(S1.rows.map(r=>loadImg(imgUrl(r.img,r.stage))));
  let y=PAD+70;
  const rr=(px,py,w,h,r)=>{x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath();};
  let idx=0;
  TEAMS.forEach((t,ti)=>{
    const rows=S1.rows.filter(r=>r.ti===ti);
    if(!rows.length)return;
    x.fillStyle=GOLD;x.font=F(800,16);
    x.fillText(`${L.team(ti+1)}  `,PAD,y);
    const tw=x.measureText(`${L.team(ti+1)}  `).width;
    x.fillStyle=DIM;x.font=F(700,13);
    x.fillText(t.kind==='gang'?L.kind_gang:L.kind_grade(t.lv),PAD+tw,y+3);
    y+=26;
    rows.forEach(r=>{
      const im=imgs[S1.rows.indexOf(r)];
      x.fillStyle=SF;rr(PAD,y,W-PAD*2,CARD_H,12);x.fill();
      x.strokeStyle=BD;x.lineWidth=1;rr(PAD,y,W-PAD*2,CARD_H,12);x.stroke();
      if(im)x.drawImage(im,PAD+14,y+14,52,52);
      x.fillStyle=TX;x.font=F(800,17);x.fillText(r.name,PAD+78,y+16);
      x.fillStyle=DIM;x.font=F(700,12);x.fillText(r.sub,PAD+78,y+40);
      // 셋팅 4줄
      const lines=[[L.acc,r.acc],[L.gems,r.gems],[L.pendant,r.pend],[L.spirit,r.sp]];
      lines.forEach((ln,i)=>{
        const ly=y+66+i*22;
        x.fillStyle=DIM;x.font=F(700,12);x.fillText(ln[0],PAD+16,ly);
        x.fillStyle=TX;x.font=F(700,13);
        let txt=String(ln[1]);
        while(x.measureText(txt).width>470&&txt.length>4)txt=txt.slice(0,-2);
        x.fillText(txt,PAD+92,ly-1);
      });
      // 스탯
      const sx=W-PAD-380;
      STATS.forEach((st,i)=>{
        const cx=sx+i*124;
        x.fillStyle=col('--sf2');rr(cx,y+22,112,60,10);x.fill();
        x.fillStyle=DIM;x.font=F(800,11);
        const lab=statLbl(st)+(r.buffs.includes(st)?(st==='def'?' +50%':' +40%'):'');
        x.fillText(lab,cx+12,y+32);
        x.fillStyle=CH[i];x.font=F(800,22);x.fillText(fmt(r[st]),cx+12,y+50);
      });
      x.fillStyle=DIM;x.font=F(700,12);
      x.fillText(`EVAL ${fmt(r.eval)}    ${L.bv} ${fmt(r.bv)}`,sx,y+CARD_H-32);
      y+=CARD_H+10;
    });
  });
  x.fillStyle=DIM;x.font=F(700,12);
  x.fillText(L.img_footer,PAD,H-PAD-6);
  cv.toBlob(bl=>{
    if(!bl){alert(L.img_fail);return;}
    const a=document.createElement('a');
    a.href=URL.createObjectURL(bl);
    a.download=`cham_${new Date().toISOString().slice(0,10)}.png`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  },'image/png');
}

function renderCompare(){
  const el=document.getElementById('compare');if(!el)return;
  if(!SNAPS.length){el.innerHTML='';return;}
  const A=SNAPS[0],B=SNAPS[1];
  const diff=(a,b)=>{
    if(b==null)return '';
    const d=b-a;const pc=a?(d/a*100):0;
    const c=d>0?'var(--green)':d<0?'var(--red)':'var(--dim)';
    return `<span style="color:${c}">${d>0?'+':''}${fmt(d)} (${d>0?'+':''}${pc.toFixed(1)}%)</span>`;
  };
  const head=`<tr><th class="l">${L.cmp_item}</th><th>${esc(A.label)}</th>${B?`<th>${esc(B.label)}</th><th>${L.cmp_diff}</th>`:''}</tr>`;
  let body=`<tr><td class="l"><b>${L.total} EVAL</b></td><td>${fmt(A.tot.eval)}</td>${B?`<td>${fmt(B.tot.eval)}</td><td>${diff(A.tot.eval,B.tot.eval)}</td>`:''}</tr>
    <tr><td class="l"><b>${L.total} ${L.bv}</b></td><td>${fmt(A.tot.bv)}</td>${B?`<td>${fmt(B.tot.bv)}</td><td>${diff(A.tot.bv,B.tot.bv)}</td>`:''}</tr>`;
  const key=S.metric==='eval'?'eval':'bv';
  const n=Math.max(A.rows.length,B?B.rows.length:0);
  for(let i=0;i<n;i++){
    const a=A.rows[i],b=B?B.rows[i]:null;
    body+=`<tr><td class="l" style="color:var(--dim)">${esc((a?a.name:b.name))}${b&&a&&b.name!==a.name?' → '+esc(b.name):''}</td>
      <td>${a?fmt(a[key]):'—'}</td>${B?`<td>${b?fmt(b[key]):'—'}</td><td>${a&&b?diff(a[key],b[key]):''}</td>`:''}</tr>`;
  }
  el.innerHTML=`<div class="sec"><div class="sec-hd"><span>${L.cmp_title(SNAPS.length)}</span>
      <button class="btn" onclick="snapClear()">${L.cmp_clear}</button></div>
    <div class="sec-bd" style="overflow-x:auto"><table class="rank-tbl">${head}${body}</table>
      <div class="tbl-note">${B?L.cmp_note2:L.cmp_note1}</div></div></div>`;

      if(o.acc.enc){sl.enc={stat:o.acc.enc,val:21};}
      const gems=[];
      STATS.forEach(x=>{(o.gems&&o.gems[x]||[]).forEach(g=>gems.push({stat:x,lv:GEM_DISP[g.lv]||44}));});
      for(let i=0;i<5;i++)sl.gems[i]=gems[i]?{stat:gems[i].stat,lv:gems[i].lv}:{stat:'',lv:44};
      if(o.pend){
        const mo=o.pend.type==='태양'?3:o.pend.type==='달'?2:1;
        (o.pend.options||[]).slice(0,mo).forEach(op=>{if(op&&sl.pend[op.stat]!==undefined)sl.pend[op.stat]+=Number(op.val)||0;});
      }
      const src=c.entry||(c.spId!=null?S.spx.list[c.spId]:null);
      if(src){sl.sp=(src.sp||[]).slice(0,4).map(o2=>({stat:o2.stat||'',type:o2.type||''}));sl.bonus=src.bonus||'';}
    });
  });
  try{localStorage.setItem(MANUAL_KEY,JSON.stringify(st));}catch(e){alert(L.err+e.message);return;}
  location.href=MANUAL_URL;
}
// 수동 계산기 드래곤 → 내 드래곤 탭으로 가져오기

// 대상 드래곤 (정령은 비워둔 기본 후보)
function spxBaseDragons(ti){
  const t=TEAMS[ti];
  if(S.spx.target==='mine'){
    return teamCandidates(ti).map(c=>({...c}));
  }
  if(t.kind==='gang'){
    const out=[];const useOwn=ownHas('gang');
    ATTRS.forEach(attr=>gangDb(attr).forEach(g=>{
      const dt=findType(g.ko);if(!dt||!D.BASE[S.spx.grade][dt])return;
      const own=useOwn?ownN('gang',attr+'|'+g.ko):1;if(!own)return;
      out.push({id:'F0-'+attr+'-'+g.ko,attr,name:g.ko,en:g.en,img:g.img,imgStage:8,own,
        sub:attrLbl(attr)+' · '+typeLbl(dt)+' · '+S.spx.grade,base:D.BASE[S.spx.grade][dt]});
    }));
    return out;
  }
  const seen=new Set(),out=[];const useOwn2=ownHas(String(t.lv));
  D.GRADE.filter(g=>g.lv===t.lv&&/ SSS$/.test(g.ko)).forEach(g=>{
    const k=g.ko+'|'+g.elem;if(seen.has(k))return;seen.add(k);
    const own=useOwn2?ownN(String(t.lv),g.elem+'|'+g.ko):1;if(!own)return;
    out.push({id:'F'+ti+'-'+g.did+'-'+g.ko,attr:g.elem,name:g.ko,en:g.en,did:g.did,img:g.did,imgStage:4,own,
      sub:attrLbl(g.elem)+' · Lv.'+t.lv,base:{hp:g.hp,atk:g.atk,def:g.def},sk:g.sk});
  });
  return out;
}
async function spxMakeSets(shapes,pends,onProg){
  const P=typeof onProg==='function'?onProg:()=>{};
  const spirits=S.spx.list.map((x,j)=>({j,x,sp:procSpirit(x),label:spxLabel(x,j)+' \u00b7 '+spxOptText(x)})).filter(o=>spxValid(o.x));
  const variants=[...spirits,{j:null,x:null,sp:procSpirit(null),label:L.spx_nosp}];
  const isAll=S.spx.target==='all';
  // 1단계: 팀별 대상 드래곤 추리기 (장비 없이 가장 좋은 정령 기준)
  const plans=[];
  for(let ti=0;ti<3;ti++){
    let dragons=spxBaseDragons(ti);
    if(isAll){
      const scored=[];
      for(let i=0;i<dragons.length;i++){
        const d=dragons[i];let bs=-Infinity;
        variants.forEach(v=>{const r=calcOption({...d,sp:v.sp},NO_ACC,null,{hp:0,atk:0,def:0});if(r.m>bs)bs=r.m;});
        scored.push({d,best:bs});
        if((i&127)===127){P(((ti+(i+1)/dragons.length)/3)*0.3);await tick();}
      }
      const cap=ownHas(spxSecOf(ti))?SPX_TOP_OWN:SPX_TOP;
      dragons=scored.sort((a,b)=>b.best-a.best).slice(0,cap).map(x=>x.d);
    }
    plans.push(dragons);
    P(((ti+1)/3)*0.3);await tick();
  }
  // 2단계: 드래곤×정령 셋팅 후보 만들기
  const totalD=plans.reduce((s,d)=>s+d.length,0)||1;let done=0;
  const res=[];
  for(let ti=0;ti<3;ti++){
    let sets=[];
    for(const d of plans[ti]){
      let all=[];
      variants.forEach(v=>{
        const cand={...d,sp:v.sp,spId:v.j,spLabel:v.label,entry:null};
        all=all.concat(diversifyOpts(buildOptions(cand,shapes,pends),SPX_PER_SP));
      });
      all.sort((a,b)=>b.m-a.m);
      if(all.length)sets.push({cand:all[0].cand,opts:all});
      done++;P(0.3+done/totalD*0.7);await tick();
    }
    if(isAll)sets=spxOwnExpand(sets);
    res.push(sets);
  }
  return res;
}
// ── 배분 결과를 내 드래곤 탭에 적용 ────────────────────────
let SPX_UNDO=null,SPX_LAST=null,SPX_MS=0;

function spxApply(){
  if(!SPX_LAST||!SPX_LAST.filled)return;
  if(!confirm(L.spx_apply_confirm))return;
  SPX_UNDO=JSON.parse(JSON.stringify(S.teams));
  let set=0,add=0;
  const taken=new Set(); // 같은 드래곤이 여러 마리 배분되면 카드도 그만큼 만든다
  SPX_LAST.decks.forEach((deck,ti)=>{
    if(!deck)return;
    deck.forEach(o=>{
      const src=o.cand.spId!=null?S.spx.list[o.cand.spId]:null;
      const spOf=()=>src
        ?src.sp.map((x,k)=>({stat:STATS.includes(x.stat)?x.stat:'',type:(x.type==='+'||x.type==='%')?x.type:SP_DEF_TYPE(k)}))
        :mkEntry().sp;
      let en=S.teams[ti].find(x=>x.attr===o.cand.attr&&x.name===o.cand.name&&!taken.has(x));
      if(!en){
        en=mkEntry();en.attr=o.cand.attr;en.name=o.cand.name;
        if(TEAMS[ti].kind==='gang'){en.dtype=findType(o.cand.name);en.grade=S.spx.target==='all'?S.spx.grade:'9.0';}
        S.teams[ti].push(en);OPEN_ATTR[ti].add(en.attr);add++;
      }else set++;
      taken.add(en);
      en.sp=spOf();
      en.bonus=src?(src.bonus||''):'';
    });
  });
  OPEN_CARD.clear();
  renderDragonTeams();renderSpecLine();renderSpxSetting();spxRerender();save();
  alert(L.spx_apply_done(set,add));
  setPage('dragon');
}

async function spxRun(){
  if (!await ChamAccess.requireAccess()) return;
  const btn=document.getElementById('spx-run');
  btn.disabled=true;btn.textContent=L.running_p(0);progBar(btn,0);
  save();
  await tick();
  try{
    loadSpec();

    let last=-1;

      const v=Math.max(0,Math.min(99,Math.round(p)));
      if(v!==last){last=v;btn.textContent=L.running_p(v);progBar(btn,v);}
    });
    SPX_LAST=best;SPX_MS=performance.now()-t0;SPX_UNDO=null;
    renderResult(best,SPX_MS,'spx-result',ti=>S.spx.target==='mine'&&teamCandidates(ti).length<3?L.team_need3:L.team_fail);
    const el=document.getElementById('spx-result');
    if(best&&best.filled){
      const used=new Set();best.decks.forEach(d=>d&&d.forEach(o=>{if(o.cand.spId!=null)used.add(o.cand.spId);}));
      const left=S.spx.list.map((x,j)=>({x,j})).filter(o=>spxValid(o.x)&&!used.has(o.j));

        <div class="sec-bd" style="font-size:12px;line-height:1.8;color:var(--text2)">${left.length?left.map(o=>`${esc(spxLabel(o.x,o.j))} <span style="color:var(--dim)">(${esc(spxOptText(o.x))})</span>`).join('<br>'):L.spx_left_none}</div></div>`);
    }
  }catch(e){console.error(e);alert(L.err+e.message);}
  renderSpxSetting();
}
