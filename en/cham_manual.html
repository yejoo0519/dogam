  const DB=window.DRAGON_TYPE_DB||{};const key=normName(name);if(!key)return'';

          sp:s.sp.map((o,i)=>({...o,...((q.sp||[])[i]||{})}))};
      }))};
    if(!(S.tab>=0&&S.tab<3))S.tab=0;
  }catch(e){console.warn(e);}
}

// ── 계산 (엑셀 최종계산(챔대용) 공식) ─────────────────────────
const INT=x=>Math.floor(x+1e-9);
function baseOf(ti,slot){
  if(TEAMS[ti].kind==='gang'){
    if(!gangOf(slot)||!slot.dtype||!D.BASE[slot.grade])return null;
    return D.BASE[slot.grade][slot.dtype]||null;
  }
  const g=gradeOf(slot,TEAMS[ti].lv);
  return g?{hp:g.hp,atk:g.atk,def:g.def}:null;
}
function calcSlot(ti,slot){
  const base=baseOf(ti,slot);
  if(!base)return null;
  const acc=D.ACC.find(a=>a.ko===slot.acc);
  const pot=D.POTION.find(p=>p.ko===slot.potion);
  const out={buffs:[]};
  STATS.forEach(st=>{
    const gem=slot.gems.reduce((s,g)=>s+(g.stat===st&&GEM[g.lv]?GEM[g.lv][st]:0),0);
    const statSum=base[st]+gem;
    const potion=pot?pot[st]:0;
    const accP=acc?acc[st]:0;
    const encP=slot.enc.stat===st?(Number(slot.enc.val)||0)/100:0;
    const pendP=(Number(slot.pend[st])||0)/100;
    let spP=0,spF=0;
    slot.sp.forEach((o,i)=>{
      if(o.stat!==st)return;
      if(o.type==='%')spP+=SP_PCT[i+1];
      else if(o.type==='+')spF+=SP_PLUS[st][i+1];
    });
    const bonus=slot.bonus===st?SP_BONUS[st]:0;
    const coll=COLL[st];
    const buffP=(S.buff[st]&&S.buff[st]===slot.attr)?(st==='def'?0.5:0.4):0;
    if(buffP)out.buffs.push(st);
    const s1=INT((statSum+potion)*(1+accP+encP));
    const s2=INT(s1*(1+SPIRIT_W*spP)+(SPIRIT_W*spF)*(1+SPIRIT_W*spP));
    const s3=INT(s2*(1+pendP))+bonus+coll;
    out[st]=INT(s3*(1+buffP));
  });
  out.eval=out.hp+out.atk*4+out.def*4;
  out.bv=out.hp*out.atk*out.def;
  return out;
}

const typeLbl=t=>IS_EN?(L.dtype[t]||t):t;

const opt=(v,label,cur)=>`<option value="${esc(v)}"${String(v)===String(cur)?' selected':''}>${esc(label)}</option>`;
const statOpts=cur=>opt('','—',cur)+STATS.map(s=>opt(s,statLbl(s),cur)).join('');
const attrOpts=cur=>opt('',L.pick_attr,cur)+ATTRS.map(a=>opt(a,attrLbl(a),cur)).join('');

function cardHtml(ti,si){
  const slot=S.teams[ti][si];const team=TEAMS[ti];
  let img='',title=L.no_dragon,sub='',skill='';
  let pick='';
  if(team.kind==='gang'){
    const g=gangOf(slot);
    if(g){img=imgUrl(g.img);title=nm(g);sub=[attrLbl(slot.attr),slot.dtype?typeLbl(slot.dtype):'',slot.grade].filter(Boolean).join(' · ');}
    pick=`<div class="f2">
        <select onchange="setAttr(${ti},${si},this.value)">${attrOpts(slot.attr)}</select>
        ${searchBox(ti,si,g?nm(g):'')}
        ${g&&slot.dtype
          ?`<select disabled title="${esc(L.type_fixed)}"><option>${esc(typeLbl(slot.dtype))}</option></select>`
          :`<select onchange="S.teams[${ti}][${si}].dtype=this.value;onChange(true)" ${g?'':'disabled'}>${opt('',L.pick_type,slot.dtype)}${DTYPES.map(t=>opt(t,typeLbl(t),slot.dtype)).join('')}</select>`}
        <select onchange="S.teams[${ti}][${si}].grade=this.value;onChange(true)">${GRADES.map(x=>opt(x,x,slot.grade)).join('')}</select>
      </div>`;
  }else{
    const g=gradeOf(slot,team.lv);
    if(g){img=imgUrl(g.did,4);title=nm(g);sub=attrLbl(slot.attr)+' · Lv.'+team.lv;if(g.sk)skill=`<span class="skill">${esc(L.skill[g.sk]||g.sk)}</span>`;}
    pick=`<div class="f1">
        <select onchange="setAttr(${ti},${si},this.value)">${attrOpts(slot.attr)}</select>
        ${searchBox(ti,si,g?nm(g):'')}
      </div>`;
  }
  const base=baseOf(ti,slot);
  const baseLine=base?`<div class="base-line"><span class="c-hp">${statLbl('hp')} ${base.hp}</span><span class="c-atk">${statLbl('atk')} ${base.atk}</span><span class="c-def">${statLbl('def')} ${base.def}</span></div>`:'';

  const gems=slot.gems.map((g,i)=>`<div class="gem-row"><span class="k">${L.gem} ${i+1}</span>
      <select onchange="S.teams[${ti}][${si}].gems[${i}].stat=this.value;onChange()">${statOpts(g.stat)}</select>
      <select onchange="S.teams[${ti}][${si}].gems[${i}].lv=+this.value;onChange()">${GEM_LVS.map(l=>opt(l,L.gem_lv(l),g.lv)).join('')}</select></div>`).join('');

  const pend=`<div class="row3">${STATS.map(st=>`<label class="c-${st}">${statLbl(st)} %<input type="number" min="0" step="1" value="${Number(slot.pend[st])||0}" oninput="S.teams[${ti}][${si}].pend.${st}=Math.max(0,parseFloat(this.value)||0);onChange()"></label>`).join('')}</div>`;

  const acc=D.ACC.find(a=>a.ko===slot.acc);
  const accInfo=acc?STATS.filter(st=>acc[st]).map(st=>statLbl(st)+' '+Math.round(acc[st]*100)+'%').join(' · '):'';
  const accSel=`<select style="width:100%" onchange="S.teams[${ti}][${si}].acc=this.value;onChange(true)">${opt('',L.none,slot.acc)}${D.ACC.map(a=>opt(a.ko,nm(a),slot.acc)).join('')}</select>`;
  const potSel=`<select onchange="S.teams[${ti}][${si}].potion=this.value;onChange()">${opt('',L.none,slot.potion)}${D.POTION.map(p=>opt(p.ko,nm(p),slot.potion)).join('')}</select>`;
  const enc=`<div class="f2" style="grid-template-columns:1fr 1fr 64px">${potSel}
      <select onchange="S.teams[${ti}][${si}].enc.stat=this.value;onChange()">${opt('',L.enc_none,slot.enc.stat)}${STATS.map(s=>opt(s,L.enc+' '+statLbl(s),slot.enc.stat)).join('')}</select>
      <input type="number" min="0" step="1" value="${Number(slot.enc.val)||0}" title="%" oninput="S.teams[${ti}][${si}].enc.val=Math.max(0,parseFloat(this.value)||0);onChange()"></div>`;

  const sp=slot.sp.map((o,i)=>{
    const v=o.stat&&o.type?(o.type==='%'?'+'+Math.round(SP_PCT[i+1]*100)+'%':'+'+SP_PLUS[o.stat][i+1]):'';
    return `<div class="sp-row"><span class="k">${L.opt(i+1)}</span>
      <select onchange="S.teams[${ti}][${si}].sp[${i}].stat=this.value;onChange(true)">${statOpts(o.stat)}</select>
      <select onchange="S.teams[${ti}][${si}].sp[${i}].type=this.value;onChange(true)">${opt('','—',o.type)}${opt('+','(+)',o.type)}${opt('%','(%)',o.type)}</select>
      <span class="v">${v}</span></div>`;
  }).join('');
  const bonus=`<div class="sp-row" style="grid-template-columns:40px 1fr"><span class="k">${L.bonus}</span>
      <select onchange="S.teams[${ti}][${si}].bonus=this.value;onChange()">${opt('','—',slot.bonus)}${STATS.map(s=>opt(s,statLbl(s)+' (+'+SP_BONUS[s]+')',slot.bonus)).join('')}</select></div>`;

  return `<div class="card">
    <div class="card-hd">
      ${img?`<img class="card-img" src="${esc(img)}" onerror="this.style.visibility='hidden'" alt="">`:`<div class="card-img"></div>`}
      <div><div class="card-name">${esc(title)}${skill}</div><div class="card-sub">${esc(sub)}</div></div>
      <div class="card-slot">${L.slot(si+1)}</div>
    </div>
    <div class="card-bd">
      <div class="grp"><div class="grp-t">${L.dragon}</div>${pick}${baseLine?'<div style="margin-top:6px">'+baseLine+'</div>':''}</div>
      <div class="grp"><div class="grp-t">${L.gems}</div>${gems}</div>
      <div class="grp"><div class="grp-t">${L.pendant}</div>${pend}</div>
      <div class="grp"><div class="grp-t">${L.acc}<span>${esc(accInfo)}</span></div>${accSel}</div>
      <div class="grp"><div class="grp-t">${L.potion_enc}</div>${enc}</div>
      <div class="grp"><div class="grp-t">${L.spirit}<span>${L.spirit_note}</span></div>${sp}${bonus}</div>
    </div>
    <div class="result" id="res-${ti}-${si}"></div>
  </div>`;
}
function resultHtml(ti,si){
  const r=calcSlot(ti,S.teams[ti][si]);
  if(!r)return `<div class="empty-note">${L.need_dragon}</div>`;
  const badge=st=>r.buffs.includes(st)?`<span class="buff-badge">${st==='def'?'+50%':'+40%'}</span>`:'';
  return `<div class="res-stats">${STATS.map(st=>`<div><small class="c-${st}">${statLbl(st)}${badge(st)}</small><b class="c-${st}">${fmt(r[st])}</b></div>`).join('')}</div>
    <div class="res-sum"><span>EVAL <b>${fmt(r.eval)}</b></span><span>${L.bv} <b>${fmt(r.bv)}</b></span></div>`;

        :`<tr><td class="nm" style="color:var(--dim)">${L.slot(si+1)} —</td><td colspan="5" style="color:var(--dim)">—</td></tr>`;

// ── 드래곤 검색 ───────────────────────────────────────────────
function searchBox(ti,si,val){
  return `<div class="ds-wrap"><input class="ds-in" id="ds-in-${ti}-${si}" value="${esc(val)}" placeholder="${esc(L.search_ph)}" autocomplete="off"
      onfocus="this.dataset.d='';this.select();dsFilter(${ti},${si},this.value)" oninput="this.dataset.d='1';dsFilter(${ti},${si},this.value)" onblur="dsBlur(${ti},${si},this)" onkeydown="if(event.key==='Escape')this.blur()">
    <div class="ds-drop" id="ds-${ti}-${si}"></div></div>`;
}
function dsCandidates(ti,si,q){
  const team=TEAMS[ti];const slot=S.teams[ti][si];const key=normName(q);
  const attrs=slot.attr?[slot.attr]:ATTRS;
  const hit=(d,extra)=>{if(!key)return true;const names=[d.ko,d.en,...(extra||[])];return names.some(n=>n&&normName(n).includes(key));};
  let list=[];
  if(team.kind==='gang'){
    const DB=window.DRAGON_TYPE_DB||{};
    const aliasOf=name=>{for(const l of Object.values(DB)){if(!Array.isArray(l))continue;for(const e of l){if(e&&typeof e==='object'&&normName(e.name)===normName(name))return e.aliases||[];}}return[];};
    attrs.forEach(a=>gangList(a).forEach(d=>{if(hit(d,aliasOf(d.ko)))list.push({d,attr:a,img:imgUrl(d.img),meta:attrLbl(a)});}));
  }else{
    attrs.forEach(a=>gradeList(a,team.lv).forEach(d=>{if(hit(d))list.push({d,attr:a,img:imgUrl(d.did,4),meta:attrLbl(a)+' · '+d.ev});}));
  }
  return list.slice(0,40);
}
function dsFilter(ti,si,q){
  const drop=document.getElementById(`ds-${ti}-${si}`);if(!drop)return;
  const list=dsCandidates(ti,si,q);
  drop.innerHTML=list.length?list.map(x=>`<div class="ds-item" onmousedown="event.preventDefault();dsPick(${ti},${si},'${esc(x.attr)}','${esc(x.d.ko).replace(/'/g,"\\'")}')">
      <img src="${esc(x.img)}" onerror="this.style.visibility='hidden'" alt=""><span>${esc(nm(x.d))}</span><span class="m">${esc(x.meta)}</span></div>`).join('')
    :`<div class="ds-empty">${L.no_result}</div>`;
  drop.classList.add('open');
}
let _dsLock=false;
function dsBlur(ti,si,el){
  const drop=document.getElementById(`ds-${ti}-${si}`);if(drop)drop.classList.remove('open');
  if(_dsLock)return; // 드롭다운 선택 처리 중
  const inp=el||document.getElementById(`ds-in-${ti}-${si}`);const slot=S.teams[ti][si];
  const d=TEAMS[ti].kind==='gang'?gangOf(slot):gradeOf(slot,TEAMS[ti].lv);
  if(inp){
    // 사용자가 이 포커스 동안 직접 지운 경우에만 선택 해제
    if(inp.dataset.d&&inp.value.trim()===''&&slot.name){slot.name='';slot.dtype='';onChange(true);return;}
    inp.value=d?nm(d):'';
    inp.dataset.d='';
  }
}
function dsPick(ti,si,attr,name){
  _dsLock=true;
  const s=S.teams[ti][si];
  s.attr=attr;s.name=name;
  s.dtype=TEAMS[ti].kind==='gang'?findType(name):'';
  // 재렌더로 요소가 바뀐 자리에 이어지는 click/mouseup이 닿지 않게 한 번 삼킴
  const swallow=e=>{e.stopPropagation();e.preventDefault();};
  ['click','mouseup'].forEach(t=>document.addEventListener(t,swallow,{capture:true,once:true}));
  setTimeout(()=>{['click','mouseup'].forEach(t=>document.removeEventListener(t,swallow,{capture:true}));_dsLock=false;},250);
  onChange(true);
}

// ── 자동 계산기로 보내기 ───────────────────────────────────
const AUTO_KEY=SAVE_KEY.replace('_cham_manual','_cham_auto');
function sendToAuto(){
  const rows=[];
  S.teams.forEach((team,ti)=>team.forEach(slot=>{
    if(!slot.attr||!slot.name)return;
    if(!calcSlot(ti,slot))return;
    rows.push({ti,slot});
  }));
  if(!rows.length){alert(L.send_none);return;}
  if(!confirm(L.send_confirm(rows.length)))return;
  let A=null;
  try{A=JSON.parse(localStorage.getItem(AUTO_KEY)||'null');}catch(e){}
  if(!A||typeof A!=='object')A={};
  if(!Array.isArray(A.teams)||A.teams.length!==3)A.teams=[[],[],[]];
  let added=0;
  rows.forEach(({ti,slot})=>{
    const list=A.teams[ti]=Array.isArray(A.teams[ti])?A.teams[ti]:[];
    if(list.some(en=>en&&en.attr===slot.attr&&en.name===slot.name))return;
    list.push({uid:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
      attr:slot.attr,name:slot.name,
      dtype:TEAMS[ti].kind==='gang'?slot.dtype:'',grade:slot.grade||'9.0',
      sp:(slot.sp||[]).slice(0,4).map((o,k)=>({stat:o&&o.stat||'',type:(o&&(o.type==='+'||o.type==='%'))?o.type:(k===3?'+':'%')})),
      bonus:slot.bonus||''});
    added++;
  });
  if(!added){alert(L.send_dup);return;}
  // 버프도 함께 넘김 (자동 계산기의 현재 라운드에 반영)
  if(Array.isArray(A.rounds)&&A.rounds[A.round>=0?A.round:0]){
    A.rounds[A.round>=0?A.round:0].buff={...S.buff};
  }
  try{localStorage.setItem(AUTO_KEY,JSON.stringify(A));}catch(e){alert(L.send_fail+e.message);return;}
  if(confirm(L.send_done(added)))location.href='./cham_auto.html';
}
