<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Champion League Manual Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<script src="../dragon-data.js"></script>
<link id="theme-css" rel="stylesheet" href="../theme-dark.css">
<script src="../theme.js"></script>
<style>
[data-theme="dark"]{
  --bg:#0e1116;--bg2:#161a22;--bg3:#1c212c;
  --border:#23293a;--border2:#1b1f2a;--border3:#2d3447;
  --text:#eaecf2;--text2:#b3b9c7;--text3:#7d8597;--text4:#565d6e;
  --accent:#7aa2f7;--accent-bg:rgba(122,162,247,0.12);--accent-border:rgba(122,162,247,0.30);
}
[data-theme="light"]{
  --bg:#f7f7f8;--bg2:#ffffff;--bg3:#f1f2f4;
  --border:#e6e7ea;--border2:#eeeff2;--border3:#d4d6db;
  --text:#15171c;--text2:#4a4d57;--text3:#71757f;--text4:#9aa0aa;
  --accent:#2f6fed;--accent-bg:rgba(47,111,237,0.10);--accent-border:rgba(47,111,237,0.32);
}
[data-theme="beige"]{
  --bg:#f3ecdd;--bg2:#faf3e2;--bg3:#ebe0c7;
  --border:#d8caa8;--border2:#e1d4b3;--border3:#c0ad84;
  --text:#2a2316;--text2:#5a4e34;--text3:#837553;--text4:#a99971;
  --accent:#b06a1e;--accent-bg:rgba(176,106,30,0.10);--accent-border:rgba(176,106,30,0.32);
}
:root{
  --sf:var(--bg2);--sf2:var(--bg3);--bd:var(--border);
  --gold:var(--accent);--dim:var(--text3);--dimmer:var(--text4);
  --red:#f87171;--green:#4ade80;
  --hpc:#fbbf24;--atc:#f87171;--dfc:#60a5fa;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nanum Gothic',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;padding-bottom:60px}
.hd{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--sf);border-bottom:2px solid var(--gold);position:sticky;top:0;z-index:100}
.hd-back{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:1px solid var(--bd);background:var(--sf2);color:var(--text2);text-decoration:none;font-size:16px;flex-shrink:0}
.hd-icon{font-size:26px}.hd-t{font-size:15px;font-weight:800;color:var(--gold)}.hd-s{font-size:11px;color:var(--dim);margin-top:2px}
.wrap{max-width:1240px;margin:0 auto;padding:14px 20px}
.sec{background:var(--sf);border:1px solid var(--bd);border-radius:8px;margin-bottom:14px;overflow:hidden}
.sec-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 16px;background:var(--sf2);border-bottom:1px solid var(--bd);font-size:12px;font-weight:800;color:var(--gold)}
.sec-bd{padding:12px 16px}
select,input[type=number]{background:var(--sf2);border:1px solid var(--bd);color:var(--text);padding:5px 7px;border-radius:5px;font-family:inherit;font-size:13px;min-width:0}
select:focus,input:focus{outline:none;border-color:var(--gold)}
input[type=number]{width:100%}
.btn{background:none;border:1px solid var(--gold);color:var(--gold);padding:5px 12px;border-radius:5px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:700}
.btn-red{background:none;border:1px solid var(--red);color:var(--red);padding:5px 12px;border-radius:5px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:700}
.common-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.common-grid{grid-template-columns:1fr}}
.lbl{font-size:11px;color:var(--dim);margin-bottom:5px;font-weight:700}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.row3 label{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:800}
.c-hp{color:var(--hpc)}.c-atk{color:var(--atc)}.c-def{color:var(--dfc)}

.team-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.team-tab{flex:1;min-width:90px;padding:10px 8px;background:var(--sf);border:1px solid var(--bd);border-radius:8px;color:var(--dim);font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;text-align:center;line-height:1.35}
.team-tab small{display:block;font-size:10px;font-weight:700;opacity:.8}
.team-tab.on{border-color:var(--gold);color:var(--gold);background:var(--accent-bg)}

.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:680px){.cards{grid-template-columns:1fr}}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.card-hd{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--sf2);border-bottom:1px solid var(--bd)}
.card-img{width:44px;height:44px;object-fit:contain;border-radius:8px;background:var(--sf);flex-shrink:0}
.card-name{font-size:14px;font-weight:800;line-height:1.3;word-break:keep-all}
.card-sub{font-size:11px;color:var(--dim);margin-top:2px}
.card-slot{margin-left:auto;font-size:11px;color:var(--dim);font-weight:800;white-space:nowrap}
.card-bd{padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.grp{border-top:1px dashed var(--bd);padding-top:9px}
.grp:first-child{border-top:none;padding-top:0}
.grp-t{font-size:11px;font-weight:800;color:var(--gold);margin-bottom:6px;display:flex;justify-content:space-between;gap:6px}
.grp-t span{color:var(--dim);font-weight:700}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.f1{display:grid;grid-template-columns:1fr;gap:6px}
.gem-row,.sp-row{display:grid;grid-template-columns:40px 1fr 1fr;gap:6px;align-items:center;margin-bottom:5px}
.sp-row{grid-template-columns:40px 1fr 1fr 58px}
.gem-row .k,.sp-row .k{font-size:11px;color:var(--dim);font-weight:700}
.sp-row .v{font-size:11px;color:var(--text2);text-align:right;font-weight:700}
.ds-wrap{position:relative}
.ds-in{width:100%;background:var(--sf2);border:1px solid var(--bd);color:var(--text);padding:5px 7px;border-radius:5px;font-family:inherit;font-size:13px}
.ds-in:focus{outline:none;border-color:var(--gold)}
.ds-drop{display:none;position:absolute;left:0;right:0;top:100%;margin-top:2px;max-height:240px;overflow:auto;background:var(--sf2);border:1px solid var(--gold);border-radius:6px;z-index:50;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.ds-drop.open{display:block}
.ds-item{display:flex;align-items:center;gap:8px;padding:6px 8px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--bd)}
.ds-item:last-child{border-bottom:none}
.ds-item:hover{background:var(--accent-bg)}
.ds-item img{width:26px;height:26px;object-fit:contain;border-radius:5px;flex-shrink:0}
.ds-item .m{margin-left:auto;font-size:10px;color:var(--dim);white-space:nowrap}
.ds-empty{padding:8px;font-size:12px;color:var(--dim);text-align:center}
.base-line{display:flex;gap:10px;font-size:12px;font-weight:800;flex-wrap:wrap}
.skill{font-size:10px;padding:1px 6px;border-radius:8px;border:1px solid var(--bd);color:var(--dim);margin-left:4px;font-weight:700}
.result{margin-top:auto;border-top:1px solid var(--bd);background:var(--sf2);padding:10px 12px}
.res-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.res-stats div{background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:6px 2px}
.res-stats b{display:block;font-size:16px}
.res-stats small{font-size:10px;color:var(--dim);font-weight:800}
.res-sum{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:12px;color:var(--dim);flex-wrap:wrap}
.res-sum b{color:var(--text)}
.buff-badge{display:inline-block;font-size:10px;font-weight:800;padding:1px 6px;border-radius:8px;border:1px solid var(--gold);color:var(--gold);margin-left:3px}
.empty-note{font-size:12px;color:var(--dim);text-align:center;padding:4px 0}

.sum-table{width:100%;border-collapse:collapse;font-size:12px}
.sum-table th{font-size:11px;color:var(--dim);padding:6px;border-bottom:1px solid var(--bd);text-align:center;white-space:nowrap}
.sum-table td{padding:6px;border-bottom:1px solid var(--bd);text-align:center}
.sum-table td.nm{text-align:left;font-weight:700}
.sum-table tr.team-sep td{background:var(--sf2);color:var(--gold);font-weight:800;text-align:left;font-size:11px}
.sum-scroll{overflow-x:auto}
.save-msg{font-size:11px;color:var(--green);margin-left:auto;white-space:nowrap}
</style>
</head>
<body>
<div class="hd">
  <a class="hd-back" href="./index.html?tab=calculator">←</a>
  <div class="hd-icon">🏆</div>
  <div><div class="hd-t">Champion League Manual Calculator</div><div class="hd-s">Final stats · EVAL · B-Val per team</div></div>
  <span class="save-msg" id="save-msg"></span>
</div>

<div class="wrap">
  <div class="sec">
    <div class="sec-hd"><span id="t-common"></span><button class="btn-red" onclick="resetAll()" id="t-reset"></button></div>
    <div class="sec-bd">
      <div class="lbl" id="t-buff"></div>
      <div class="row3" style="max-width:560px" id="buff-row"></div>
    </div>
  </div>

  <div class="team-tabs" id="team-tabs"></div>
  <div class="cards" id="cards"></div>

  <div class="sec" style="margin-top:14px">
    <div class="sec-hd"><span id="t-summary"></span></div>
    <div class="sec-bd sum-scroll"><table class="sum-table" id="sum-table"></table></div>
  </div>
</div>

function normName(n){return String(n||'').replace(/ 드래곤$/,'').replace(/\s+/g,'').toLowerCase();}
function findType(name){
  const DB=window.DRAGON_TYPE_DB||{};const key=normName(name);if(!key)return'';
  for(const [t,list] of Object.entries(DB)){
    if(!Array.isArray(list)||!DTYPES.includes(t))continue;
    for(const e of list){
      const names=typeof e==='string'?[e]:[e&&e.name,...((e&&e.aliases)||[])];
      if(names.some(x=>x&&normName(x)===key))return t;
    }
  }
  return'';
}

const INT=x=>Math.floor(x+1e-9);
function baseOf(ti,slot){
  if(TEAMS[ti].kind==='gang'){
    if(!gangOf(slot)||!slot.dtype||!D.BASE[slot.grade])return null;
    return D.BASE[slot.grade][slot.dtype]||null;
  }
  const g=gradeOf(slot,TEAMS[ti].lv);
  return g?{hp:g.hp,atk:g.atk,def:g.def}:null;
}
function calcSlot(ti,slot){
  const base=baseOf(ti,slot);
  if(!base)return null;
  const acc=D.ACC.find(a=>a.ko===slot.acc);
  const pot=D.POTION.find(p=>p.ko===slot.potion);
  const out={buffs:[]};
  STATS.forEach(st=>{
    const gem=slot.gems.reduce((s,g)=>s+(g.stat===st&&GEM[g.lv]?GEM[g.lv][st]:0),0);
    const statSum=base[st]+gem;
    const potion=pot?pot[st]:0;
    const accP=acc?acc[st]:0;
    const encP=slot.enc.stat===st?(Number(slot.enc.val)||0)/100:0;
    const pendP=(Number(slot.pend[st])||0)/100;
    let spP=0,spF=0;
    slot.sp.forEach((o,i)=>{
      if(o.stat!==st)return;
      if(o.type==='%')spP+=SP_PCT[i+1];
      else if(o.type==='+')spF+=SP_PLUS[st][i+1];
    });
    const bonus=slot.bonus===st?SP_BONUS[st]:0;
    const coll=COLL[st];
    const buffP=(S.buff[st]&&S.buff[st]===slot.attr)?(st==='def'?0.5:0.4):0;
    if(buffP)out.buffs.push(st);
    const s1=INT((statSum+potion)*(1+accP+encP));
    const s2=s1*(1+SPIRIT_W*spP)+(SPIRIT_W*spF)*(1+SPIRIT_W*spP);
    const s3=INT(s2*(1+pendP)+bonus+coll);
    out[st]=INT(s3*(1+buffP));
  });
  out.eval=out.hp+out.atk*4+out.def*4;
  out.bv=out.hp*out.atk*out.def;
  return out;
}

function renderCards(){
  const ti=S.tab;
  document.getElementById('cards').innerHTML=[0,1,2].map(si=>cardHtml(ti,si)).join('');
  renderResults();
}
function renderResults(){
  const ti=S.tab;
  [0,1,2].forEach(si=>{const el=document.getElementById(`res-${ti}-${si}`);if(el)el.innerHTML=resultHtml(ti,si);});
  renderSummary();
}
function renderSummary(){
  let html=`<tr><th style="text-align:left">${L.dragon}</th><th class="c-hp">${statLbl('hp')}</th><th class="c-atk">${statLbl('atk')}</th><th class="c-def">${statLbl('def')}</th><th>EVAL</th><th>${L.bv}</th></tr>`;
  TEAMS.forEach((t,ti)=>{
    html+=`<tr class="team-sep"><td colspan="6">${esc(L.team(ti+1))} · ${esc(t.kind==='gang'?L.kind_gang:L.kind_grade(t.lv))}</td></tr>`;
    S.teams[ti].forEach((slot,si)=>{
      const r=calcSlot(ti,slot);
      const d=t.kind==='gang'?gangOf(slot):gradeOf(slot,t.lv);
      const name=d?nm(d):'—';
      html+=r?`<tr><td class="nm">${esc(name)}</td><td class="c-hp">${fmt(r.hp)}</td><td class="c-atk">${fmt(r.atk)}</td><td class="c-def">${fmt(r.def)}</td><td>${fmt(r.eval)}</td><td>${fmt(r.bv)}</td></tr>`
        :`<tr><td class="nm" style="color:var(--dim)">${L.slot(si+1)} —</td><td colspan="5" style="color:var(--dim)">—</td></tr>`;
    });
  });
  document.getElementById('sum-table').innerHTML=html;
}

// ── 드래곤 검색 ───────────────────────────────────────────────
function searchBox(ti,si,val){
  return `<div class="ds-wrap"><input class="ds-in" id="ds-in-${ti}-${si}" value="${esc(val)}" placeholder="${esc(L.search_ph)}" autocomplete="off"
      onfocus="this.dataset.d='';this.select();dsFilter(${ti},${si},this.value)" oninput="this.dataset.d='1';dsFilter(${ti},${si},this.value)" onblur="dsBlur(${ti},${si},this)" onkeydown="if(event.key==='Escape')this.blur()">
    <div class="ds-drop" id="ds-${ti}-${si}"></div></div>`;
}
function dsCandidates(ti,si,q){
  const team=TEAMS[ti];const slot=S.teams[ti][si];const key=normName(q);
  const attrs=slot.attr?[slot.attr]:ATTRS;
  const hit=(d,extra)=>{if(!key)return true;const names=[d.ko,d.en,...(extra||[])];return names.some(n=>n&&normName(n).includes(key));};
  let list=[];
  if(team.kind==='gang'){
    const DB=window.DRAGON_TYPE_DB||{};
    const aliasOf=name=>{for(const l of Object.values(DB)){if(!Array.isArray(l))continue;for(const e of l){if(e&&typeof e==='object'&&normName(e.name)===normName(name))return e.aliases||[];}}return[];};
    attrs.forEach(a=>gangList(a).forEach(d=>{if(hit(d,aliasOf(d.ko)))list.push({d,attr:a,img:imgUrl(d.img),meta:attrLbl(a)});}));
  }else{
    attrs.forEach(a=>gradeList(a,team.lv).forEach(d=>{if(hit(d))list.push({d,attr:a,img:imgUrl(d.did,4),meta:attrLbl(a)+' · '+d.ev});}));
  }
  return list.slice(0,40);
}
function dsFilter(ti,si,q){
  const drop=document.getElementById(`ds-${ti}-${si}`);if(!drop)return;
  const list=dsCandidates(ti,si,q);
  drop.innerHTML=list.length?list.map(x=>`<div class="ds-item" onmousedown="event.preventDefault();dsPick(${ti},${si},'${esc(x.attr)}','${esc(x.d.ko).replace(/'/g,"\\'")}')">
      <img src="${esc(x.img)}" onerror="this.style.visibility='hidden'" alt=""><span>${esc(nm(x.d))}</span><span class="m">${esc(x.meta)}</span></div>`).join('')
    :`<div class="ds-empty">${L.no_result}</div>`;
  drop.classList.add('open');
}
let _dsLock=false;
function dsBlur(ti,si,el){
  const drop=document.getElementById(`ds-${ti}-${si}`);if(drop)drop.classList.remove('open');
  if(_dsLock)return; // 드롭다운 선택 처리 중
  const inp=el||document.getElementById(`ds-in-${ti}-${si}`);const slot=S.teams[ti][si];
  const d=TEAMS[ti].kind==='gang'?gangOf(slot):gradeOf(slot,TEAMS[ti].lv);
  if(inp){
    // 사용자가 이 포커스 동안 직접 지운 경우에만 선택 해제
    if(inp.dataset.d&&inp.value.trim()===''&&slot.name){slot.name='';slot.dtype='';onChange(true);return;}
    inp.value=d?nm(d):'';
    inp.dataset.d='';
  }
}
function dsPick(ti,si,attr,name){
  _dsLock=true;
  const s=S.teams[ti][si];
  s.attr=attr;s.name=name;
  s.dtype=TEAMS[ti].kind==='gang'?findType(name):'';
  // 재렌더로 요소가 바뀐 자리에 이어지는 click/mouseup이 닿지 않게 한 번 삼킴
  const swallow=e=>{e.stopPropagation();e.preventDefault();};
  ['click','mouseup'].forEach(t=>document.addEventListener(t,swallow,{capture:true,once:true}));
  setTimeout(()=>{['click','mouseup'].forEach(t=>document.removeEventListener(t,swallow,{capture:true}));_dsLock=false;},250);
  onChange(true);
}

// ── 입력 ─────────────────────────────────────────────────────
function onChange(rerender){
  if(rerender)renderCards();else renderResults();
  save();
}
function setAttr(ti,si,v){
  const s=S.teams[ti][si];
  if(s.attr===v)return;
  s.attr=v;s.name='';s.dtype='';
  onChange(true);
}
function setGang(ti,si,v){
  const s=S.teams[ti][si];
  s.name=v;s.dtype=v?findType(v):'';
  onChange(true);
}
function setGrade(ti,si,v){S.teams[ti][si].name=v;onChange(true);}
function resetAll(){
  if(!confirm(L.reset_confirm))return;
  const tab=S.tab;S=mkState();S.tab=tab;
  renderCommon();renderTabs();renderCards();save();
}

// ── 시작 ─────────────────────────────────────────────────────
function applyTexts(){
  document.getElementById('t-common').textContent=L.common;
  document.getElementById('t-reset').textContent=L.reset;
  document.getElementById('t-buff').textContent=L.buff;
  document.getElementById('t-summary').textContent=L.summary;
}
document.addEventListener('DOMContentLoaded',()=>{
  load();applyTexts();renderCommon();renderTabs();renderCards();
});
</script>
<script>
(function(){
  var link=document.getElementById('theme-css');
  if(!link)return;
  var sync=function(){
    var c=document.getElementById('custom-theme-style');
    if(c&&c.textContent&&c.textContent.length>0){document.documentElement.removeAttribute('data-theme');return;}
    var m=String(link.href||'').match(/theme-(dark|light|beige)\.css/);
    document.documentElement.setAttribute('data-theme',m?m[1]:'dark');
  };
  sync();
  new MutationObserver(sync).observe(link,{attributes:true,attributeFilter:['href']});
  new MutationObserver(sync).observe(document.head,{childList:true,subtree:true,characterData:true});
})();
</script>
