<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인</title>
<link id="theme-css" rel="stylesheet" href="./theme-dark.css">
<link rel="stylesheet" href="./ui.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="./theme.js"></script>
<style>.box{margin:24px auto;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:28px;width:100%;max-width:380px}
.box h2{font-size:18px;color:var(--text);margin-bottom:20px;text-align:center}
.field{margin-bottom:14px}
.field label{font-size:12px;color:var(--text2);margin-bottom:5px;display:block}
.field input{width:100%;padding:9px 12px;background:var(--bg3);border:1px solid var(--border3);border-radius:8px;color:var(--text);font-size:13px;font-family:inherit}
.field input:focus{outline:none;border-color:var(--accent)}
.btn{width:100%;padding:11px;background:var(--accent);border:none;border-radius:8px;color:#12151c;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:4px}
.btn:hover{opacity:0.9}
.msg{font-size:12px;margin-top:10px;text-align:center}
.msg.error{color:#ef5350}
.msg.success{color:#66bb6a}
.link{text-align:center;margin-top:14px;font-size:12px;color:var(--text4)}
.link a{color:var(--accent);text-decoration:none}
</style>
</head>
<body class="u">
<div class="u-app">
<main class="u-wrap narrow">
<div class="box">
 <h2>로그인</h2>
 <div class="field">
 <label>아이디</label>
 <input id="username" type="text" placeholder="아이디 입력">
 </div>
 <div class="field">
 <label>비밀번호</label>
 <input id="password" type="password" placeholder="비밀번호 입력">
 </div>
 <button class="btn" onclick="login()">로그인</button>
 <div class="msg" id="msg"></div>
 <div class="link"><a href="./register.html">계정이 없어요 → 회원가입</a></div>
 <div class="link" style="margin-top:8px"><a href="./account.html">아이디 · 비밀번호 찾기 / 닉네임 변경</a></div>
</div>
<script src="./sb_config.js"></script>
<script>// 로그인 직후 클라우드 스펙(활성 프리셋)을 계산기 로컬 키에 바로 반영 — my.html localSave와 동일한 키 구조
function syncSpecOnLogin(raw){
 const PRE='dv1sim';
 try{
 if(!raw)return;
 const sd=typeof raw==='string'?JSON.parse(raw):raw;
 if(!sd)return;
 const PK=PRE+'_spec_presets';
 const localPresetsRaw=localStorage.getItem(PK);
 const isV2=!!(sd.v===2&&Array.isArray(sd.presets)&&sd.presets.length);
 // 구버전 클라우드 + 로그아웃 상태에서 만든 로컬 프리셋 → 내 스펙 페이지에서 처리
 if(!isV2&&localPresetsRaw)return;
 const P=isV2?sd:{v:2,activeId:'p1',presets:[{id:'p1',name:'기본',data:sd}]};
 const act=P.presets.find(x=>x.id===P.activeId)||P.presets[0];
 P.activeId=act.id;
 const d=act.data||{};
 const hasDr=o=>!!o&&Object.values(o).some(a=>Array.isArray(a)&&a.some(x=>x&&x.name));
 let localSpec={};
 try{localSpec=JSON.parse(localStorage.getItem(PRE+'_spec')||'{}')||{};}catch(e){}
 let localActive=null;
 try{localActive=localPresetsRaw?JSON.parse(localPresetsRaw).activeId:null;}catch(e){}
 const canMerge=isV2?(!!localPresetsRaw&&localActive===act.id):true;
 let dragonCards=d.dragonCards||{};
 if(!hasDr(dragonCards)&&canMerge&&hasDr(localSpec.dragonCards)){
 dragonCards=localSpec.dragonCards;
 localStorage.setItem(PRE+'_dragon_pending','1');
 }else{
 localStorage.removeItem(PRE+'_dragon_pending');
 }
 const spec={accCards:d.accCards||[],gems:d.gems||{},pendants:d.pendants||[],coll:d.coll||{},dragonCards};
 act.data=spec;
 localStorage.setItem(PRE+'_spec',JSON.stringify(spec));
 localStorage.setItem(PK,JSON.stringify(P));
 const specFields={accCards:spec.accCards,gems:spec.gems,pendants:spec.pendants,coll:spec.coll};
 [PRE+'_pvp',PRE+'_noob',PRE+'_calculator'].forEach(key=>{
 try{const r=localStorage.getItem(key);const ex=r?JSON.parse(r):{};localStorage.setItem(key,JSON.stringify({...ex,...specFields}));}catch(e){}
 });
 [PRE+'_pvp',PRE+'_noob'].forEach(key=>{
 try{const r=localStorage.getItem(key);const ex=r?JSON.parse(r):{};localStorage.setItem(key,JSON.stringify({...ex,dragonCards}));}catch(e){}
 });
 }catch(e){console.warn('spec sync failed:',e);}
}
async function login() {
 const username = document.getElementById('username').value.trim();
 const password = document.getElementById('password').value;
 const msg = document.getElementById('msg');
 if(!username || !password){ msg.className='msg error'; msg.textContent='아이디와 비밀번호를 입력해주세요.'; return; }
 try {
 const hashed = await hashPassword(password);
 const rows = await supabase('GET', 'users', null, `?username=eq.${encodeURIComponent(username)}&password=eq.${hashed}`);
 if(!rows || rows.length === 0){ msg.className='msg error'; msg.textContent='아이디 또는 비밀번호가 틀렸습니다.'; return; }
 const user = rows[0];
 if(user.is_banned){ msg.className='msg error'; msg.textContent='이용이 제한된 계정입니다.'; return; }
 setUser({
 id: user.id,
 username: user.username,
 nickname: user.nickname || user.username,
 friend_code: user.friend_code || '',
 is_admin: user.is_admin
 });
 syncSpecOnLogin(user.spec_data);
 msg.className='msg success'; msg.textContent='로그인 성공!';
 const params = new URLSearchParams(location.search);
 const redirectTo = params.get('from') || './index.html';
 setTimeout(() =>location.href=redirectTo, 800);
 } catch(e) {
 msg.className='msg error'; msg.textContent='오류: ' + e.message;
 }
}
document.addEventListener('keydown', e =>{ if(e.key==='Enter') login(); });
</script>
<script>/* ── data-theme 동기화 (theme.js 연동) ── */
(function(){
 var link=document.getElementById('theme-css');
 if(!link)return;
 var sync=function(){
 var c=document.getElementById('custom-theme-style');
 if(c&&c.textContent&&c.textContent.length>0){document.documentElement.removeAttribute('data-theme');return;}
 var m=String(link.href||'').match(/theme-(dark|light|beige)\.css/);
 document.documentElement.setAttribute('data-theme',m?m[1]:'dark');
 };
 sync();
 new MutationObserver(sync).observe(link,{attributes:true,attributeFilter:['href']});
 new MutationObserver(sync).observe(document.head,{childList:true,subtree:true,characterData:true});
})();
</script>
</main>
</div>
<script src="./ui.js"></script>
<script>UI.shell({page:'login',title:'로그인',sub:''});</script>
</body>
</html>
