<script>
if (!globalThis.DV1_GUILD_READY) throw new Error("드래곤 데이터 로드 실패: 초기화 중단");

(function(){var link=document.getElementById('theme-css');if(!link)return;var sync=function(){var c=document.getElementById('custom-theme-style');if(c&&c.textContent&&c.textContent.length>0){document.documentElement.removeAttribute('data-theme');return;}var m=String(link.href||'').match(/theme-(dark|light|beige)\.css/);document.documentElement.setAttribute('data-theme',m?m[1]:'dark');};sync();new MutationObserver(sync).observe(link,{attributes:true,attributeFilter:['href']});new MutationObserver(sync).observe(document.head,{childList:true,subtree:true,characterData:true});})();

<script>
if (!globalThis.DV1_GUILD_READY) throw new Error("드래곤 데이터 로드 실패: 초기화 중단");


function renderSpecView(){
  const el=document.getElementById('spec-view-wrap');
  if(!el)return;
  const ENC_COL={atk:'#f87171',hp:'#fbbf24',def:'#60a5fa'};
  const ENC_LBL={atk:'공',hp:'체',def:'방'};
  const PEND_LBL={달:'달의 펜던트',태양:'태양의 펜던트',별:'별의 펜던트'};
  const PEND_IMG={달:'1336',태양:'1337',별:'1335'};
  const IB='https://raw.githubusercontent.com/yejoo0519/dogam/refs/heads/main';
  let gemRows='';
  for(const lv of [40,39,38,37]){
    const hp=S.gems?.hp?.[lv]||0,atk=S.gems?.atk?.[lv]||0,def=S.gems?.def?.[lv]||0;
    if(hp||atk||def)gemRows+=`<tr><td style="color:var(--dim);font-weight:700">${GEM_NAME[lv]||lv}젬 <span style="color:var(--dimmer);font-weight:400;font-size:10px">(기존 ${lv})</span></td><td class="sv-gem-hp">${hp||'-'}</td><td class="sv-gem-atk">${atk||'-'}</td><td class="sv-gem-def">${def||'-'}</td></tr>`;
  }
  const t={hp:0,atk:0,def:0};
  for(const s of ['hp','atk','def'])for(const lv of [37,38,39,40])t[s]+=(S.gems?.[s]?.[lv]||0);
  if(gemRows)gemRows+=`<tr style="border-top:2px solid var(--bd)"><td style="color:var(--dim);font-size:10px">합계</td><td class="sv-gem-hp">${t.hp||'-'}</td><td class="sv-gem-atk">${t.atk||'-'}</td><td class="sv-gem-def">${t.def||'-'}</td></tr>`;
  const gemH=gemRows?`<table class="sv-gem-table"><thead><tr><th></th><th class="sv-gem-hp">체</th><th class="sv-gem-atk">공</th><th class="sv-gem-def">방</th></tr></thead><tbody>${gemRows}</tbody></table>`:`<div class="sv-empty">젬 없음</div>`;
  const accs=S.accCards||[];
  const accH=accs.length?accs.map(c=>{
    const a=ACC_DB.find(x=>x.n===c.name);
    const img=a&&a.img?`<img class="sv-item-img" src="${a.img}" onerror="this.style.display='none'">`:`<div style="width:28px;height:28px;flex-shrink:0"></div>`;
    const enc=c.enchant&&c.enchant!=='none'?`<span class="sv-enc" style="color:${ENC_COL[c.enchant]||'var(--dim)'};border-color:${ENC_COL[c.enchant]||'var(--bd)'}">${ENC_LBL[c.enchant]||c.enchant}</span>`:'';
    return `<div class="sv-item">${img}<span class="sv-item-name">${c.name||'<span style="color:var(--dimmer)">미선택</span>'}</span>${enc}</div>`;
  }).join(''):`<div class="sv-empty">장신구 없음</div>`;
  const pends=S.pendants||[];
  const pendH=pends.length?pends.map(p=>{
    if(!p.type)return'';
    const imgN=PEND_IMG[p.type]||'1335';
    const mo=p.type==='태양'?3:p.type==='달'?2:1;
    const opts=(p.options||[]).slice(0,mo).filter(o=>o&&o.stat).map(o=>`<span style="color:${o.stat==='hp'?'#fbbf24':o.stat==='atk'?'#f87171':'#60a5fa'}">${o.stat==='hp'?'체':o.stat==='atk'?'공':'방'}${o.val||0}%</span>`).join('<span style="color:var(--dim)"> / </span>');
    return `<div class="sv-item"><img class="sv-item-img" src="${IB}/item/${imgN}.png" onerror="this.style.display='none'"><div><div style="font-size:12px;font-weight:700">${PEND_LBL[p.type]||p.type}</div><div style="font-size:11px;color:var(--dim)">${opts||'옵션 없음'}</div></div></div>`;
  }).filter(Boolean).join(''):`<div class="sv-empty">펜던트 없음</div>`;
  const col=S.coll||{hp:0,atk:0,def:0};
  const colP=[];
  if(col.hp)colP.push(`<span class="sv-gem-hp">체 +${col.hp}</span>`);
  if(col.atk)colP.push(`<span class="sv-gem-atk">공 +${col.atk}</span>`);
  if(col.def)colP.push(`<span class="sv-gem-def">방 +${col.def}</span>`);
  const colH=colP.length?colP.join('<span style="color:var(--dim)"> · </span>'):`<span class="sv-empty">0</span>`;
  el.innerHTML=`<div class="sv-header"><div style="display:flex;align-items:center;gap:10px"><span style="font-size:15px;font-weight:800">내 스펙</span><span class="sv-badge">보기 전용</span></div><a href="./my.html" class="sv-edit-btn">my.html에서 수정 →</a></div>
  <div class="sv-grid">
    <div>
      <div class="sv-sec"><div class="sv-sec-hd">젬 보유량</div><div class="sv-sec-bd">${gemH}</div></div>
      <div class="sv-sec"><div class="sv-sec-hd">콜렉션</div><div class="sv-sec-bd"><div class="sv-coll-row">${colH}</div></div></div>
    </div>
    <div>
      <div class="sv-sec"><div class="sv-sec-hd">장신구 (${accs.length}개)</div><div class="sv-sec-bd" style="max-height:260px;overflow-y:auto">${accH}</div></div>
      <div class="sv-sec"><div class="sv-sec-hd">펜던트 (${pends.length}개)</div><div class="sv-sec-bd" style="max-height:220px;overflow-y:auto">${pendH}</div></div>
    </div>
  </div>`;
}

</script>
<script>
if (!globalThis.DV1_GUILD_READY) throw new Error("드래곤 데이터 로드 실패: 초기화 중단");


let _guildResult=null;
async function afterSimComplete(results){
  const wrap=document.getElementById('guild-send-wrap');
  if(!wrap)return;
  const lbl=document.getElementById('guild-send-label');
  const btn=document.getElementById('guild-send-btn');
  try{
    const top3=(results||[]).slice(0,3);
    if(!top3.length)return;
    let settingsJson=null;
    try{
      const statWithBuff=Math.round(top3.reduce((s,r)=>s+r.bv,0)/top3.length);
      const statNoBuff=Math.round(top3.reduce((s,r)=>{const c=r._calc||{};const nH=r.fH-(c.netBufH??c.bufH??0),nA=r.fA-(c.netBufA??c.bufA??0),nD=r.fD-(c.netBufD??c.bufD??0);return s+nH*nA*nD;},0)/top3.length);
      settingsJson={deck:top3.map(r=>({
        dragon:{
          name:r.dragon.name,attr:r.dragon.attr,dtype:r.dragon.dtype,
          grade:r.dragon.grade||'9.0',growth:r.dragon.growth||'강림(축복)',
          opts:r.dragon.opts||[],bonus:r.dragon.bonus||null
        },
        dragonImg:(typeof getDragonImgUrl==='function'?getDragonImgUrl(r.dragon.name):null),
        accName:r.accN,
        accImg:(()=>{try{const a=ACC_DB.find(x=>x.n===r.accN);return a&&a.img?a.img:null;}catch(e){return null;}})(),
        enc:r.enc,pend:r.pend,gemAlloc:r.alloc,
        fH:r.fH,fA:r.fA,fD:r.fD,bv:r.bv,
        bufH:r._calc?.bufH||0,bufA:r._calc?.bufA||0,bufD:r._calc?.bufD||0,
        debufH:r._calc?.debufH||0,debufA:r._calc?.debufA||0,debufD:r._calc?.debufD||0,
        buff:r.buff||{hp:0,atk:0,def:0},
        debuff:getDragonDebuffCounts(r.dragon)
      }))};
      _guildResult={statWithBuff,statNoBuff,settingsJson};
    }catch(e){console.warn('settingsJson 빌드 오류:',e);}
    const user=(typeof getUser==='function')?getUser():null;
    if(!user){lbl.innerHTML='<span style="color:var(--dimmer)">길드 전송은 로그인 후 이용 가능해요.</span>';btn.disabled=true;btn.textContent='이번 주 셋팅 전송';wrap.style.display='flex';return;}
    lbl.innerHTML='<span style="color:var(--dim)">길드 연동 확인 중...</span>';btn.disabled=true;btn.textContent='이번 주 셋팅 전송';wrap.style.display='flex';
    const members=await supabase('GET','guild_members',null,`?user_id=eq.${user.id}&status=eq.approved&select=guild_id,nickname,guilds(id,name)&limit=1`);
    if(!members||!members.length){lbl.innerHTML='<span style="color:var(--dimmer)">연동된 길드가 없어요.</span>';return;}
    const member=members[0];
    const seasons=await supabase('GET','guild_seasons',null,`?guild_id=eq.${member.guild_id}&closed_at=is.null&order=opened_at.desc&limit=1`);
    if(!seasons||!seasons.length){lbl.innerHTML='<span style="color:var(--dimmer)">진행 중인 회차가 없어요.</span>';return;}
    const season=seasons[0];
    if(_guildResult)Object.assign(_guildResult,{member,season});
    else _guildResult={...(settingsJson?{settingsJson}:{}),member,season};
    const exist=await supabase('GET','guild_weekly_settings',null,`?season_id=eq.${season.id}&user_id=eq.${user.id}&select=submitted_at&limit=1`);
    const gname=member.guilds?.name||'길드';
    if(exist&&exist.length){
      const t=new Date(exist[0].submitted_at).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
      lbl.innerHTML=`<span style="color:var(--green)">${gname} — 전송 완료 (${t})</span>`;
      btn.textContent='다시 전송';
    }else{
      lbl.innerHTML=`<span style="color:var(--dim)">${gname} · ${season.season_label}</span>`;
      btn.textContent='이번 주 셋팅 전송';
    }
    btn.disabled=false;
  }catch(e){
    console.error('afterSimComplete 오류:',e);
    lbl.innerHTML=`<span style="color:var(--dimmer)">오류: ${e.message||String(e)}</span>`;
    wrap.style.display='flex';
  }
}
async function sendToGuild(){
  if(!_guildResult){alert('먼저 시뮬레이션을 실행해주세요.');return;}
  const{statWithBuff,statNoBuff,member,season,settingsJson}=_guildResult;
  const user=getUser();if(!user){alert('로그인이 필요해요.');return;}
  const btn=document.getElementById('guild-send-btn');
  btn.disabled=true;btn.textContent='전송 중...';
  try{
    const exist=await supabase('GET','guild_weekly_settings',null,`?season_id=eq.${season.id}&user_id=eq.${user.id}&select=id&limit=1`);
    if(exist&&exist.length){
      await supabase('PATCH','guild_weekly_settings',{stat_no_buff:statNoBuff,stat_with_buff:statWithBuff,settings_json:settingsJson||null,submitted_at:new Date().toISOString()},`?id=eq.${exist[0].id}`);
    }else{
      await supabase('POST','guild_weekly_settings',{guild_id:member.guild_id,season_id:season.id,user_id:user.id,nickname:member.nickname,stat_no_buff:statNoBuff,stat_with_buff:statWithBuff,settings_json:settingsJson||null,submitted_at:new Date().toISOString()});
    }
    const t=new Date().toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
    const gname=member.guilds?.name||'길드';
    document.getElementById('guild-send-label').innerHTML=`<span style="color:var(--green)">${gname} — 전송 완료 (${t})</span>`;
    btn.textContent='다시 전송';btn.disabled=false;
    let el=document.getElementById('_guild-toast');
    if(!el){el=document.createElement('div');el.id='_guild-toast';el.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--gold);color:#0a0c18;padding:10px 24px;border-radius:8px;font-weight:800;font-size:14px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap';document.body.appendChild(el);}
    el.textContent='길드에 이번 주 셋팅을 전송했어요! ';el.style.opacity='1';
    setTimeout(()=>el.style.opacity='0',2800);
  }catch(e){alert('전송 오류: '+(e.message||'다시 시도해주세요.'));btn.disabled=false;btn.textContent='이번 주 셋팅 전송';}
}

</script>
