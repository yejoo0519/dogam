<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원가입</title>
<link id="theme-css" rel="stylesheet" href="./theme-dark.css">
<link rel="stylesheet" href="./ui.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="./theme.js"></script>
<style>.box{margin:24px auto;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:28px;width:100%;max-width:380px}
.box h2{font-size:18px;color:var(--text);margin-bottom:20px;text-align:center}
.field{margin-bottom:14px}
.field label{font-size:12px;color:var(--text2);margin-bottom:5px;display:block}
.field input{width:100%;padding:9px 12px;background:var(--bg3);border:1px solid var(--border3);border-radius:8px;color:var(--text);font-size:13px;font-family:inherit}
.field input:focus{outline:none;border-color:var(--accent)}
.field-hint{font-size:11px;color:var(--text4);margin-top:3px}
.field-hint.error{color:#ef5350}
.field-hint.success{color:#66bb6a}
.btn{width:100%;padding:11px;background:var(--accent);border:none;border-radius:8px;color:#12151c;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:4px}
.btn:hover{opacity:0.9}
.msg{font-size:12px;margin-top:10px;text-align:center}
.msg.error{color:#ef5350}
.msg.success{color:#66bb6a}
.link{text-align:center;margin-top:14px;font-size:12px;color:var(--text4)}
.link a{color:var(--accent);text-decoration:none}
.rec-code{font-family:'Courier New',monospace;font-size:24px;font-weight:800;letter-spacing:3px;color:var(--accent);background:var(--bg3);border:1px solid var(--border3);border-radius:8px;padding:14px 10px;text-align:center;margin:14px 0 8px;user-select:all;word-break:break-all}
.rec-desc{font-size:12px;color:var(--text2);text-align:center;line-height:1.7}
.rec-warn{font-size:11px;color:#ef5350;background:rgba(239,83,80,.08);border:1px solid rgba(239,83,80,.25);border-radius:8px;padding:9px 11px;margin:10px 0 12px;line-height:1.6}
.rec-copy{width:100%;padding:8px;background:none;border:1px solid var(--border3);border-radius:8px;color:var(--text);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.rec-check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);margin-bottom:6px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
</style>
</head>
<body class="u">
<div class="u-app">
<main class="u-wrap narrow">
<div class="box" id="reg-box">
 <h2>회원가입</h2>
 <div class="field">
 <label>아이디</label>
 <input id="username" type="text" placeholder="아이디 입력">
 </div>
 <div class="field">
 <label>닉네임</label>
 <input id="nickname" type="text" placeholder="닉네임 입력" oninput="checkNickname()">
 <div class="field-hint" id="nickname-hint">게시판에 표시되는 이름입니다.</div>
 </div>
 <div class="field">
 <label>비밀번호</label>
 <input id="password" type="password" placeholder="비밀번호 입력">
 </div>
 <div class="field">
 <label>비밀번호 확인</label>
 <input id="password2" type="password" placeholder="비밀번호 재입력">
 </div>
 <button class="btn" onclick="register()">가입하기</button>
 <div class="msg" id="msg"></div>
 <div class="link"><a href="./login.html">이미 계정이 있어요</a></div>
 <div class="link" style="margin-top:8px"><a href="./account.html">아이디 · 비밀번호 찾기 / 닉네임 변경</a></div>
</div>

<div class="box" id="rec-box" style="display:none">
 <h2>복구 코드</h2>
 <div class="rec-desc">비밀번호를 잊었을 때 <b>아이디 찾기 · 비밀번호 변경</b>에 쓰는 코드예요.<br>이 화면을 벗어나면 <b>다시 확인할 수 없어요.</b></div>
 <div class="rec-code" id="rec-code">-</div>
 <button type="button" class="rec-copy" id="rec-copy" onclick="copyRecovery()">복사</button>
 <div class="rec-warn">캡처하거나 메모장에 꼭 저장해두세요. 이 코드가 없으면 계정을 되찾을 수 없어요.</div>
 <label class="rec-check"><input type="checkbox" id="rec-ok" onchange="document.getElementById('rec-go').disabled=!this.checked">복구 코드를 저장했어요</label>
 <button class="btn" id="rec-go" disabled onclick="goLogin()">로그인하러 가기</button>
</div>

<script src="./sb_config.js"></script>
<script>let nicknameValid = false;
let nicknameTimer = null;

async function checkNickname() {
 const nickname = document.getElementById('nickname').value.trim();
 const hint = document.getElementById('nickname-hint');

 clearTimeout(nicknameTimer);

 if(nickname.length === 0) {
 hint.className = 'field-hint';
 hint.textContent = '게시판에 표시되는 이름입니다.';
 nicknameValid = false;
 return;
 }
 if(nickname.length < 2) {
 hint.className = 'field-hint error';
 hint.textContent = '닉네임은 2자 이상이어야 합니다.';
 nicknameValid = false;
 return;
 }

 // 타이핑 멈추고 400ms 후에 중복 확인 (API 요청 최소화)
 nicknameTimer = setTimeout(async () =>{
 try {
 const rows = await supabase('GET', 'users', null, `?nickname=eq.${encodeURIComponent(nickname)}&select=id`);
 if(rows && rows.length >0) {
 hint.className = 'field-hint error';
 hint.textContent = '이미 사용 중인 닉네임입니다.';
 nicknameValid = false;
 } else {
 hint.className = 'field-hint success';
 hint.textContent = '사용 가능한 닉네임입니다.';
 nicknameValid = true;
 }
 } catch(e) {
 nicknameValid = true;
 }
 }, 400);
}

// 복구 코드: 가입 시 1회 발급, 해시로만 저장
const REC_CHARS='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
let recoveryPlain='';
let recoverySaved=false;
function genRecoveryCode(){
 const buf=new Uint32Array(12);
 crypto.getRandomValues(buf);
 return Array.from(buf,n=>REC_CHARS[n%REC_CHARS.length]).join('');
}
function fmtRecovery(c){return c.replace(/(.{4})(?=.)/g,'$1-');}
async function copyRecovery(){
 const btn=document.getElementById('rec-copy');
 try{await navigator.clipboard.writeText(fmtRecovery(recoveryPlain));btn.textContent='✓ 복사됨!';}
 catch(e){const r=document.createRange();r.selectNodeContents(document.getElementById('rec-code'));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);}
}
function goLogin(){
 if(!document.getElementById('rec-ok').checked)return;
 recoverySaved=true;
 location.href='./login.html';
}
window.addEventListener('beforeunload',e=>{
 if(recoveryPlain&&!recoverySaved){e.preventDefault();e.returnValue='';}
});

async function register() {
 const username = document.getElementById('username').value.trim();
 const nickname = document.getElementById('nickname').value.trim();
 const password = document.getElementById('password').value;
 const password2 = document.getElementById('password2').value;
 const msg = document.getElementById('msg');

 if(!username || !password) { msg.className='msg error'; msg.textContent='아이디와 비밀번호를 입력해주세요.'; return; }
 if(!nickname) { msg.className='msg error'; msg.textContent='닉네임을 입력해주세요.'; return; }
 if(!nicknameValid) { msg.className='msg error'; msg.textContent='닉네임을 확인해주세요.'; return; }
 if(username.length < 2) { msg.className='msg error'; msg.textContent='아이디는 2자 이상이어야 합니다.'; return; }
 if(password.length < 4) { msg.className='msg error'; msg.textContent='비밀번호는 4자 이상이어야 합니다.'; return; }
 if(password !== password2) { msg.className='msg error'; msg.textContent='비밀번호가 일치하지 않습니다.'; return; }

 try {
 const hashed = await hashPassword(password);
 const code = genRecoveryCode();
 const recovery_code = await hashPassword(code);
 // friend_code는 보내지 않음 (빈 문자열은 UNIQUE 충돌)
 await supabase('POST', 'users', { username, nickname, password: hashed, recovery_code });
 recoveryPlain = code;
 msg.className='msg success'; msg.textContent='가입 완료!';
 document.getElementById('rec-code').textContent = fmtRecovery(code);
 document.getElementById('reg-box').style.display='none';
 document.getElementById('rec-box').style.display='';
 } catch(e) {
 if(e.message.includes('unique') || e.message.includes('duplicate')) msg.textContent='이미 사용 중인 아이디입니다.';
 else msg.textContent = '오류가 발생했습니다: ' + e.message;
 msg.className='msg error';
 }
}
</script>
<script>/* ── data-theme 동기화 (theme.js 연동) ── */
(function(){
 var link=document.getElementById('theme-css');
 if(!link)return;
 var sync=function(){
 var c=document.getElementById('custom-theme-style');
 if(c&&c.textContent&&c.textContent.length>0){document.documentElement.removeAttribute('data-theme');return;}
 var m=String(link.href||'').match(/theme-(dark|light|beige)\.css/);
 document.documentElement.setAttribute('data-theme',m?m[1]:'dark');
 };
 sync();
 new MutationObserver(sync).observe(link,{attributes:true,attributeFilter:['href']});
 new MutationObserver(sync).observe(document.head,{childList:true,subtree:true,characterData:true});
})();
</script>
</main>
</div>
<script src="./ui.js"></script>
<script>UI.shell({page:'register',title:'회원가입',sub:''});</script>
</body>
</html>
